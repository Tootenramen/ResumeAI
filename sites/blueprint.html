<style>
:root{
  --bg:#0b3b7a; --bg2:#082d5e; --line:#e3f1ff; --dim:rgba(227,241,255,.5); --faint:rgba(227,241,255,.16);
  --text:#f5faff; --mute:#c3dbf8; --hand:#ffe27a;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --cond:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --nav:46px; --pad:clamp(26px,5.4vw,84px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--text);font:400 1rem/1.65 var(--sans);overflow-x:hidden;
  background-color:var(--bg);
  background-image:
    radial-gradient(130% 90% at 50% 20%,rgba(255,255,255,.07),transparent 60%),
    linear-gradient(rgba(255,255,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.14) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:100% 100%,100px 100px,100px 100px,20px 20px,20px 20px;
  -webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px dashed var(--hand);outline-offset:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:8px;top:-60px;z-index:300;background:#fff;color:#000;padding:10px 14px;font:500 .85rem var(--mono)}
.skip:focus{top:8px}
.mono{font-family:var(--mono)}
.wrap{max-width:1240px;margin:0 auto;padding:0 var(--pad)}

/* frame */
.frame{position:fixed;z-index:40;left:0;right:0;top:calc(var(--nav) + 8px);bottom:0;pointer-events:none;overflow:visible}
.frame svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.frame rect{fill:none;stroke:var(--line)}
.zones{position:fixed;z-index:41;pointer-events:none;font:500 9px var(--mono);color:var(--dim);display:none}
@media(min-width:1000px){.zones{display:block}}
.zb{left:0;right:0;bottom:7px;display:flex;justify-content:space-around;padding:0 40px}
.zl{left:6px;top:calc(var(--nav) + 40px);bottom:40px;display:flex;flex-direction:column;justify-content:space-around}

/* draw primitives */
.dr{fill:none;stroke:var(--line);stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
.js .dr{stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset 1.7s cubic-bezier(.5,0,.2,1);transition-delay:var(--d,0s)}
.js .in .dr,.js .dr.in{stroke-dashoffset:0}
.js .rv{opacity:0;transform:translateY(18px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none}

/* nav */
.nav{position:fixed;z-index:60;top:0;left:0;right:0;height:var(--nav);background:rgba(8,45,94,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:stretch}
.nav .brand{flex:none;display:flex;align-items:center;padding:0 16px;border-right:1px solid var(--line);font:600 .78rem var(--mono);letter-spacing:.06em;text-decoration:none;text-transform:uppercase;white-space:nowrap}
.nav .brand i{display:inline-block;width:14px;height:14px;border:1.5px solid var(--line);border-radius:50%;margin-right:10px;position:relative}
.nav .brand i::after{content:"";position:absolute;inset:3px;background:var(--line);border-radius:50%}
.nav ul{flex:1;display:flex;margin:0;padding:0;list-style:none;overflow-x:auto;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav li{flex:none}
.nav li a{display:flex;align-items:center;height:100%;padding:0 16px;font:500 .74rem var(--mono);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--mute);border-right:1px solid var(--faint);white-space:nowrap;min-width:44px}
.nav li a b{font-weight:600;color:var(--hand);margin-right:7px}
.nav li a:hover,.nav li a[aria-current=true]{color:#fff;background:rgba(255,255,255,.1)}
.np{position:absolute;left:0;bottom:-1px;height:3px;width:100%;background:var(--hand);transform:scaleX(0);transform-origin:left}
@media(max-width:700px){.nav .brand span{display:none}.nav .brand{padding:0 14px}}

/* hero */
.hero{padding:calc(var(--nav) + clamp(28px,5vw,64px)) 0 clamp(50px,7vw,100px)}
.tags{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 18px;font:500 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.nmw{margin:clamp(16px,3vw,34px) 0 0;position:relative}
h1.name{margin:10px 0 0;font:inherit}
.nsvg{display:block;width:100%;height:auto;overflow:visible}
.nsvg text{font-family:var(--cond);font-weight:700;font-size:100px;letter-spacing:2px;fill:transparent;stroke:var(--line);stroke-width:.9;stroke-linejoin:round}
.js .nsvg text{stroke-dasharray:700;stroke-dashoffset:700;transition:stroke-dashoffset 2.8s cubic-bezier(.5,0,.2,1),fill 1.1s ease 2.2s}
.js .in .nsvg text{stroke-dashoffset:0;fill:#fff}
.js .nsvg.done text{stroke-dasharray:none}
.dim{display:flex;align-items:center;gap:8px;color:var(--mute);font:500 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.dim svg.ar{flex:none;width:12px;height:12px}
.dim svg.ln{flex:1 1 0;min-width:10px;height:12px}
.dim span{flex:none;max-width:70%;overflow:hidden;text-overflow:ellipsis}
.hgrid{display:grid;gap:30px;margin-top:clamp(26px,4vw,56px)}
@media(min-width:900px){.hgrid{grid-template-columns:5fr 7fr;gap:48px}}
.role{margin:0;font:500 clamp(1.05rem,2vw,1.4rem)/1.4 var(--mono);color:#fff}
.role::before{content:"TITLE ▸ ";color:var(--hand);font-size:.7em;letter-spacing:.14em}
.box{position:relative;padding:clamp(18px,3vw,30px)}
.bd{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.sum{margin:0;color:#e6f1ff}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 22px;border:1.5px solid var(--line);background:transparent;color:#fff;font:600 .8rem var(--mono);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;cursor:pointer;position:relative;transition:background .25s,color .25s}
.btn::before,.btn::after{content:"";position:absolute;width:8px;height:8px;border:1.5px solid var(--hand);transition:transform .25s}
.btn::before{left:-5px;top:-5px;border-right:0;border-bottom:0}
.btn::after{right:-5px;bottom:-5px;border-left:0;border-top:0}
.btn:hover::before{transform:translate(-3px,-3px)}.btn:hover::after{transform:translate(3px,3px)}
.btn.pri{background:#fff;color:var(--bg2);border-color:#fff}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.pri:hover{background:var(--hand);border-color:var(--hand)}

/* sections */
.bs{padding:clamp(50px,8vw,110px) 0 0}
.dh{margin-bottom:clamp(26px,4vw,48px)}
.dh h2{margin:8px 0 12px;font:700 clamp(2.4rem,6.4vw,4.6rem)/.95 var(--cond);letter-spacing:.02em;text-transform:uppercase}
.dh h2 small{display:block;font:500 .72rem var(--mono);letter-spacing:.16em;color:var(--hand);margin-bottom:8px}

/* details */
.dt{display:grid;grid-template-columns:58px 1fr;gap:0 14px;position:relative}
@media(min-width:760px){.dt{grid-template-columns:96px 26px 1fr;gap:0}}
.mkc{position:relative;display:flex;flex-direction:column;align-items:center}
.mkc svg{width:58px;height:58px;flex:none;overflow:visible}
@media(min-width:760px){.mkc svg{width:84px;height:84px}}
.mkc .ltr{font:700 30px var(--cond);fill:#fff;text-anchor:middle;opacity:0;transition:opacity .8s ease 1s}
.in .mkc .ltr,.static .mkc .ltr{opacity:1}
.mkc .vc{flex:1;width:0;border-left:1px dashed var(--dim);margin-top:6px;transform-origin:top;min-height:20px}
.js .mkc .vc{transform:scaleY(0);transition:transform 1.4s cubic-bezier(.5,0,.2,1) .6s}
.js .in .mkc .vc{transform:none}
.dt:last-child .vc{visibility:hidden}
.ld{display:none}
@media(min-width:760px){.ld{display:block;align-self:start;margin-top:41px;width:26px;height:2px;overflow:visible}}
.dtbox{margin-bottom:26px}
.dtbox .box{padding:clamp(16px,2.6vw,28px)}
.dtbox .tg{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.dtbox .tg b{color:var(--hand);font-weight:600}
.dtbox h3{margin:12px 0 4px;font:700 clamp(1.5rem,3vw,2.1rem)/1.05 var(--cond);letter-spacing:.025em;text-transform:uppercase}
.dtbox .co{font:500 .92rem var(--mono);color:#fff;margin-bottom:12px}
.dtbox .co::before{content:"◯ ";color:var(--hand)}
.dtbox p{margin:0;color:#e1eeff}

/* scales */
.sc{margin-bottom:clamp(28px,4vw,44px)}
.sh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 18px}
.sh h3{margin:0;font:600 clamp(1.3rem,2.4vw,1.7rem)/1.1 var(--cond);letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 16px}
.sh .v{font:600 .85rem var(--mono);color:var(--hand);letter-spacing:.06em}
.ruler{position:relative;margin:14px 12px 0;height:62px}
.ruler .base{position:absolute;left:0;top:0;width:100%;height:4px;overflow:visible}
.ruler .fb{position:absolute;left:0;top:-5px;height:11px;width:100%;background:repeating-linear-gradient(135deg,#fff 0 3px,rgba(255,255,255,.55) 3px 6px);transform-origin:left;transform:scaleX(var(--s,1));border-right:2px solid #fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.js .ruler .fb{transform:scaleX(0);transition:transform 1.6s cubic-bezier(.5,0,.2,1) .35s}
.js .in .ruler .fb{transform:scaleX(var(--p))}
.ruler .tk{position:absolute;left:0;right:0;top:8px;height:18px;border-right:1px solid var(--line);
  background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 2%) 0 0/100% 8px no-repeat,repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 20%) 0 0/100% 18px no-repeat}
.js .ruler .tk{opacity:0;transition:opacity 1s ease .2s}
.js .in .ruler .tk{opacity:1}
.ruler .nu{position:absolute;top:30px;transform:translateX(-50%);font:500 .7rem var(--mono);color:var(--mute)}
.ruler .mk{position:absolute;top:7px;left:var(--p100);width:0;height:0;border:6px solid transparent;border-bottom:10px solid var(--hand);border-top:0;transform:translateX(-6px)}
.js .ruler .mk{left:0;transition:left 1.6s cubic-bezier(.5,0,.2,1) .35s}
.js .in .ruler .mk{left:var(--p100)}
.hand{font:700 clamp(1.3rem,2.6vw,1.8rem)/1 'Caveat','Segoe Script','Bradley Hand',cursive;color:var(--hand);display:inline-flex;align-items:center;gap:6px;transform:rotate(-3deg);text-transform:none;letter-spacing:0;white-space:nowrap}
.hand svg{width:42px;height:26px;overflow:visible}
.hand svg .dr{stroke:var(--hand);stroke-width:2}

/* tables (BOM / revisions / legend) */
.tbl{border:1px solid var(--line);position:relative;background:rgba(8,45,94,.35)}
.tr{display:grid;border-bottom:1px solid var(--faint)}
.tr:last-child{border-bottom:0}
.tr>*{padding:12px 14px;border-right:1px solid var(--faint);min-width:0;overflow-wrap:anywhere}
.tr>*:last-child{border-right:0}
.th{font:600 .68rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--hand);background:rgba(255,255,255,.07);border-bottom:1px solid var(--line)}
.bom .tr{grid-template-columns:54px 1fr minmax(64px,auto)}
.bom .n{font:500 .82rem var(--mono);color:var(--mute)}
.bom .y{font:500 .8rem var(--mono);color:#fff;text-align:right;white-space:nowrap}
.rev .tr{grid-template-columns:48px 1fr}
.rev .a{display:flex;flex-direction:column}
.rev .a b{font:700 1.35rem/1.1 var(--cond);letter-spacing:.03em;text-transform:uppercase}
.rev .a span{color:var(--mute)}
.rev .d{font:500 .8rem var(--mono);color:var(--mute);grid-column:2;border-bottom:1px dashed var(--faint)}
.rev .r{grid-row:1/3}.rev .a{grid-column:2}
@media(min-width:760px){
  .rev .tr{grid-template-columns:64px 200px 1fr}
  .rev .d{grid-column:auto;border-bottom:0}.rev .r{grid-row:auto}.rev .a{grid-column:auto}
}
.rev .r{font:700 1.3rem var(--cond);color:var(--hand)}
.lg .tr{grid-template-columns:1fr}
@media(min-width:760px){.lg .tr{grid-template-columns:repeat(3,1fr)}.lg .tr:not(.th)>*{padding:20px 18px}}
.lg .it{display:flex;gap:14px;align-items:center}
.lg .it svg{flex:none;width:34px;height:34px;overflow:visible}
.lg .it b{display:block;font:700 1.45rem/1.1 var(--cond);letter-spacing:.03em;text-transform:uppercase}
.lg .it span{font:500 .78rem var(--mono);color:var(--mute);letter-spacing:.04em}
.sub2{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 10px;font:500 .7rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

/* title block */
.tb{margin-top:clamp(60px,9vw,120px);position:relative;padding:3px}
.tbg{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));position:relative;margin:0;border-top:1px solid var(--faint);border-left:1px solid var(--faint)}
.tc{grid-column:span 12;padding:14px 16px 16px;border-right:1px solid var(--faint);border-bottom:1px solid var(--faint);min-width:0;overflow-wrap:anywhere}
.tc label{display:block;font:500 .64rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.tc strong{font:700 clamp(1.7rem,4vw,2.9rem)/1 var(--cond);letter-spacing:.03em;text-transform:uppercase;display:block}
.tc .t{font:500 clamp(.95rem,1.5vw,1.1rem)/1.35 var(--mono)}
.tc a:not(.btn){text-decoration:none;font:600 clamp(.95rem,1.6vw,1.15rem) var(--mono);border-bottom:1px dashed var(--hand);padding:6px 0;display:inline-block}
.tc a:not(.btn):hover{color:var(--hand)}
.tc.h{grid-column:span 6}
@media(min-width:900px){.tc.nm{grid-column:span 5}.tc.ti{grid-column:span 7}.tc.em{grid-column:span 5}.tc.ph{grid-column:span 3}.tc.h{grid-column:span 2}}
.tc.ac{display:flex;gap:12px;flex-wrap:wrap;padding:22px 16px}
.tbnote{position:relative;margin:0 0 6px;display:flex;justify-content:flex-end;padding-right:6%;min-height:64px}
.tbnote .hand{font-size:clamp(1.5rem,3.4vw,2.3rem);align-items:flex-end;flex-wrap:wrap;justify-content:flex-end;white-space:normal;text-align:right}
.tbnote .hand svg{width:64px;height:44px}
.foot{padding:26px 0 56px;text-align:center;font:500 .68rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

/* crosshair */
.xh{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:0;transition:opacity .3s}
.xh.on{opacity:1}
.xh i{position:absolute;left:0;top:0;background:rgba(255,255,255,.3)}
.xh .v{width:1px;height:100%}.xh .h{height:1px;width:100%}
.xh .r{width:22px;height:22px;margin:-11px 0 0 -11px;border:1.5px solid var(--hand);border-radius:50%;background:none}
.hud{position:fixed;z-index:71;right:26px;bottom:26px;pointer-events:none;font:500 .72rem/1.5 var(--mono);letter-spacing:.08em;color:#fff;background:rgba(8,45,94,.9);border:1px solid var(--line);padding:6px 12px;opacity:0;transition:opacity .3s}
.hud.on{opacity:1}
.hud b{color:var(--hand);font-weight:600}

/* static / reduced */
.static *,.static *::before,.static *::after{animation:none!important;transition:none!important}
.static .dr{stroke-dashoffset:0!important}
.static .rv{opacity:1!important;transform:none!important}
.static .nsvg text{stroke-dashoffset:0!important;fill:#fff!important;stroke-dasharray:none!important}
.static .vc{transform:none!important}
.static .fb{transform:scaleX(var(--p))!important}
.static .tk{opacity:1!important}
.static .mk{left:var(--p100)!important}
.static .np{display:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* print */
@page{margin:13mm}
@media print{
  :root{--bg:#fff;--line:#000;--dim:#444;--faint:#bbb;--text:#000;--mute:#333;--hand:#000}
  html{font-size:10pt}
  body{background:#fff!important;color:#000;line-height:1.45}
  .nav,.frame,.zones,.xh,.hud,.cta,.skip,.ld,.vc,.hand,.tags,.dim,.tbnote,.mkc svg circle,.foot{display:none!important}
  *{transition:none!important;animation:none!important}
  .rv{opacity:1!important;transform:none!important}
  .wrap{padding:0;max-width:none}
  .hero{padding:0 0 8px}
  .nmw{margin:0}
  .nsvg{display:none}
  h1.name .sr{position:static;width:auto;height:auto;clip:auto;white-space:normal;font:700 32pt/1 var(--cond);text-transform:uppercase;display:block}
  .hgrid{display:block;margin-top:6px}
  .role{color:#000;font-size:11pt}
  .box{padding:4px 0}.bd{display:none}
  .sum,.dtbox p{color:#111}
  .bs{padding-top:12px}
  .dh{margin-bottom:6px}
  .dh h2{font-size:16pt;border-bottom:1.5px solid #000;margin:0;padding-bottom:2px}
  .dh h2 small{display:none}
  .dt{display:block;break-inside:avoid}
  .mkc{display:none}
  .dtbox{margin-bottom:8px}
  .dtbox h3{font-size:13pt}
  .dtbox .tg b::before{content:"Detail "}
  .sc{margin-bottom:8px;break-inside:avoid}
  .ruler{height:40px}
  .ruler .nu{top:24px}
  .ruler .fb{background:#000!important;transform:scaleX(var(--p))!important}
  .ruler .mk{display:none}
  .tr>*{padding:4px 8px}
  .tbl{background:none}
  .th{background:none;color:#000;border-bottom:1px solid #000}
  .rev .r{color:#000}
  .tb{margin-top:12px;break-inside:avoid}.tb .bd{display:block}
  .tc a{border:0;font-size:10pt}
  .tc.ac{display:none}
  html{font-size:9pt}
  .dtbox{margin-bottom:4px}.dtbox .co{margin-bottom:3px}.dtbox h3{margin:3px 0 1px;font-size:12pt}
  .dtbox .box{padding:2px 0}
  .bs{padding-top:8px}.dh h2{font-size:14pt}
  .sc{margin-bottom:4px}.ruler{margin-top:6px;height:34px}
  .tr>*{padding:2px 8px}
  .bom .tr{font-size:9pt}
  .tc{padding:6px 10px}.tc strong{font-size:18pt}
}

/* frame sizing */
function sizeFrame(){

/* reveal */

/* name drawn as SVG text */
const nm=$('#nm'),nmw=$('#nmw');
let nameMode='';
function pickLines(){
  const w=name.toUpperCase().split(/\s+/).filter(Boolean);
  let mode,lines;
  if(w.length<2){mode='1';lines=w}
  else if(innerWidth<700){
    if(w.length>3){const k=Math.ceil(w.length/2);lines=[w.slice(0,k).join(' '),w.slice(k).join(' ')]}else lines=w;
    mode='m';
  }else if(w.length>=4||name.length>24){const k=Math.ceil(w.length/2);lines=[w.slice(0,k).join(' '),w.slice(k).join(' ')];mode='2'}
  else{lines=[w.join(' ')];mode='1'}
  return {mode,lines};
}
function buildName(instant){
  const pl=pickLines();nameMode=pl.mode+pl.lines.length;
  const old=$('.nsvg',nm);if(old)old.remove();
  nm.insertAdjacentHTML('beforeend','<svg class="nsvg" aria-hidden="true" focusable="false"><text y="82">'+pl.lines.map((l,i)=>'<tspan x="0" dy="'+(i?92:0)+'">'+esc(l)+'</tspan>').join('')+'</text></svg>');
  const svg=$('.nsvg',nm),t=$('text',svg);
  let b;try{b=t.getBBox()}catch(e){b={x:0,y:0,width:600,height:100}}
  if(!b.width)b={x:0,y:0,width:600,height:100};
  svg.setAttribute('viewBox',(b.x-4)+' '+(b.y-4)+' '+(b.width+8)+' '+(b.height+8));

  if(instant||RM){nmw.classList.add('in');svg.classList.add('done');$$('#dimw .dr').forEach(p=>p.style.transition='none')}
  return svg;
}
function startName(instant){

  const draw=()=>{raf=0;v.style.transform='translate3d('+x+'px,0,0)';hz.style.transform='translate3d(0,'+y+'px,0)';r.style.transform='translate3d('+x+'px,'+y+'px,0)';const m=document.documentElement.scrollHeight-innerHeight;hud.innerHTML='<b>X</b> '+pad(Math.round(x),4)+' &nbsp;<b>Y</b> '+pad(Math.round(y+scrollY),4)+'<br><b>SHEET</b> '+pad(Math.min(total,1+Math.floor((m>0?scrollY/m:0)*(total-1)+.5)))+'/'+pad(total)};

}
