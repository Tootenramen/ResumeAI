 if(a==null||b==null)return null;if(b>nm)b=nm;if(b<a)return null;return [a,b+1]}
function expYears(){
 var rs=jobs.map(function(j){return parseDates(j.dates)}).filter(Boolean).sort(function(x,y){return x[0]-y[0]});
 if(!rs.length)return 0;var tot=0,cs=rs[0][0],ce=rs[0][1];
 for(var i=1;i<rs.length;i++){if(rs[i][0]<=ce)ce=Math.max(ce,rs[i][1]);else{tot+=ce-cs;cs=rs[i][0];ce=rs[i][1]}}
 tot+=ce-cs;return Math.floor(tot/12)}
var years=expYears();
var MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function endpoint(t){t=String(t||'').trim();if(!t)return ['---',''];
 if(/present|current|now|today/i.test(t))return ['NOW','Present'];
 var x=t.match(/(?:(\d{1,2})\s*[\/.-]\s*)?((?:19|20)\d{2})/);
 if(x)return [x[1]?MON[Math.min(12,Math.max(1,+x[1]))-1]:String(x[2]),String(x[2])];
 return [t.slice(0,4).toUpperCase(),t]}
function dur(s){var r=parseDates(s);if(!r)return '';var n=r[1]-r[0],y=Math.floor(n/12),m=n%12;return (y?y+'y ':'')+(m||!y?m+'m':'')}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function barcode(seed,w,h){var r=hash(seed)||1,x=0,rects='';function nx(){r^=r<<13;r>>>=0;r^=r>>>17;r^=r<<5;r>>>=0;return r}
 var n=0;while(x<w&&n<400){var bw=1+nx()%4,gp=1+nx()%3;if(x+bw>w)break;rects+='<rect x="'+x+'" y="0" width="'+bw+'" height="'+h+'"/>';x+=bw+gp;n++}
 return '<svg class="bc" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Barcode">'+rects+'</svg>'}
var lw=['','Foundational','Working','Proficient','Advanced','Expert'];
function lvl(v){return Math.max(1,Math.min(5,Math.round(Number(v)||3)))}
function pad(n,l){n=String(n);while(n.length<l)n='0'+n;return n}
function sh(k,t){return '<div class="sh slide fl-u"><div class="sh-t"><small>'+k+'</small><h2>'+t+'</h2></div></div>'}

/* render */
var flight=initials+' '+(1000+hash(name)%9000),gate=String.fromCharCode(65+Math.min(25,years)%26)+(jobs.length||1),seat=(jobs.length||1)+'A';
var out='<div class="wrap" id="top"><div class="top"><span class="dep"><i></i>Now boarding</span><span>Boarding pass &middot; Resume class</span></div>'+
 '<article class="pass slide fl-l" aria-label="Boarding pass for '+esc(name)+'"><div class="main"><div class="hd"><span class="al">'+PLANE+'Career Airlines</span><span>Boarding pass</span></div><div class="stripe"></div>'+
 '<div class="pax"><span class="fl">Passenger name</span><h1 class="nm">'+esc(name)+'</h1></div>'+
 '<div class="route"><div class="pt"><b>PAST</b><span>Where I’ve been</span></div><div class="mid">'+PLANE.replace('<svg','<svg style="transform:rotate(90deg)"')+'</div><div class="pt"><b>HIRED</b><span>Your team</span></div></div>'+
 '<div class="grid"><div><span class="fl">Flight</span><span class="fv">'+esc(flight)+'</span></div><div><span class="fl">Gate</span><span class="fv">'+esc(gate)+'</span></div><div><span class="fl">Seat</span><span class="fv">'+esc(seat)+'</span></div><div><span class="fl">Boarding</span><span class="fv">Now</span></div>'+
 (title?'<div class="wide"><span class="fl">Class / Role</span><span class="fv">'+esc(title)+'</span></div>':'')+
 (years>=1?'<div><span class="fl">Miles flown</span><span class="fv">'+years+'+ years</span></div>':'')+(jobs.length?'<div><span class="fl">Legs</span><span class="fv">'+jobs.length+' flights</span></div>':'')+'</div>'+
 (sum?'<div class="rem"><span class="fl">Remarks</span><p>'+esc(sum)+'</p></div>':'')+
 '<div class="rem"><div class="heroacts">'+(phone?'<a class="btn or" href="tel:'+esc(tel)+'">'+IC.phone+'Check in: call</a>':'')+(email?'<a class="btn o" style="color:#14213d;border-color:#14213d" href="mailto:'+esc(email)+'">'+IC.mail+'Email</a>':'')+'<button type="button" class="btn o" style="color:#14213d;border-color:#14213d" id="pdf">'+IC.dl+'Download PDF</button></div></div></div>'+
 '<aside class="stub" aria-label="Ticket stub"><div><span class="fl">Passenger</span><span class="fv">'+esc(name.split(/\s+/).slice(-1)[0])+'/'+esc(name.split(/\s+/)[0])+'</span></div><div><span class="fl">Gate</span><span class="big o">'+esc(gate)+'</span></div><div><span class="fl">Seat</span><span class="big">'+esc(seat)+'</span></div>'+barcode(name+flight,120,64)+'<div class="bcn">'+esc(flight.replace(/\s/g,''))+'</div></aside></article></div>';

if(jobs.length)out+='<section id="experience"><div class="wrap">'+sh('Itinerary','Flight history')+'<ol class="jobs">'+jobs.map(function(j,i){var p=String(j.dates||'').split(/\s*[–—]\s*|\s+-\s+|\s+to\s+/i),a=endpoint(p[0]),b=endpoint(p.length>1?p[p.length-1]:p[0]),d=dur(j.dates);
 return '<li class="pass jp slide '+(i%2?'fl-r':'fl-l')+'"><div class="main"><div class="hd"><span class="al">'+PLANE+esc(j.co||'Independent')+'</span><span>Flight '+pad(jobs.length-i,2)+'</span></div>'+
 '<div class="route"><div class="pt"><b>'+esc(a[0])+'</b><span>'+esc(a[1])+'</span></div><div class="mid">'+PLANE.replace('<svg','<svg style="transform:rotate(90deg)"')+'</div><div class="pt"><b>'+esc(b[0])+'</b><span>'+esc(b[1])+'</span></div></div>'+
 '<div class="grid"><div class="wide"><span class="fl">Class / Role</span><span class="fv">'+esc(j.role||'')+'</span></div>'+(j.loc?'<div class="wide"><span class="fl">Terminal</span><span class="fv">'+esc(j.loc)+'</span></div>':'')+'</div>'+
 (j.text?'<div class="rem"><span class="fl">Remarks</span><p>'+esc(j.text)+'</p></div>':'')+'</div>'+
 '<aside class="stub"><div><span class="fl">Duration</span><span class="big o">'+esc(d||'--')+'</span></div><div><span class="fl">Seat</span><span class="fv">'+(i+1)+'A</span></div>'+barcode((j.co||'')+(j.dates||'')+i,100,48)+'</aside></li>'}).join('')+'</ol></div></section>';

if(skills.length||certs.length){var avg=skills.length?skills.reduce(function(a,s){return a+lvl(s[1])},0)/skills.length:3,tier=avg>=4.2?['Platinum','pl']:avg>=3.4?['Gold','']:['Silver','sv'];
 out+='<section id="skills"><div class="wrap">'+sh('Status','Frequent flyer')+'<div class="ffwrap">';
 if(skills.length)out+='<div class="ff '+tier[1]+' slide fl-l"><span class="tier">'+tier[0]+' member</span><div class="fn">'+esc(name)+'</div><div class="mn">FF '+pad(hash(name)%100000000,8)+'</div><ul>'+skills.map(function(s){var n=lvl(s[1]);return '<li><div class="r"><span>'+esc(s[0])+'</span><em>'+lw[n]+'</em></div><div class="trk" role="img" aria-label="'+lw[n]+', '+n+' out of 5"><i style="--w:'+n*20+'%"></i></div></li>'}).join('')+'</ul></div>';
 if(certs.length)out+='<div class="slide fl-r" id="certs"><p class="stamps-h">Visas &amp; passport stamps</p><ul class="stamps">'+certs.map(function(c,i){return '<li class="stamp" style="--rot:'+((i%5)-2)*1.2+'deg">&#10003; '+esc(c)+'</li>'}).join('')+'</ul></div>';
 out+='</div></div></section>'}

if(edu.length||langs.length){out+='<section><div class="wrap two">';
 if(edu.length)out+='<div>'+sh('Training','Flight school')+'<div class="mini">'+edu.map(function(e,i){return '<div class="tk slide fl-u" style="--d:'+i*.08+'s"><h3>'+esc(e[0]||'')+'</h3>'+(e[2]?'<span class="s">'+esc(e[2])+'</span>':'')+(e[1]?'<span class="d">'+esc(e[1])+'</span>':'')+'</div>'}).join('')+'</div></div>';
 if(langs.length)out+='<div>'+sh('Cabin','Languages spoken')+'<div class="mini">'+langs.map(function(l,i){return '<div class="tk slide fl-u" style="--d:'+i*.08+'s"><b>'+esc(l[0]||'')+'</b><span class="lg">'+esc(l[1]||'')+'</span></div>'}).join('')+'</div></div>';
 out+='</div></section>'}

out+='<section id="contact"><div class="wrap"><div class="checkin slide fl-u"><span class="fl" style="letter-spacing:.2em">Counter open</span><h2>Check in</h2><p>Your next hire is ready for departure. Call or email to confirm the booking.</p><div class="acts">'+(phone?'<a class="btn or" href="tel:'+esc(tel)+'">'+IC.phone+esc(phone)+'</a>':'')+(email?'<a class="btn" href="mailto:'+esc(email)+'">'+IC.mail+esc(email)+'</a>':'')+'<button type="button" class="btn o" id="pdf2">'+IC.dl+'Download PDF</button></div></div>'+
 '<div class="foot"><span>&copy; '+new Date().getFullYear()+' '+esc(name)+'</span><a href="#top">Back to gate &uarr;</a></div></div></section>';
out+='<svg id="fp" aria-hidden="true" focusable="false"><defs><mask id="fpm" maskUnits="userSpaceOnUse"><path id="fpmask" fill="none" stroke="#fff" stroke-width="12"/></mask></defs><path class="base" id="fpb" d=""/><path class="lit" id="fpl" d="" mask="url(#fpm)"/><g id="plane"><path d="M0-14 L4-4 L16 2 L16 6 L4 3 L3 11 L7 14 L7 16 L0 14 L-7 16 L-7 14 L-3 11 L-4 3 L-16 6 L-16 2 L-4-4Z"/></g></svg>';
$('#app').innerHTML=out;
[$('#pdf'),$('#pdf2')].forEach(function(b){if(b)b.addEventListener('click',function(){window.print()})});

/* reveal */
var targets=$$('.slide');
if(still||!('IntersectionObserver' in window))targets.forEach(function(t){t.classList.add('in')});
else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -6% 0px'});targets.forEach(function(t){io.observe(t)})}

/* flight path */
var fp=$('#fp'),pB=$('#fpb'),pL=$('#fpl'),pM=$('#fpmask'),pl=$('#plane'),app=$('#app'),len=0,tick=false;
function build(){
 var W=app.offsetWidth,H=app.offsetHeight;if(!W||!H)return;
 fp.setAttribute('viewBox','0 0 '+W+' '+H);fp.setAttribute('width',W);fp.setAttribute('height',H);
 var ys=$$('#app section, #app .pass').map(function(el){return el.getBoundingClientRect().top+scrollY-app.getBoundingClientRect().top-scrollY+(el.matches('section')?30:0)});
 var pts=[[W*.5,60]],mg=W<760?14:Math.max(14,(W-1000)/2-26);
 for(var i=0;i<ys.length;i++){if(ys[i]<80)continue;pts.push([i%2?W-mg:mg,ys[i]])}
 pts.push([W*.5,H-60]);
 var d='M'+pts[0][0]+' '+pts[0][1];
 for(var k=1;k<pts.length;k++){var a=pts[k-1],b=pts[k],my=(a[1]+b[1])/2;d+=' C'+a[0]+' '+my+' '+b[0]+' '+my+' '+b[0]+' '+b[1]}
 pB.setAttribute('d',d);pL.setAttribute('d',d);pM.setAttribute('d',d);len=pM.getTotalLength();pM.style.strokeDasharray=len;
 move()}
function move(){tick=false;if(!len)return;
 if(still){pM.style.strokeDashoffset=0;pl.style.display='none';return}
 var h=root.scrollHeight-innerHeight,p=h>0?Math.min(1,Math.max(0,scrollY/h)):0,L=len*p;
 pM.style.strokeDashoffset=len-L;
 var a=pM.getPointAtLength(L),b=pM.getPointAtLength(Math.min(len,L+2)),ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI+90;
 pl.setAttribute('transform','translate('+a.x+','+a.y+') rotate('+ang+') scale(.9)')}
addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(move)}},{passive:true});
var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(build,120)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(build);
build();addEventListener('load',build);
})();
