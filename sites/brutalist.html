<style>

*{margin:0}

html.cur,html.cur *{cursor:none!important}

/* progress + cursor */
.prog{position:fixed;left:0;top:0;height:6px;width:100%;background:var(--p);transform-origin:0 50%;transform:scaleX(0);z-index:120;pointer-events:none}
.cur{position:fixed;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border:4px solid var(--k);border-radius:50%;pointer-events:none;z-index:300;opacity:0;transition:width .2s cubic-bezier(.3,1.6,.5,1),height .2s cubic-bezier(.3,1.6,.5,1),margin .2s cubic-bezier(.3,1.6,.5,1),background .15s,opacity .2s;mix-blend-mode:normal}
.cur.vis{opacity:1}
.cur.big{width:84px;height:84px;margin:-42px 0 0 -42px;background:var(--p);mix-blend-mode:multiply;border-width:3px}
.cur.down{width:30px;height:30px;margin:-15px 0 0 -15px;background:var(--k)}
.cdot{position:fixed;left:0;top:0;width:8px;height:8px;margin:-4px 0 0 -4px;background:var(--k);border-radius:50%;pointer-events:none;z-index:301;opacity:0}
.cdot.vis{opacity:1}

/* nav */
.nav{position:sticky;top:0;z-index:100;background:var(--k);color:var(--y);display:flex;align-items:center;gap:10px;padding:0 var(--pad);border-bottom:4px solid var(--k)}
.logo{background:var(--p);color:var(--k);font-size:1.5rem;padding:4px 10px;margin:7px 0;text-decoration:none;letter-spacing:.02em;border:3px solid var(--y);transform:rotate(-3deg);flex:none;line-height:1.2}
.nav ul{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-width:0}
.nav ul::-webkit-scrollbar{display:none}
.nav li a{display:flex;align-items:center;min-height:48px;padding:0 12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:.8rem;text-decoration:none;white-space:nowrap}
.nav li a:hover,.nav li a.on{background:var(--y);color:var(--k)}

/* hero */
.hero{position:relative;padding:clamp(36px,7vw,90px) var(--pad) clamp(40px,6vw,70px);max-width:1400px;margin:0 auto;overflow:visible}
.hero.shake{animation:shake .35s linear}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(3px,4px)}}
.kick{display:inline-block;background:var(--k);color:var(--y);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:.8rem;padding:7px 14px;transform:rotate(-2deg);margin-bottom:22px}
.name{font-size:var(--fs,clamp(3.2rem,15vw,15rem));line-height:.9;text-transform:uppercase;letter-spacing:-.005em;position:relative;z-index:2;padding-bottom:.04em}
.name .w{display:block}
.name .w>span{display:inline-block;transform-origin:50% 100%;animation:slam .95s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.15s + var(--i)*.28s);text-shadow:.045em .055em 0 var(--p)}
.name .w:nth-child(even)>span{color:#fff;-webkit-text-stroke:.028em var(--k);paint-order:stroke fill;text-shadow:.045em .055em 0 var(--k)}
@keyframes slam{0%{opacity:0;transform:translateY(-160px) scale(2.4) rotate(-7deg)}50%{opacity:1;transform:translateY(0) scale(.9) rotate(1.5deg)}72%{transform:scale(1.07) rotate(-.6deg)}88%{transform:scale(.98)}100%{opacity:1;transform:none}}
.title{display:inline-block;max-width:900px;background:var(--k);color:var(--y);font:700 clamp(1rem,2.4vw,1.55rem)/1.3 'Space Grotesk',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.03em;padding:12px 18px;margin-top:clamp(18px,3vw,34px);transform:rotate(-1deg);box-shadow:8px 8px 0 var(--p)}
.sum{max-width:760px;font-size:clamp(1.05rem,1.6vw,1.3rem);margin-top:clamp(24px,3vw,40px);font-weight:500;line-height:1.6}
.sum::first-letter{font:400 3.2em/.8 Anton,Impact,sans-serif;float:left;padding:.08em .1em 0 0;color:var(--p);-webkit-text-stroke:2px var(--k)}
.cta{display:flex;flex-wrap:wrap;gap:18px;margin-top:clamp(28px,4vw,44px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;min-height:54px;padding:0 26px;font:700 1rem/1 'Space Grotesk',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;border:4px solid var(--k);background:#fff;color:var(--k);box-shadow:6px 6px 0 var(--k);text-decoration:none;cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn.pink{background:var(--p)}
.btn:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--k)}
.btn:active{transform:translate(5px,5px);box-shadow:1px 1px 0 var(--k)}
.chips{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:26px;font-weight:700}
.chips a{text-decoration:none;border-bottom:3px solid var(--k);overflow-wrap:anywhere}
.chips a:hover{background:var(--p)}
.deco{position:absolute;z-index:1;pointer-events:none}
.d1{width:clamp(110px,18vw,260px);aspect-ratio:1;background:var(--p);border:var(--b) solid var(--k);border-radius:50%;right:6vw;top:6%;animation:float 7s ease-in-out infinite}
.d2{width:clamp(60px,9vw,120px);aspect-ratio:1;background:var(--k);clip-path:polygon(50% 0,100% 100%,0 100%);right:2vw;top:42%;animation:float 6s -2s ease-in-out infinite reverse}
@keyframes float{50%{transform:translateY(-18px) rotate(8deg)}}
.badge{position:absolute;right:clamp(14px,5vw,80px);bottom:clamp(20px,6vw,70px);width:clamp(100px,12vw,160px);aspect-ratio:1;z-index:3;border:0;background:none;padding:0;cursor:pointer;color:var(--k)}
.badge svg{width:100%;height:100%;animation:spin 14s linear infinite;overflow:visible}
.badge b{position:absolute;inset:0;display:grid;place-items:center;font:400 clamp(1.6rem,3vw,2.6rem) Anton,Impact,sans-serif;background:var(--p);border:4px solid var(--k);border-radius:50%;margin:22%;transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.badge:hover b{transform:scale(1.2) rotate(-12deg)}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:760px){.badge{display:none}.d2{display:none}.d1{top:2%;right:-30px}.cta .btn{flex:1 1 100%}}

/* marquee */

.band{display:block;width:112%;margin-left:-6%;background:var(--k);color:var(--y);border-block:4px solid var(--k);transform:rotate(-2deg);white-space:nowrap;overflow:hidden;font:400 clamp(2rem,6vw,4.5rem)/1.25 Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.band.b2{background:var(--p);color:var(--k);transform:rotate(1.6deg);margin-top:-14px;font-size:clamp(1.3rem,3.4vw,2.4rem);position:relative;z-index:-1}
.track{display:flex;width:max-content;will-change:transform}
.track span{padding:0 .5em;flex:none}
.track i{font-style:normal;color:var(--p)}
.b2 .track i{color:var(--w)}

/* sections */
.sec{padding:clamp(56px,9vw,120px) var(--pad);max-width:1400px;margin:0 auto;position:relative}
.h2{font-size:clamp(2.6rem,9vw,7rem);line-height:1;text-transform:uppercase;margin-bottom:clamp(30px,5vw,64px)}
.h2 span{display:inline-block;background:var(--k);color:var(--y);padding:.02em .18em .06em;transform:rotate(-1.2deg);box-shadow:.07em .07em 0 var(--p)}

.card{position:relative;background:#fff;border:var(--b) solid var(--k);box-shadow:8px 8px 0 var(--k);padding:clamp(20px,3vw,34px);transition:transform .2s cubic-bezier(.3,1.7,.5,1),box-shadow .2s}
.c2{background:var(--p)}
.c3{background:var(--k);color:var(--y);box-shadow:8px 8px 0 var(--p)}
@media(hover:hover){.card:hover{transform:translate(-6px,-6px) rotate(-.5deg);box-shadow:14px 14px 0 var(--k)}.c3:hover{box-shadow:14px 14px 0 var(--p)}}
.stamp.in{animation:stamp .6s cubic-bezier(.2,.9,.3,1.3) backwards;animation-delay:var(--d,0s)}
.js .stamp:not(.in){opacity:0}
@keyframes stamp{0%{opacity:0;transform:scale(1.45) rotate(var(--r,-5deg))}55%{opacity:1;transform:scale(.97) rotate(0)}100%{opacity:1;transform:none}}
.rv{transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.js .rv:not(.in){opacity:0;transform:translateY(34px)}

.jobs{display:grid;gap:clamp(34px,5vw,54px)}
.job{display:grid;gap:14px 34px}
@media(min-width:820px){.job{grid-template-columns:minmax(200px,270px) 1fr}}
.jn{position:absolute;top:-20px;right:18px;background:var(--y);color:var(--k);border:4px solid var(--k);font-size:1.5rem;padding:0 12px;transform:rotate(4deg);line-height:1.4}
.jm{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.dates{background:var(--k);color:var(--y);font-weight:700;font-size:.85rem;padding:5px 10px;letter-spacing:.04em}
.c3 .dates{background:var(--y);color:var(--k)}
.co{font-size:1.15rem;line-height:1.25}
.loc{font-size:.95rem;opacity:.9}
.job h3{font-size:clamp(1.6rem,3.2vw,2.5rem);line-height:1.08;text-transform:uppercase;margin-bottom:10px;padding-right:56px}
.job p{max-width:68ch}

.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:30px}
.skill h3{font:700 1.1rem/1.3 'Space Grotesk',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.03em;margin-bottom:16px}
.meter{display:flex;gap:6px}
.bk{flex:1;height:30px;border:3px solid var(--k);background:#fff;transform-origin:50% 100%;transition:transform .45s cubic-bezier(.3,1.6,.5,1) calc(var(--n)*.09s + .25s)}
.bk.on{background:var(--p)}
.c2 .bk.on{background:var(--k)}
.js .skill:not(.in) .bk.on{transform:scaleY(0)}
.lvl{display:flex;justify-content:space-between;margin-top:12px;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}

.certs{display:flex;flex-wrap:wrap;gap:22px 16px;padding:8px 0 0}
.certs li{max-width:100%}
.sticker{--r:0deg;display:inline-flex;align-items:center;gap:10px;font-weight:700;line-height:1.25;padding:13px 20px;border:3px solid var(--k);background:#fff;box-shadow:5px 5px 0 var(--k);transform:rotate(var(--r));animation:wob 3.6s ease-in-out infinite;animation-delay:var(--wd,0s);max-width:100%;overflow-wrap:anywhere;transition:box-shadow .2s}
.sticker::before{content:'✱';color:var(--p);font-size:1.2em;flex:none}

.confetti{position:fixed;left:0;top:0;width:12px;height:12px;pointer-events:none;z-index:250}

html.still *,html.still *::before,html.still *::after{animation:none!important;transition:none!important}

}

var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var arr=function(x){return Array.isArray(x)?x:[]};
var D=DATA||{},name=String(D.name||'Your Name').trim(),title=D.title||'',sum=D.summary||'';
var jobs=arr(D.jobs).filter(Boolean),skills=arr(D.skills).filter(Boolean),certs=arr(D.certs).filter(Boolean),edu=arr(D.edu).filter(Boolean),langs=arr(D.langs).filter(Boolean);
var email=D.email?String(D.email).trim():'',phone=D.phone?String(D.phone).trim():'';
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var STATIC=/[?&]static(\b|=)/.test(location.search);
var still=RM||STATIC;
root.classList.add('js');if(still)root.classList.add('still');
var initials=name.split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w[0].toUpperCase()}).join('')||'CV';

/* head / meta */
document.title=name+' — Resume';
var desc=(title?title+'. ':'')+(sum?sum.slice(0,140):'Open to work.');
function meta(sel,val){var m=$(sel);if(m)m.setAttribute('content',val)}
meta('meta[name=description]',desc);meta('meta[property="og:title"]',name+' — Resume');meta('meta[property="og:description"]',desc);meta('meta[name="twitter:title"]',name+' — Resume');meta('meta[name="twitter:description"]',desc);
var fav=$('link[rel=icon]');if(fav)fav.href='data:image/svg+xml,'+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='#f6f000'/><rect x='3' y='3' width='58' height='58' fill='none' stroke='#0b0b0b' stroke-width='6'/><text x='32' y='45' font-family='Impact,Arial Black,sans-serif' font-size='"+(initials.length>1?34:40)+"' text-anchor='middle' fill='#0b0b0b'>"+esc(initials)+"</text></svg>");
$('#logo').textContent=initials;

/* nav */
var secs=[];
if(jobs.length)secs.push(['experience','Experience']);if(skills.length)secs.push(['skills','Skills']);if(certs.length)secs.push(['certs','Certs']);if(edu.length)secs.push(['education','Education']);if(langs.length)secs.push(['languages','Languages']);secs.push(['contact','Contact']);
$('#navlist').innerHTML=secs.map(function(s){return '<li><a href="#'+s[0]+'">'+s[1]+'</a></li>'}).join('');

/* hero */
var words=name.split(/\s+/).filter(Boolean);
var tel=phone.replace(/[^0-9+]/g,'');
$('#hero').innerHTML=
 '<div class="deco d1"></div><div class="deco d2"></div>'+
 '<span class="kick">★ Open to work ★ Resume</span>'+
 '<h1 class="name" id="nm" aria-label="'+esc(name)+'">'+words.map(function(w,i){return '<span class="w" aria-hidden="true"><span style="--i:'+i+'">'+esc(w)+'</span></span>'}).join('')+'</h1>'+
 (title?'<p class="title">'+esc(title)+'</p>':'')+
 (sum?'<p class="sum">'+esc(sum)+'</p>':'')+
 '<div class="cta">'+(email?'<a class="btn pink" href="mailto:'+esc(email)+'">Email me →</a>':'')+'<button class="btn" type="button" id="pdf">Download PDF ↓</button></div>'+
 '<div class="chips">'+(email?'<a href="mailto:'+esc(email)+'">'+esc(email)+'</a>':'')+(phone?'<a href="tel:'+esc(tel)+'">'+esc(phone)+'</a>':'')+'</div>'+
 '<button class="badge" type="button" id="badge" aria-label="Celebrate with confetti"><svg viewBox="0 0 200 200" aria-hidden="true"><defs><path id="cp" d="M100,100 m-82,0 a82,82 0 1,1 164,0 a82,82 0 1,1 -164,0"/></defs><text font-family="Anton,Impact,sans-serif" font-size="25" letter-spacing="3" fill="currentColor"><textPath href="#cp">HIRE ME ★ HIRE ME ★ HIRE ME ★</textPath></text></svg><b>!</b></button>';
$('#pdf').addEventListener('click',function(){window.print()});

/* marquee */
function mqHTML(txt){var one='';for(var i=0;i<10;i++)one+='<span>'+txt+' <i>★</i></span>';return one+one}
$('#t1').innerHTML=mqHTML('Open to work');
$('#t2').innerHTML=mqHTML('Hire '+esc(words[0]||'me'));

/* sections */
var lvlWord=['','Novice','Basic','Proficient','Advanced','Expert'];
var h2=function(n,t){return '<h2 class="h2 rv"><small>0'+n+' /</small><span>'+t+'</span></h2>'};
var vars=['c1','c2','c1','c3'];
var out='',n=0;
if(jobs.length){n++;out+='<section class="sec" id="experience" aria-labelledby="h-exp">'+h2(n,'Experience').replace('<h2 ','<h2 id="h-exp" ')+'<div class="jobs">'+jobs.map(function(j,i){
 var r=(i%2?1:-1)*(3+i%3);
 return '<article class="card job stamp '+vars[i%4]+'" style="--d:.05s;--r:'+r+'deg"><span class="jn" aria-hidden="true">'+(i<9?'0':'')+(i+1)+'</span><div class="jm">'+(j.dates?'<span class="dates">'+esc(j.dates)+'</span>':'')+(j.co?'<b class="co">'+esc(j.co)+'</b>':'')+(j.loc?'<span class="loc">'+esc(j.loc)+'</span>':'')+'</div><div class="jb"><h3>'+esc(j.role||'')+'</h3>'+(j.text?'<p>'+esc(j.text)+'</p>':'')+'</div></article>'}).join('')+'</div></section>'}
if(skills.length){n++;out+='<section class="sec" id="skills" aria-labelledby="h-sk">'+h2(n,'Skills').replace('<h2 ','<h2 id="h-sk" ')+'<div class="skills">'+skills.map(function(s,i){
 var lv=Math.max(1,Math.min(5,Math.round(Number(s[1])||3)));var b='';for(var k=0;k<5;k++)b+='<span class="bk'+(k<lv?' on':'')+'" style="--n:'+k+'"></span>';
 return '<div class="card skill stamp '+(i%3==1?'c2':'c1')+'" style="--r:'+(i%2?3:-3)+'deg"><h3>'+esc(s[0])+'</h3><div class="meter" role="img" aria-label="'+lv+' out of 5">'+b+'</div><div class="lvl"><span>'+lvlWord[lv]+'</span><span>'+lv+'/5</span></div></div>'}).join('')+'</div></section>'}
if(certs.length){n++;out+='<section class="sec" id="certs" aria-labelledby="h-ce">'+h2(n,'Certifications').replace('<h2 ','<h2 id="h-ce" ')+'<ul class="certs">'+certs.map(function(c,i){
 var r=[-3,2.5,-1.5,3.5,-2.5,1.5][i%6];
 return '<li class="stamp" style="--d:'+((i%6)*.06)+'s;--r:'+(r*2)+'deg"><span class="sticker s'+(i%4)+'" style="--r:'+r+'deg;--wd:-'+((i*.7)%3.6).toFixed(1)+'s">'+esc(c)+'</span></li>'}).join('')+'</ul></section>'}
if(edu.length){n++;out+='<section class="sec" id="education" aria-labelledby="h-ed">'+h2(n,'Education').replace('<h2 ','<h2 id="h-ed" ')+'<div class="edus">'+edu.map(function(e,i){
 return '<article class="card edu stamp '+(i%3==2?'c2':'c1')+'" style="--r:'+(i%2?4:-4)+'deg"><h3>'+esc(e[0]||'')+'</h3>'+(e[2]?'<p class="sch">'+esc(e[2])+'</p>':'')+(e[1]?'<span class="dates">'+esc(e[1])+'</span>':'')+'</article>'}).join('')+'</div></section>'}
if(langs.length){n++;out+='<section class="sec" id="languages" aria-labelledby="h-la">'+h2(n,'Languages').replace('<h2 ','<h2 id="h-la" ')+'<div class="langs">'+langs.map(function(l,i){
 return '<div class="card lang stamp '+(i%2?'c3':'c2')+'" style="--r:'+(i%2?-4:4)+'deg"><h3>'+esc(l[0]||'')+'</h3>'+(l[1]?'<p>'+esc(l[1])+'</p>':'')+'</div>'}).join('')+'</div></section>'}
out+='<section class="sec contact" id="contact" aria-labelledby="h-co"><div><h2 class="big rv" id="h-co"><span>Let’s</span><span>talk.</span></h2>'+
 (email?'<a class="mail rv" href="mailto:'+esc(email)+'">'+esc(email)+'</a>':'')+(phone?'<span class="ph rv"><a href="tel:'+esc(tel)+'">'+esc(phone)+'</a></span>':'')+
 '<div class="cta rv">'+(email?'<a class="btn pink" href="mailto:'+esc(email)+'">Email me →</a>':'')+'<button class="btn" type="button" id="pdf2">Download PDF ↓</button></div>'+
 '<div class="foot"><span>© '+new Date().getFullYear()+' '+esc(name)+'</span><a href="#top">Back to top ↑</a></div></div></section>';
$('#app').innerHTML=out;
$('#pdf2').addEventListener('click',function(){window.print()});

/* fit giant name to width */
var nameEl=$('.name');
function fit(){if(!nameEl)return;nameEl.style.setProperty('--fs','100px');var m=0;$$('.w>span',nameEl).forEach(function(s){m=Math.max(m,s.offsetWidth)});
 var avail=nameEl.parentElement.clientWidth-parseFloat(getComputedStyle(nameEl.parentElement).paddingLeft)*2;
 var size=m?Math.min(100*avail/m*.98,Math.min(300,innerHeight*.5>150?Math.max(innerHeight*.42,180):150)):100;
 nameEl.style.setProperty('--fs',Math.max(34,size)+'px')}
fit();var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(fit,100)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

/* reveal */
var targets=$$('.rv,.stamp,.skill');
if(still||!('IntersectionObserver' in window)){targets.forEach(function(t){t.classList.add('in')})}
else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -6% 0px'});targets.forEach(function(t){io.observe(t)})}

/* slam shake */
if(!still){var last=Math.max(0,words.length-1);setTimeout(function(){var h=$('#hero');h.classList.add('shake');setTimeout(function(){h.classList.remove('shake')},400)},150+last*280+520)}

/* progress + nav spy */
var prog=$('#prog'),ticking=false,links=$$('#navlist a');
function onScroll(){var h=root.scrollHeight-innerHeight;prog.style.transform='scaleX('+(h>0?Math.min(1,scrollY/h):0)+')';ticking=false}
addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(onScroll)}},{passive:true});onScroll();
if('IntersectionObserver' in window){var spy=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id);if(a.classList.contains('on')&&a.scrollIntoView&&a.offsetParent)a.parentNode.parentNode.scrollTo&&a.parentNode.parentNode.scrollTo({left:a.parentNode.offsetLeft-20})})}})},{rootMargin:'-45% 0px -50% 0px'});secs.forEach(function(s){var el=document.getElementById(s[0]);if(el)spy.observe(el)})}

/* marquee motion: reverses with scroll direction */
if(!still){
 var tr=[{el:$('#t1'),pos:0,dir:1,sp:1.1},{el:$('#t2'),pos:0,dir:-1,sp:.8}],boost=0,lastY=scrollY,sdir=1,vis=true;
 addEventListener('scroll',function(){var dy=scrollY-lastY;lastY=scrollY;if(dy){sdir=dy>0?1:-1;boost=Math.min(boost+Math.abs(dy)*.25,22)}},{passive:true});
 if('IntersectionObserver' in window)new IntersectionObserver(function(es){vis=es[0].isIntersecting}).observe($('.mq'));
 (function loop(){if(vis){boost*=.92;tr.forEach(function(t,i){var half=t.el.scrollWidth/2||1;t.pos+=t.dir*sdir*(t.sp+boost);t.pos=((t.pos%half)+half)%half;t.el.style.transform='translate3d('+(-t.pos)+'px,0,0)'})}requestAnimationFrame(loop)})();
}

/* confetti */
function burst(x,y){if(still)return;var cols=['#ff2e93','#0b0b0b','#fff','#f6f000'];for(var i=0;i<28;i++){var c=document.createElement('div');c.className='confetti';c.style.background=cols[i%4];c.style.border='2px solid #0b0b0b';document.body.appendChild(c);var a=Math.random()*Math.PI*2,d=90+Math.random()*190;
 var an=c.animate([{transform:'translate('+x+'px,'+y+'px) rotate(0)',opacity:1},{transform:'translate('+(x+Math.cos(a)*d)+'px,'+(y+Math.sin(a)*d+140)+'px) rotate('+(Math.random()*720-360)+'deg)',opacity:0}],{duration:900+Math.random()*500,easing:'cubic-bezier(.2,.7,.3,1)'});an.onfinish=(function(el){return function(){el.remove()}})(c)}}
var bd=$('#badge');if(bd)bd.addEventListener('click',function(e){var r=bd.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2)});

/* custom cursor (fine pointers only) */
if(!RM&&window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches){
 var cur=$('#cur'),dot=$('#cdot'),cx=0,cy=0,tx=0,ty=0,on=false;
 addEventListener('mousemove',function(e){tx=e.clientX;ty=e.clientY;if(!on){on=true;cx=tx;cy=ty;root.classList.add('cur');cur.classList.add('vis');dot.classList.add('vis')}
  cur.classList.toggle('big',!!e.target.closest('a,button,.card,.sticker'))},{passive:true});
 document.addEventListener('mouseleave',function(){cur.classList.remove('vis');dot.classList.remove('vis');on=false;root.classList.remove('cur')});
 addEventListener('mousedown',function(){cur.classList.add('down')});addEventListener('mouseup',function(){cur.classList.remove('down')});
 (function f(){cx+=(tx-cx)*.2;cy+=(ty-cy)*.2;cur.style.transform='translate3d('+cx+'px,'+cy+'px,0)';dot.style.transform='translate3d('+tx+'px,'+ty+'px,0)';requestAnimationFrame(f)})();
}
})();
</script>
</body>
</html>
