<style>
:root{
  --bg:#05060f; --ink:#d9e0f5; --mute:#a3add0; --acc:#8fa8ff; --acc2:#c7a6ff; --sun:#ffb454; --line:rgba(143,168,255,.22);
  --sans:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"Space Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:1.1rem;line-height:1.7;overflow-x:hidden;min-height:100vh}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
.wrap{width:min(1100px,100% - 40px);margin-inline:auto}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--acc)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.neb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.neb i{position:absolute;border-radius:50%;filter:blur(90px);animation:drift 40s ease-in-out infinite alternate}
.neb i:nth-child(1){width:70vmax;height:70vmax;left:-25vmax;top:-20vmax;background:radial-gradient(circle,rgba(92,70,200,.34),transparent 65%)}
.neb i:nth-child(2){width:60vmax;height:60vmax;right:-25vmax;top:30vh;background:radial-gradient(circle,rgba(30,130,190,.22),transparent 65%);animation-delay:-14s}
.neb i:nth-child(3){width:55vmax;height:55vmax;left:10vmax;bottom:-30vmax;background:radial-gradient(circle,rgba(190,60,140,.2),transparent 65%);animation-delay:-26s}
@keyframes drift{to{transform:translate(8vmax,5vmax) scale(1.15)}}
main,footer{position:relative;z-index:2}

/* nav */
nav.top{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:center;padding:10px 12px}
nav.top ul{list-style:none;display:flex;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none;background:rgba(8,10,28,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:40px;padding:4px}
nav.top ul::-webkit-scrollbar{display:none}
nav.top a{display:block;white-space:nowrap;text-decoration:none;font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;color:var(--ink);padding:0 14px;line-height:40px;border-radius:30px;transition:background .3s,color .3s}
nav.top a:hover,nav.top a.on{background:rgba(143,168,255,.2);color:#fff}

/* hero */
.hero{min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:110px 0 120px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:50%;bottom:-62vmax;width:120vmax;height:70vmax;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,#0a1230 62%,#18306e 90%,rgba(110,150,255,.55) 98%,transparent 100%);box-shadow:0 -10px 80px rgba(110,150,255,.35);z-index:-1}
.hero .wrap{text-align:center}
.pres{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:30px;padding:6px 16px;background:rgba(8,10,28,.5)}
.pres b{width:8px;height:8px;border-radius:50%;background:#5dffb0;box-shadow:0 0 10px #5dffb0;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.25}}
h1{font-weight:200;font-size:clamp(2.6rem,9vw,7rem);line-height:1;letter-spacing:-.02em;margin:1.4rem 0 1rem;color:#f2f5ff;text-shadow:0 0 40px rgba(143,168,255,.45);overflow-wrap:anywhere}
h1 span{display:inline-block;animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.08s + .2s);white-space:pre}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.ttl{font-size:clamp(1.05rem,2.6vw,1.5rem);font-weight:300;color:var(--acc2);max-width:34em;margin:0 auto}
.sum{max-width:40em;margin:1.6rem auto 0;color:var(--mute)}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:2.2rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 30px;border-radius:40px;font-family:var(--sans);font-weight:500;font-size:1rem;text-decoration:none;cursor:pointer;border:1px solid var(--acc);color:#fff;background:transparent;transition:transform .3s,box-shadow .3s,background .3s}
.btn.solid{background:linear-gradient(135deg,#6f86ff,#a779ff);border-color:transparent;box-shadow:0 8px 30px -8px rgba(120,130,255,.8)}
.btn:hover{transform:translateY(-3px);background:rgba(143,168,255,.18)}
.btn.solid:hover{background:linear-gradient(135deg,#8397ff,#b78cff);box-shadow:0 12px 36px -6px rgba(120,130,255,.9)}
.stats{display:flex;justify-content:center;gap:clamp(20px,5vw,60px);margin-top:3rem;flex-wrap:wrap}
.stats div{text-align:center}.stats b{display:block;font-weight:200;font-size:2.4rem;line-height:1;color:#fff}
.hint{display:block;margin:2.6rem auto 0;width:1px;height:56px;background:linear-gradient(var(--acc),transparent);transform-origin:top;animation:hint 2.4s ease-in-out infinite}
@keyframes hint{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

section{position:relative;padding:clamp(70px,11vw,130px) 0}
.sh{text-align:center;margin-bottom:clamp(40px,7vw,80px)}
.sh h2{font-weight:200;font-size:clamp(2rem,6vw,3.8rem);line-height:1.1;margin-top:.5rem;color:#fff}
.sh p{color:var(--mute);margin-top:.6rem}
.rv{opacity:0;transform:translateY(40px);transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.rv.in,html.static .rv{opacity:1;transform:none}

/* orbit */
.orbit{position:relative;padding-bottom:20px}
.orbit::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:repeating-linear-gradient(to bottom,rgba(143,168,255,.45) 0 6px,transparent 6px 16px)}
.probe{position:absolute;left:50%;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 16px 4px rgba(143,168,255,.9),0 0 50px 10px rgba(143,168,255,.4);z-index:3;will-change:transform}
.probe::before{content:"";position:absolute;left:50%;bottom:50%;width:2px;height:120px;margin-left:-1px;background:linear-gradient(transparent,rgba(190,205,255,.8))}
.sunstop{position:relative;z-index:2;text-align:center;padding-bottom:50px}
.sun{position:relative;width:min(230px,56vw);aspect-ratio:1;margin:0 auto 34px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#fff8d6,#ffd36b 28%,#ff9a2e 62%,#d4501a);
  box-shadow:0 0 40px 10px rgba(255,170,60,.7),0 0 120px 40px rgba(255,130,40,.38),0 0 260px 90px rgba(255,100,30,.2);animation:sunp 5s ease-in-out infinite}
.sun::before{content:"";position:absolute;inset:-60%;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,200,110,.16) 0 4deg,transparent 4deg 14deg);-webkit-mask-image:radial-gradient(circle,transparent 24%,#000 26%,transparent 70%);mask-image:radial-gradient(circle,transparent 24%,#000 26%,transparent 70%);animation:spin 80s linear infinite}
@keyframes sunp{50%{transform:scale(1.04);filter:brightness(1.12)}}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:linear-gradient(160deg,rgba(18,22,56,.72),rgba(10,12,34,.72));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:20px;padding:26px 28px}
.card h3{font-weight:400;font-size:clamp(1.25rem,2.6vw,1.6rem);line-height:1.25;color:#fff}
.card .co{color:var(--acc2);font-weight:400;margin-top:.2rem}
.card .meta{display:flex;flex-wrap:wrap;gap:2px 16px;margin:.7rem 0}
.card p{color:var(--mute);font-size:1.02rem;line-height:1.65}
.sunstop .card{max-width:640px;margin:0 auto;border-color:rgba(255,180,84,.4);box-shadow:0 0 60px -20px rgba(255,150,60,.5)}
.sunstop .mono.now{color:var(--sun)}
.stop{position:relative;display:grid;grid-template-columns:1fr 200px 1fr;align-items:center;padding:clamp(20px,3vw,40px) 0}
.stop .card{grid-column:1;grid-row:1;text-align:right}
.stop .card .meta{justify-content:flex-end}
.stop .plw{grid-column:2;grid-row:1;justify-self:center;position:relative;display:flex;align-items:center;justify-content:center;width:200px;height:170px}
.stop.r .card{grid-column:3;text-align:left}.stop.r .card .meta{justify-content:flex-start}
.plw::before{content:"";position:absolute;width:190px;height:70px;border:1px dashed rgba(143,168,255,.22);border-radius:50%;transform:rotate(-14deg)}
.pl{position:relative;width:var(--s);aspect-ratio:1;z-index:2;animation:float 9s ease-in-out infinite;animation-delay:var(--fd,0s)}
@keyframes float{50%{transform:translateY(-8px)}}
.sph{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 32% 28%,var(--c1),var(--c2) 52%,var(--c3));box-shadow:inset -.22em -.16em .5em rgba(0,0,0,.7),0 0 46px -6px var(--c2);font-size:var(--s)}
.sph i{position:absolute;inset:0;background:repeating-linear-gradient(8deg,rgba(255,255,255,.1) 0 6%,transparent 6% 15%,rgba(0,0,0,.12) 15% 21%,transparent 21% 33%);background-size:200% 100%;animation:band 30s linear infinite;mix-blend-mode:soft-light}
@keyframes band{to{background-position:200% 0}}
.ring{position:absolute;left:-42%;right:-42%;top:34%;bottom:34%;border:4px solid rgba(255,235,200,.45);border-radius:50%;transform:rotate(-22deg);z-index:3;box-shadow:0 0 14px rgba(255,235,200,.25)}
.moon{position:absolute;width:22%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#9aa3c0 60%,#4b5272);right:-30%;top:4%;z-index:3;animation:float 6s ease-in-out infinite reverse}

/* constellations */
.cons{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px}
.con{border:1px solid var(--line);border-radius:20px;padding:20px 22px 24px;background:rgba(10,12,34,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.con svg{width:100%;height:auto;display:block;overflow:visible}
.con .ln{stroke:rgba(143,168,255,.18);stroke-width:1;stroke-dasharray:3 4;fill:none}
.con .ln.on{stroke:#8fa8ff;stroke-width:1.4;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1s ease;transition-delay:calc(var(--k)*.3s + .6s)}
.con.in .ln.on,html.static .con .ln.on{stroke-dashoffset:0}
.con .st{fill:#38426b;transition:fill .6s,r .6s;transition-delay:calc(var(--k)*.3s + .3s)}
.con.in .st.on,html.static .con .st.on{fill:#fff;filter:drop-shadow(0 0 4px #bcd0ff);animation:tw 3.5s ease-in-out infinite;animation-delay:calc(var(--k)*.6s)}
@keyframes tw{50%{opacity:.55}}
.con h3{font-weight:400;font-size:1.2rem;margin-top:10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.con h3 small{font-family:var(--mono);font-size:.72rem;color:var(--acc);letter-spacing:.1em;flex:none}

/* patches */
.patches{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px}
.patches li{display:flex;align-items:center;gap:16px;padding:14px 18px;border:1px solid var(--line);border-radius:60px;background:rgba(10,12,34,.5);min-height:68px;transition:transform .35s,border-color .35s,background .35s}
.patches li:hover{transform:translateY(-3px);border-color:var(--acc);background:rgba(40,50,110,.35)}
.patches li::before{content:"\2726";flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#9fb4ff,#5b3fd0);color:#fff;font-size:1.05rem;box-shadow:0 0 18px rgba(130,120,255,.6)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,80px)}
.two h2{font-weight:200;font-size:clamp(1.7rem,4vw,2.5rem);color:#fff;margin:.3rem 0 1rem}
.row{padding:16px 0;border-bottom:1px solid var(--line)}
.row b{display:block;font-weight:400;font-size:1.2rem;color:#fff}
.row span{display:block;color:var(--mute)}
.row .mono{margin-top:2px}
.row.lg{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sig{display:inline-flex;gap:3px;align-items:flex-end;height:18px;flex:none}
.sig i{width:5px;background:rgba(143,168,255,.25);border-radius:2px}.sig i.on{background:var(--acc)}
.sig i:nth-child(1){height:6px}.sig i:nth-child(2){height:10px}.sig i:nth-child(3){height:14px}.sig i:nth-child(4){height:18px}

.contact{text-align:center;padding-bottom:140px}
.contact h2{font-weight:200;font-size:clamp(2.2rem,8vw,5.5rem);line-height:1.05;color:#fff}
.contact p{color:var(--mute);max-width:30em;margin:1rem auto 0}
.contact small{display:block;margin-top:3.4rem;color:var(--mute);font-size:.9rem}

@media(max-width:820px){
  .two{grid-template-columns:1fr}
  .orbit::before{left:34px}.probe{left:34px}
  .stop,.stop.r{grid-template-columns:68px 1fr;gap:0 18px;align-items:start;padding:18px 0}
  .stop .plw,.stop.r .plw{grid-column:1;width:68px;height:68px;justify-self:center;margin-top:18px}
  .plw::before{display:none}
  .stop .pl{width:min(var(--s),52px)!important}
  .stop .card,.stop.r .card{grid-column:2;text-align:left;padding:20px 20px}
  .stop .card .meta{justify-content:flex-start}
  .sunstop{padding-left:0}
  .ring{border-width:2px}
}
@media(max-width:480px){.btn{width:100%}.card{padding:18px}h1{letter-spacing:-.01em}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .rv,h1 span{opacity:1;transform:none}.con .ln.on{stroke-dashoffset:0}.con .st.on{fill:#fff}
}
@media print{
  @page{margin:14mm}
  html,body{background:#fff!important;color:#111!important;font-size:10.5pt;font-weight:400}
  #sky,.neb,nav.top,.btns,.hint,.probe,.moon,.ring,.hero::after,.sph i,.plw::before,.sun::before{display:none!important}
  *{animation:none!important;transition:none!important;opacity:1!important;transform:none!important;filter:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;text-shadow:none!important}
  .hero{min-height:0;padding:0 0 10pt}.hero .wrap,.sh,.contact{text-align:left}
  h1{font-size:26pt;color:#000;margin:6pt 0}
  .sh h2,.two h2,.contact h2,.card h3,.row b,.stats b{color:#000!important;font-size:14pt}.sh{margin-bottom:6pt}
  .ttl,.card .co,.mono,.con h3 small{color:#333!important}.sum,.card p,.row span,.contact p,.sh p{color:#222!important}
  section{padding:8pt 0}.stop,.row,.con{break-inside:avoid}
  .orbit::before{display:none}
  .sun{width:14pt;margin:0 0 4pt;box-shadow:none;background:#999}.sunstop{padding:0 0 6pt;text-align:left}
  .stop,.stop.r{display:block;padding:4pt 0}.plw{display:none}
  .card{background:none;border:0;border-bottom:1px solid #ccc;border-radius:0;padding:4pt 0;box-shadow:none!important;text-align:left!important;max-width:none!important}
  .card .meta{justify-content:flex-start!important}
  .cons{grid-template-columns:1fr 1fr 1fr;gap:6pt}.con{border:1px solid #ccc;background:none;padding:6pt}.con .st{fill:#ccc}.con .st.on{fill:#000}.con .ln.on{stroke:#000;stroke-dashoffset:0!important}
  .patches{grid-template-columns:1fr 1fr;gap:3pt}.patches li{border:0;background:none;min-height:0;padding:1pt 0;border-radius:0}.patches li::before{width:12pt;height:12pt;background:none;color:#555;box-shadow:none;font-size:9pt}
  .row{border-color:#ccc}.sig i{background:#ccc!important}.sig i.on{background:#000!important}.stats{display:none}.contact{padding-bottom:0}.contact small{display:none}.contact h2{font-size:14pt}
}
html.static .hero{min-height:880px!important}html.static h1 span{animation:none!important}
</style>
</head>

var yrs=[]; jobs.forEach(function(j){var m=j&&j.dates&&String(j.dates).match(/(19|20)\d{2}/g);if(m)m.forEach(function(y){yrs.push(+y)})});
var span = yrs.length? new Date().getFullYear()-Math.min.apply(null,yrs):0;
var cos={}; jobs.forEach(function(j){if(j&&j.co)cos[j.co]=1});

var PAL=[["#d9f1ff","#4aa3e8","#0a2350"],["#ffe6c7","#d98a4a","#4a2108"],["#e6d5ff","#8c5cd6","#24104d"],["#d5ffe9","#3fb88a","#07372b"],["#ffd5dc","#d9577a","#4a0f25"],["#f3ecc9","#b9a45a","#3b330f"],["#d3e4ff","#5a78d6","#101d52"],["#ffe0b8","#e0663a","#4d1308"]];
var SIZES=[118,96,128,104,136,92,112,124];
var now = function(j){return /present|current|now/i.test((j&&j.dates)||"")};
var nav=[], h='';

/* HERO */
var nameHtml=''; Array.from(name).forEach(function(ch,i){nameHtml+='<span style="--i:'+i+'">'+esc(ch)+'</span>'});
h += '<header class="hero" id="top"><div class="wrap"><span class="mono pres"><b></b>Transmitting from the present</span>'+
 '<h1 aria-label="'+esc(name)+'">'+nameHtml.replace(/<span/g,'<span aria-hidden="true"')+'</h1>'+
 (D.title?'<p class="ttl rv" style="--d:.5s">'+esc(D.title)+'</p>':'')+
 (D.summary?'<p class="sum rv" style="--d:.7s">'+esc(D.summary)+'</p>':'')+
 '<div class="btns rv" style="--d:.9s">'+(D.email?'<a class="btn solid" href="mailto:'+esc(D.email)+'">Email me</a>':'')+'<button class="btn" type="button" id="pdf">Download PDF</button></div>'+
 ((span||jobs.length)?'<div class="stats rv" style="--d:1.1s">'+(span?'<div><b>'+span+'+</b><span class="mono">Years in orbit</span></div>':'')+(jobs.length?'<div><b>'+jobs.length+'</b><span class="mono">Worlds visited</span></div>':'')+(Object.keys(cos).length>1?'<div><b>'+Object.keys(cos).length+'</b><span class="mono">Systems</span></div>':'')+'</div>':'')+
 '<span class="hint" aria-hidden="true"></span></div></header>';

/* EXPERIENCE */
if(jobs.length){
 nav.push(["orbit","Journey"]);
 h += '<section id="orbit"><div class="wrap"><div class="sh rv"><span class="mono">Mission log</span><h2>A journey through time</h2><p>From the present, back to where it began.</p></div><div class="orbit" id="orb"><span class="probe" id="probe" aria-hidden="true"></span>';
 var pi=0;
 jobs.forEach(function(j,i){ j=j||{};
  var meta='<div class="meta">'+(j.dates?'<span class="mono">'+esc(j.dates)+'</span>':'')+(j.loc?'<span class="mono" style="color:var(--mute)">'+esc(j.loc)+'</span>':'')+'</div>';
  var body='<h3>'+esc(j.role||"")+'</h3>'+(j.co?'<div class="co">'+esc(j.co)+'</div>':'')+meta+(j.text?'<p>'+esc(j.text)+'</p>':'');
  if(i===0 && now(j)){
   h += '<div class="sunstop"><div class="sun rv" aria-hidden="true"></div><div class="card rv"><span class="mono now">&#9788; The present &mdash; the sun</span>'+body+'</div></div>';
  }else{
   var p=PAL[pi%PAL.length], s=SIZES[pi%SIZES.length]; pi++;
   h += '<div class="stop'+(i%2?' r':'')+'"><div class="plw rv"><div class="pl" style="--s:'+s+'px;--c1:'+p[0]+';--c2:'+p[1]+';--c3:'+p[2]+';--fd:-'+(pi*1.7)+'s" aria-hidden="true"><div class="sph"><i></i></div>'+(pi%3===1?'<span class="ring"></span>':'')+(pi%3===0?'<span class="moon"></span>':'')+'</div></div><div class="card rv" style="--d:.12s">'+body+'</div></div>';
  }
 });
 h += '</div></div></section>';
}

/* SKILLS */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
if(skills.length){
 nav.push(["stars","Skills"]);
 h += '<section id="stars"><div class="wrap"><div class="sh rv"><span class="mono">Star charts</span><h2>Constellations of skill</h2><p>The more stars that glow, the deeper the expertise.</p></div><div class="cons">';
 skills.forEach(function(s,i){
  var lv=Math.max(0,Math.min(5,Math.round(+s[1]||0))), r=rng(i*977+String(s[0]).length*31+7), pts=[];
  for(var k=0;k<5;k++) pts.push([+(14+k*43+(r()*20-10)).toFixed(1), +(14+r()*72).toFixed(1)]);
  var edges=[[0,1],[1,2],[2,3],[3,4],[1,3]], svg='<svg viewBox="0 0 200 100" role="img" aria-label="'+lv+' of 5 stars lit">';
  edges.forEach(function(e){var a=pts[e[0]],b=pts[e[1]],on=Math.max(e[0],e[1])<lv;svg+='<line class="ln'+(on?' on':'')+'" style="--k:'+Math.max(e[0],e[1])+'" pathLength="100" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"/>'});
  pts.forEach(function(p,k){svg+='<circle class="st'+(k<lv?' on':'')+'" style="--k:'+k+'" cx="'+p[0]+'" cy="'+p[1]+'" r="'+(k<lv?3.4:2.4)+'"/>'});
  svg+='</svg>';
  h += '<div class="con rv" style="--d:'+(i%3*.12)+'s">'+svg+'<h3><span>'+esc(s[0])+'</span><small>'+lv+'/5</small></h3></div>';
 });
 h += '</div></div></section>';
}
/* CERTS */
if(certs.length){
 nav.push(["patches","Patches"]);
 h += '<section id="patches"><div class="wrap"><div class="sh rv"><span class="mono">Mission patches</span><h2>Certifications &amp; honors</h2></div><ul class="patches">';
 certs.forEach(function(c,i){h += '<li class="rv" style="--d:'+(i%3*.08)+'s">'+esc(c)+'</li>'});
 h += '</ul></div></section>';
}
/* EDU + LANGS */
if(edu.length||langs.length){
 nav.push(["academy","Academy"]);
 h += '<section id="academy"><div class="wrap two">';
 if(edu.length){h += '<div class="rv"><span class="mono">Flight academy</span><h2>Education</h2>';
  edu.forEach(function(e){h += '<div class="row"><b>'+esc(e[0])+'</b>'+(e[2]?'<span>'+esc(e[2])+'</span>':'')+(e[1]?'<span class="mono">'+esc(e[1])+'</span>':'')+'</div>'});h += '</div>';}
 if(langs.length){h += '<div class="rv" style="--d:.15s"><span class="mono">Comms channels</span><h2>Languages</h2>';
  langs.forEach(function(e){var t=String(e[1]||""),n=/native|bilingual|fluent/i.test(t)?4:/professional|advanced/i.test(t)?3:/intermediate|conversational/i.test(t)?2:1;
   h += '<div class="row lg"><div><b>'+esc(e[0])+'</b><span>'+esc(t)+'</span></div><span class="sig" aria-hidden="true">'+[1,2,3,4].map(function(k){return '<i'+(k<=n?' class="on"':'')+'></i>'}).join('')+'</span></div>'});h += '</div>';}
 h += '</div></section>';
}
/* CONTACT */
nav.push(["contact","Contact"]);
h += '<section class="contact" id="contact"><div class="wrap"><div class="rv"><span class="mono">Open channel</span><h2>Ready for the next mission?</h2><p>Send a transmission &mdash; I&rsquo;ll respond at light speed.</p>'+
 '<div class="btns">'+(D.email?'<a class="btn solid" href="mailto:'+esc(D.email)+'">'+esc(D.email)+'</a>':'')+(D.phone?'<a class="btn" href="tel:'+esc(String(D.phone).replace(/[^\d+]/g,""))+'">'+esc(D.phone)+'</a>':'')+'</div>'+
 '<small>&copy; '+new Date().getFullYear()+' '+esc(name)+'</small></div></div></section>';

$("#app").innerHTML=h;
var nl='<li><a href="#top">Top</a></li>'; nav.forEach(function(n){nl+='<li><a href="#'+n[0]+'">'+esc(n[1])+'</a></li>'}); $("#navl").innerHTML=nl;
var pdf=$("#pdf"); if(pdf) pdf.addEventListener("click",function(){window.print()});

/* reveal */
var rvs=document.querySelectorAll(".rv");
if("IntersectionObserver" in window && !RM && !STATIC){
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.1,rootMargin:"0px 0px -6% 0px"});
 rvs.forEach(function(r){io.observe(r)});
}else rvs.forEach(function(r){r.classList.add("in")});

/* scroll: probe + nav */
var probe=$("#probe"), orb=$("#orb"), links=[].slice.call(document.querySelectorAll("#navl a")),
    secs=links.map(function(a){return document.getElementById(a.getAttribute("href").slice(1))}), tick=false;
function upd(){
 tick=false;
 if(orb&&probe){var r=orb.getBoundingClientRect(), y=Math.min(r.height,Math.max(0,innerHeight*.55-r.top)); probe.style.transform="translateY("+y+"px)"; probe.style.opacity=(r.top<innerHeight*.55&&r.bottom>innerHeight*.3)?1:0}
 var cur=-1; secs.forEach(function(s,i){if(s&&s.getBoundingClientRect().top<innerHeight*.4)cur=i});
 links.forEach(function(a,i){a.classList.toggle("on",i===cur)});
}
addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});
addEventListener("resize",upd); upd();

/* starfield */
var cv=$("#sky"), cx=cv.getContext&&cv.getContext("2d");
if(cx){
 var W=0,H=0,dpr=1,stars=[],shoot=[],px=0,py=0,tx=0,ty=0,nextShoot=2000,last=0,hidden=false;
 function size(){dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  var n=Math.min(420,Math.round(W*H/4200)); stars=[];
  for(var i=0;i<n;i++){var z=Math.random();stars.push({x:Math.random(),y:Math.random(),z:z*z*.9+.1,r:Math.random()*1.2+.3,p:Math.random()*6.28,c:Math.random()<.15?"200,215,255":Math.random()<.1?"255,225,200":"255,255,255"})}
  draw(0)}
 function draw(t){
  cx.clearRect(0,0,W,H); var sy=scrollY;
  for(var i=0;i<stars.length;i++){var s=stars[i];
   var y=((s.y*H - sy*s.z*.35 - py*s.z*14)%H+H)%H, x=((s.x*W - px*s.z*18)%W+W)%W;
   var a=.35+.65*s.z; if(!RM) a*=.75+.25*Math.sin(t/900*s.z*2+s.p);
   cx.fillStyle="rgba("+s.c+","+a.toFixed(3)+")"; cx.beginPath(); cx.arc(x,y,s.r*(.6+s.z*.7),0,6.283); cx.fill();}
  for(var k=shoot.length-1;k>=0;k--){var m=shoot[k]; var g=cx.createLinearGradient(m.x,m.y,m.x-m.vx*14,m.y-m.vy*14);
   g.addColorStop(0,"rgba(255,255,255,"+m.l+")");g.addColorStop(1,"rgba(255,255,255,0)");cx.strokeStyle=g;cx.lineWidth=1.6;cx.beginPath();cx.moveTo(m.x,m.y);cx.lineTo(m.x-m.vx*14,m.y-m.vy*14);cx.stroke();}
 }
 function loop(t){
  requestAnimationFrame(loop); if(hidden)return; var dt=Math.min(50,t-last);last=t;
  px+=(tx-px)*.04;py+=(ty-py)*.04;
  nextShoot-=dt; if(nextShoot<=0){nextShoot=3500+Math.random()*6000;var a=.35+Math.random()*.3;shoot.push({x:Math.random()*W*.9+W*.1,y:Math.random()*H*.4,vx:-Math.cos(a)*9,vy:Math.sin(a)*9,l:1})}
  for(var k=shoot.length-1;k>=0;k--){var m=shoot[k];m.x+=m.vx*dt/16;m.y+=m.vy*dt/16;m.l-=dt/900;if(m.l<=0)shoot.splice(k,1)}
  draw(t);
 }
 size(); addEventListener("resize",size);
 if(!RM){
  addEventListener("pointermove",function(e){tx=e.clientX/W-.5;ty=e.clientY/H-.5},{passive:true});
  document.addEventListener("visibilitychange",function(){hidden=document.hidden});
  requestAnimationFrame(loop);
 }else addEventListener("scroll",function(){draw(0)},{passive:true});
}
})();
</script>
</body>
</html>
