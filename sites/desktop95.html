<style>
:root{--face:#c0c0c0;--hi:#fff;--lo:#808080;--dk:#404040;--teal:#008080;--navy:#000080;--ui:Tahoma,Verdana,Geneva,'DejaVu Sans',Arial,sans-serif;--px:'Pixelify Sans',Tahoma,Verdana,Arial,sans-serif;--mono:'VT323','Courier New',Courier,monospace;--tb:40px}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html,body{height:100%;overflow:hidden;background:var(--teal)}
body{font:13px/1.4 var(--ui);color:#000;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:default}
:focus-visible{outline:1px dotted #000;outline-offset:-4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rz{border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--lo),inset 1px 1px #dfdfdf;background:var(--face)}
.sk{border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:inset 1px 1px var(--dk);background:#fff}

/* desktop */
#desk{position:fixed;left:0;right:0;top:0;bottom:calc(var(--tb) + env(safe-area-inset-bottom));overflow:hidden;background:var(--teal)}
#desk::after{content:attr(data-wm);position:absolute;right:16px;bottom:10px;font:400 22px var(--px);color:rgba(0,0,0,.28);text-shadow:1px 1px 0 rgba(255,255,255,.16);pointer-events:none;text-align:right;max-width:60%;white-space:pre-line}
#icons{position:absolute;inset:0;padding:8px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:4px}
.ic{width:84px;padding:4px 2px 6px;background:none;border:0;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font:12px/1.2 var(--ui);-webkit-tap-highlight-color:transparent}
.ic svg{width:40px;height:40px;shape-rendering:crispEdges;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.35))}
.ic span{padding:1px 3px;overflow-wrap:anywhere;text-shadow:1px 1px 0 #000}
.ic.sel svg{filter:drop-shadow(1px 1px 0 rgba(0,0,0,.35)) brightness(.6) sepia(1) hue-rotate(190deg) saturate(5)}
.ic.sel span{background:var(--navy);outline:1px dotted #ff0;text-shadow:none}
.ic:focus-visible{outline:none}.ic:focus-visible span{outline:1px dotted #ff0;background:var(--navy)}

/* windows */
.win{position:absolute;display:flex;flex-direction:column;padding:2px;min-width:200px;box-shadow:1px 1px 0 #000,2px 2px 0 rgba(0,0,0,.3);border:2px solid;border-color:var(--face) var(--dk) var(--dk) var(--face);background:var(--face);outline:1px solid #000;outline-offset:-0px}
.win.off{display:none}
.win.pop{animation:pop .16s steps(4)}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
.tb{flex:none;display:flex;align-items:center;gap:4px;height:24px;padding:2px 2px 2px 4px;background:var(--lo);color:#e4e4e4;touch-action:none;cursor:default}
.win.act .tb{background:linear-gradient(90deg,var(--navy),#1084d0);color:#fff}
.ti{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.ti svg{width:16px;height:16px;flex:none;shape-rendering:crispEdges}
.ti b{font:700 14px/1 var(--px);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbs{display:flex;gap:2px}
.wb{width:20px;height:18px;padding:0;display:grid;place-items:center;border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--lo);background:var(--face);color:#000}
.wb:active{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--lo)}
.wb svg{width:10px;height:10px;shape-rendering:crispEdges}
.wb[data-a=close]{margin-left:2px}
.wbody{flex:1;min-height:0;margin-top:2px;overflow:auto;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:inset 1px 1px var(--dk);background:#fff;-webkit-user-select:text;user-select:text;-webkit-overflow-scrolling:touch}
.wbody.face{background:var(--face)}
.sb{flex:none;display:flex;gap:2px;margin-top:2px;font-size:11px}
.sb span{flex:1;padding:2px 6px;border:1px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important}
::-webkit-scrollbar{width:16px;height:16px}
::-webkit-scrollbar-track{background:conic-gradient(var(--face) 25%,#fff 0 50%,var(--face) 0 75%,#fff 0) 0 0/4px 4px}
::-webkit-scrollbar-thumb{background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--lo)}
::-webkit-scrollbar-corner{background:var(--face)}

.b3{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:30px;padding:4px 16px;border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--lo),inset 1px 1px #dfdfdf;background:var(--face);color:#000;text-decoration:none;font:13px var(--ui);white-space:nowrap;cursor:default;-webkit-tap-highlight-color:transparent}
.b3:active,.b3.on{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--lo);padding:5px 15px 3px 17px}
.b3 svg{width:18px;height:18px;shape-rendering:crispEdges}
.b3:focus-visible{outline:1px dotted #000;outline-offset:-5px}

/* contents */
.note{padding:14px 16px 18px;font:22px/1.2 var(--mono);color:#000}
.note h1{font:700 24px/1.1 var(--px);margin-bottom:2px}
.note .role{font:20px/1.2 var(--mono);color:var(--navy);margin-bottom:10px}
.note hr{border:0;border-top:2px dashed #888;margin:10px 0}
.note p{font-size:21px;line-height:1.25}
.ty::after{content:'';display:inline-block;width:.5em;height:.9em;background:#000;vertical-align:-.1em;animation:blink 1s steps(2) infinite}
.rest{visibility:hidden}
.done .ty::after{display:none}
@keyframes blink{50%{opacity:0}}
.tree{padding:8px 6px}
.nd{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 4px;background:none;border:0;min-height:30px}
.nd:hover{background:#eef}
.pm{flex:none;width:13px;height:13px;border:1px solid #808080;background:#fff;position:relative}
.pm::before{content:'';position:absolute;left:2px;right:2px;top:5px;height:1px;background:#000}
.pm::after{content:'';position:absolute;top:2px;bottom:2px;left:5px;width:1px;background:#000}
.nd[aria-expanded=true] .pm::after{display:none}
.nd svg{width:20px;height:20px;flex:none;shape-rendering:crispEdges}
.nd b{font-weight:700;flex:1;min-width:0}
.nd small{color:#555;font-size:11px;white-space:nowrap}
.det{margin:0 0 6px 29px;padding:8px 10px 10px 12px;border-left:1px dotted #808080;background:#ffffe1;border:1px solid #000;font-size:12.5px;line-height:1.5}
.det[hidden]{display:none}
.det .m{color:var(--navy);font-weight:700;margin-bottom:4px}
.det .m span{font-weight:400;color:#333}
.sgrp{padding:14px 14px 8px;background:var(--face);min-height:100%}
.sgrp h2{font:700 15px var(--px);margin-bottom:10px}
.pr{margin-bottom:12px}
.pr .l{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px;font-size:12.5px}
.pr .l span:last-child{color:#333}
.pb{height:20px;padding:2px;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);background:#fff}
.pb i{display:block;height:100%;width:var(--w);background:repeating-linear-gradient(90deg,var(--navy) 0 9px,transparent 9px 11px);transition:width 1.1s steps(12)}
.js .win:not(.go) .pb i{width:0}
.files{padding:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px}
.fl{display:flex;align-items:center;gap:8px;text-align:left;padding:5px 6px;background:none;border:0;min-height:36px;font-size:12.5px;line-height:1.25}
.fl svg{width:26px;height:26px;flex:none;shape-rendering:crispEdges}
.fl.sel span{background:var(--navy);color:#fff;outline:1px dotted #ff0}
.grid{width:100%;border-collapse:collapse;font-size:12.5px}
.grid th{background:var(--face);text-align:left;padding:3px 8px;font-weight:400;border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi)}
.grid td{padding:6px 8px;border-bottom:1px solid #ddd;vertical-align:top}
fieldset{margin:10px;padding:6px 12px 10px;border:2px groove #fff;min-width:0}
legend{padding:0 4px}
.lg{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:12.5px}
.mail{padding:10px}
.mail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;margin-bottom:8px}
.mail dt{text-align:right}
.mail dd{padding:3px 6px;min-height:24px;overflow-wrap:anywhere}
.mb{padding:10px 12px;min-height:110px;margin-bottom:12px;font:20px/1.2 var(--mono);white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .b3{flex:1 1 130px}
.bin{padding:6px}
.bin .fl{cursor:default}
.binb{display:flex;gap:8px;flex-wrap:wrap;padding:8px;border-top:1px solid #fff;background:var(--face)}
.dlg{width:min(340px,calc(100% - 16px))}
.dlg .wbody{display:flex;gap:14px;padding:16px;align-items:flex-start;background:var(--face);overflow:visible}
.dlg .wbody svg{width:36px;height:36px;flex:none}
.dlg .wbody p{line-height:1.4}
.dlg .dok{display:flex;justify-content:center;padding:4px 0 8px}
.dlg .dok .b3{min-width:84px}

/* taskbar */
#taskbar{position:fixed;left:0;right:0;bottom:0;z-index:5000;height:calc(var(--tb) + env(safe-area-inset-bottom));padding:4px 4px calc(4px + env(safe-area-inset-bottom));display:flex;align-items:stretch;gap:4px;border-top:2px solid var(--hi);background:var(--face);box-shadow:0 -1px 0 var(--face)}
#startb{display:flex;align-items:center;gap:6px;padding:0 10px;font:700 14px var(--px);min-width:70px;border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--lo);background:var(--face)}
#startb svg{width:20px;height:20px;shape-rendering:crispEdges}
#startb[aria-expanded=true]{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--lo);background:repeating-conic-gradient(#fff 0 25%,var(--face) 0 50%) 0 0/2px 2px}
.sep{flex:none;width:2px;border-left:1px solid var(--lo);border-right:1px solid var(--hi);margin:0 1px}
#tasks{flex:1;min-width:0;display:flex;gap:4px}
.tbtn{flex:0 1 160px;min-width:34px;display:flex;align-items:center;gap:6px;padding:0 8px;text-align:left;overflow:hidden;border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--lo);background:var(--face);font-size:12px}
.tbtn svg{width:16px;height:16px;flex:none;shape-rendering:crispEdges}
.tbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn.on{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--lo);background:repeating-conic-gradient(#fff 0 25%,var(--face) 0 50%) 0 0/2px 2px;font-weight:700}
#tray{flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);font-size:12px}
#tray svg{width:16px;height:16px;shape-rendering:crispEdges}
#start{position:fixed;left:4px;bottom:calc(var(--tb) + env(safe-area-inset-bottom));z-index:5001;display:flex;width:min(250px,calc(100% - 8px));padding:3px;border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--lo),2px 2px 0 rgba(0,0,0,.4);background:var(--face);max-height:calc(100% - var(--tb) - 8px);overflow:auto}
#start[hidden]{display:none}
#start .side{flex:none;width:26px;background:linear-gradient(0deg,var(--navy),#1084d0);display:flex;align-items:flex-end;justify-content:center;padding:6px 0}
#start .side b{writing-mode:vertical-rl;transform:rotate(180deg);font:700 19px var(--px);color:#fff;letter-spacing:.04em;white-space:nowrap}
#start .side b span{color:#c0c0c0}
#start ul{flex:1;list-style:none;padding:0;min-width:0}
#start button{width:100%;display:flex;align-items:center;gap:10px;min-height:38px;padding:3px 10px 3px 8px;border:0;background:none;text-align:left;font-size:13px}
#start button:hover,#start button:focus-visible{background:var(--navy);color:#fff;outline:none}
#start svg{width:26px;height:26px;shape-rendering:crispEdges;flex:none}
#start hr{border:0;border-top:1px solid var(--lo);border-bottom:1px solid var(--hi);margin:3px 2px}

/* boot + shutdown */
#boot,#off{position:fixed;inset:0;z-index:9000;background:#000;color:#bbb;font:22px/1.15 var(--mono);display:flex;flex-direction:column;justify-content:space-between;padding:clamp(14px,3vw,34px);transition:opacity .45s;cursor:pointer}
#boot[hidden],#off[hidden]{display:none}
#boot.out{opacity:0;pointer-events:none}
#boot .post{white-space:pre-wrap;min-height:6em}
#boot .logo{align-self:center;text-align:center;margin:auto 0}
#boot .logo svg{width:76px;height:76px;shape-rendering:crispEdges;margin-bottom:10px}
#boot .logo h1{font:700 clamp(2.2rem,9vw,3.6rem)/1 var(--px);color:#fff;letter-spacing:.04em}
#boot .logo h1 span{color:#1fb1d5}
#boot .logo p{color:#9a9a9a;margin-top:6px}
.lbar{width:min(340px,80vw);height:22px;margin:16px auto 0;padding:3px;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);background:#000}
.lbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#1fb1d5 0 10px,transparent 10px 13px)}
#boot small{align-self:center;color:#666;font-size:18px}
#off{align-items:center;justify-content:center;text-align:center;color:#ff9a1f;font-size:clamp(1.4rem,5vw,2.2rem)}

#print{display:none}
@media(max-width:699px){
 body{font-size:14px}
 .win{left:6px!important;right:6px;top:calc(6px + var(--o,0) * 8px)!important;width:auto!important;height:auto!important;bottom:6px;max-width:none}
 .win.dlg{left:50%!important;right:auto;top:30%!important;bottom:auto;width:min(340px,calc(100% - 16px))!important;transform:translateX(-50%)}
 .win.pop{animation:none}
 .tb{height:32px}.wb{width:30px;height:26px}.wb svg{width:12px;height:12px}
 .wb[data-a=max]{display:none}
 .ti b{font-size:15px}
 .tbtn span{display:none}.tbtn{flex:0 1 auto;min-width:42px;justify-content:center}.tbtn.on span{display:none}
 #tray .clk{font-size:12px}
 .sb{display:none}
 .nd{min-height:40px}.fl{min-height:44px}.files{grid-template-columns:1fr}
 .note{font-size:20px}.note p{font-size:20px}
 .ic{width:76px}
 #tray{padding:0 6px}
}
@media(prefers-reduced-motion:reduce){.win.pop{animation:none}.ty::after{animation:none}}
html.still *,html.still *::before,html.still *::after{animation:none!important;transition:none!important}
html.still .pb i{width:var(--w)!important}
html.still #boot{display:none}

@media print{
 @page{margin:14mm}
 html,body{height:auto;overflow:visible;background:#fff!important;color:#000}
 #desk,#taskbar,#start,#boot,#off{display:none!important}
 #print{display:block;font:11pt/1.4 Georgia,'Times New Roman',serif;-webkit-user-select:text;user-select:text}
 #print h1{font:700 24pt/1.1 Georgia,serif}
 #print h2{font:700 12pt Georgia,serif;border-bottom:1pt solid #000;margin:10pt 0 4pt;padding-bottom:1pt;text-transform:uppercase;letter-spacing:.05em}
 #print .t{font-size:12pt;margin-top:2pt}
 #print .c{margin-top:3pt}
 #print .j{break-inside:avoid;margin-bottom:5pt}
 #print .j b{font-size:11pt}
 #print ul{padding-left:14pt;list-style:disc}
 #print li{margin-bottom:1pt}
}
</style>
</head>

function boot(done){
 var post=$('#post'),bar=$('#lbar'),lines=['Desktop 95 BIOS v1.0  (c) nobody in particular','','Memory test ................ 640K OK','Detecting experience ....... '+jobs.length+' position'+(jobs.length===1?'':'s')+' found','Loading skills ............. '+skills.length+' module'+(skills.length===1?'':'s')+' OK','Verifying certificates ..... '+certs.length+' valid','Mounting education ......... OK'],i=0,p=0,fin=false;
 $('#bootn').textContent='Starting '+name+'…';bootEl.hidden=false;bootEl.classList.remove('out');post.textContent='';bar.style.width='0';
 function end(){if(fin)return;fin=true;clearInterval(t1);clearInterval(t2);bar.style.width='100%';bootEl.classList.add('out');setTimeout(function(){bootEl.hidden=true},470);document.removeEventListener('keydown',end);bootEl.removeEventListener('click',end);done()}
 var t1=setInterval(function(){if(i<lines.length)post.textContent+=lines[i++]+'\n'},260);
 var t2=setInterval(function(){p+=5+Math.random()*9;bar.style.width=Math.min(100,p)+'%';if(p>=100)end()},120);
 bootEl.addEventListener('click',end);document.addEventListener('keydown',end)}
function shutdown(){
 Object.keys(wins).forEach(function(k){if(wins[k].open)close(k)});
 offEl.innerHTML='<div>It’s now safe to hire<br><b>'+esc(name)+'</b>.<br><small style="font-size:.55em;color:#8a5a14">(click or tap to restart)</small></div>';offEl.hidden=false;
 function wake(){offEl.hidden=true;offEl.removeEventListener('click',wake);document.removeEventListener('keydown',wake);start()}
 setTimeout(function(){offEl.addEventListener('click',wake);document.addEventListener('keydown',wake)},300)}

/* ---------- clock ---------- */
function clock(){$('#clk').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}clock();setInterval(clock,10000);

/* ---------- print copy ---------- */
$('#print').innerHTML='<h1>'+esc(name)+'</h1>'+(title?'<p class="t">'+esc(title)+'</p>':'')+'<p class="c">'+[email,phone].filter(Boolean).map(esc).join(' · ')+'</p>'+(sum?'<p style="margin-top:6pt">'+esc(sum)+'</p>':'')+
 (jobs.length?'<h2>Experience</h2>'+jobs.map(function(j){return '<div class="j"><b>'+esc(j.role||'')+'</b><br>'+esc([j.co,j.loc,j.dates].filter(Boolean).join(' · '))+'<br>'+esc(j.text||'')+'</div>'}).join(''):'')+
 (skills.length?'<h2>Skills</h2><ul>'+skills.map(function(s){return '<li>'+esc(s[0])+' — '+lw[lvl(s[1])]+'</li>'}).join('')+'</ul>':'')+
 (certs.length?'<h2>Certifications</h2><ul>'+certs.map(function(c){return '<li>'+esc(c)+'</li>'}).join('')+'</ul>':'')+
 (edu.length?'<h2>Education</h2><ul>'+edu.map(function(e){return '<li>'+esc(e[0]||'')+', '+esc(e[2]||'')+' ('+esc(e[1]||'')+')</li>'}).join('')+'</ul>':'')+
 (langs.length?'<h2>Languages</h2><ul>'+langs.map(function(l){return '<li>'+esc(l[0]||'')+' — '+esc(l[1]||'')+'</li>'}).join('')+'</ul>':'');

/* ---------- start-up ---------- */
function arrange(){
 var ds=deskSize();applyMob();
 if(mob()){opened=0;open('experience');open('about');return}
 var ids=['about','experience','skills','certs','education','contact'],left=104,gap=8,cols=ds.w>1100?3:2,rows=Math.ceil(ids.length/cols);
 if(ds.w<800){ids=['about','experience','contact'];cols=2;rows=2}
 var cw=Math.floor((ds.w-left-gap*(cols+1)+gap)/cols),ch=Math.floor((ds.h-gap*(rows+1)+gap)/rows);
 ids.forEach(function(id,k){var c=k%cols,r=Math.floor(k/cols);open(id,{x:left+gap+c*(cw+gap),y:gap+r*(ch+gap),w:cw,h:ch})});focus('about')}
function start(){
 var go=function(){if(still)arrange();else{applyMob();if(mob()){open('about')}else{open('about',{x:130,y:30,w:520,h:340});open('experience',{x:210,y:140,w:520,h:400});focus('about')}}};
 if(still){go()}else boot(go)}
buildStart();applyMob();
addEventListener('resize',function(){applyMob();Object.keys(wins).forEach(function(k){var w=wins[k];if(!w.open||mob())return;var ds=deskSize(),el=w.el;if(el.offsetLeft>ds.w-60)el.style.left=Math.max(0,ds.w-el.offsetWidth-8)+'px';if(el.offsetTop>ds.h-28)el.style.top=Math.max(0,ds.h-el.offsetHeight-8)+'px'})});
start();
})();
</script>
</body>
</html>
