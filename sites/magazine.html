var D=DATA||{},name=String(D.name||'Your Name').trim(),title=D.title||'',sum=D.summary||'';
var jobs=arr(D.jobs).filter(Boolean),skills=arr(D.skills).filter(Boolean),certs=arr(D.certs).filter(Boolean),edu=arr(D.edu).filter(Boolean),langs=arr(D.langs).filter(Boolean);
var email=D.email?String(D.email).trim():'',phone=D.phone?String(D.phone).trim():'',tel=phone.replace(/[^0-9+]/g,'');
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var still=RM||/[?&]static(\b|=)/.test(location.search);
root.classList.add('js');if(still)root.classList.add('still');
var words=name.split(/\s+/).filter(Boolean);
var initials=words.slice(0,2).map(function(w){return w[0].toUpperCase()}).join('')||'CV';
var pad=function(n){return (n<10?'0':'')+n};

/* ---------- head ---------- */
document.title=name+' — Cover Story';
var desc=(title?title+'. ':'')+(sum?sum.slice(0,150):'');
function meta(sel,v){var m=$(sel);if(m)m.setAttribute('content',v)}
meta('meta[name=description]',desc);meta('meta[property="og:title"]',document.title);meta('meta[property="og:description"]',desc);meta('meta[name="twitter:title"]',document.title);meta('meta[name="twitter:description"]',desc);
$('#fname').textContent=name;
(function(){var f=$('link[rel=icon]');if(f)f.href='data:image/svg+xml,'+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='#d7261e'/><text x='32' y='46' font-family='Georgia,serif' font-style='italic' font-weight='bold' font-size='"+(initials.length>1?38:44)+"' text-anchor='middle' fill='#f3ede2'>"+esc(initials)+"</text></svg>")})();

/* ---------- derived ---------- */
var yrs=[];jobs.forEach(function(j){(String(j.dates||'').match(/\b(19|20)\d{2}\b/g)||[]).forEach(function(y){yrs.push(+y)})});
var years=yrs.length?new Date().getFullYear()-Math.min.apply(null,yrs):0;
var lw=['','Foundational','Working','Proficient','Advanced','Expert'];
function lvl(s){return Math.max(1,Math.min(5,Math.round(Number(s[1])||3)))}
var ranked=skills.map(function(s,i){return {n:s[0],l:lvl(s),i:i}}).sort(function(a,b){return b.l-a.l||a.i-b.i});
var sents=(sum.match(/[^.!?]+[.!?]+(\s|$)/g)||[sum]).map(function(s){return s.trim()}).filter(Boolean);
var now=new Date(),issueDate=now.toLocaleDateString('en-US',{month:'long',year:'numeric'}).toUpperCase();
var issueNo=years||jobs.length||1;
var longest=words.reduce(function(m,w){return Math.max(m,w.length)},1);


function barcode(){var seed=0,s=name+issueDate;for(var i=0;i<s.length;i++)seed=(seed*31+s.charCodeAt(i))>>>0;
 var x=4,r='',digits='';function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
 for(var k=0;k<46;k++){var w=1+Math.floor(rnd()*3);if(k%2===0)r+='<rect x="'+x+'" y="0" width="'+w+'" height="'+(k<3||k>42?46:40)+'"/>';x+=w+(k%2?0:1)}
 for(var d=0;d<12;d++)digits+=Math.floor(rnd()*10);
 return '<div class="bc" aria-hidden="true"><svg viewBox="0 0 '+(x+4)+' 46" preserveAspectRatio="none" fill="#000">'+r+'</svg><span>'+digits.slice(0,1)+' '+digits.slice(1,7)+' '+digits.slice(7)+'</span></div>'}

/* ---------- cover lines ---------- */
var left=[],right=[];
ranked.slice(0,3).forEach(function(s,i){left.push('<div class="ln'+(i===0?' red':'')+' cv" style="--d:'+(.9+i*.15)+'s"><span class="kick">'+(i===0?'Exclusive':'Mastery')+'</span><h3>'+esc(s.n)+'</h3><p>Rated '+s.l+'/5 — '+lw[s.l]+' level.</p></div>')});
if(years>=1)right.push('<div class="ln red cv" style="--d:1s"><span class="kick">Career</span><h3>'+years+' years on the front line</h3><p>'+jobs.length+' roles, one relentless story.</p></div>');
certs.slice(0,2).forEach(function(c,i){right.push('<div class="ln cv" style="--d:'+(1.15+i*.15)+'s"><span class="kick">Credentials</span><h3>'+esc(String(c).replace(/\s*\([^)]*\)\s*$/,''))+'</h3><p>Certified — and then some.</p></div>')});
if(!right.length&&edu.length)right.push('<div class="ln cv"><span class="kick">Education</span><h3>'+esc(edu[0][0]||'')+'</h3><p>'+esc(edu[0][2]||'')+'</p></div>');

/* ---------- render ---------- */
var secs=[];secs.push(['feature','Feature']);if(jobs.length)secs.push(['stories','Stories']);if(skills.length)secs.push(['power','Ranking']);if(certs.length||edu.length||langs.length)secs.push(['index','Index']);secs.push(['contact','Contact']);
$('#navlist').innerHTML=secs.map(function(s){return '<li><a href="#'+s[0]+'">'+s[1]+'</a></li>'}).join('');
var h=function(k,pg){return '<div class="sect-h rv"><span class="kick">'+k+'</span><span>'+pg+'</span></div>'};
var out='<header class="cover" id="top"><div class="wrap">'+
 '<div class="strip cv"><span>Issue Nº '+pad(issueNo)+'</span><span>The Résumé Issue</span><span>'+issueDate+'</span></div>'+
 '<div class="mast" aria-hidden="true">'+'COVER STORY'.split('').map(function(c,i){return '<span style="--i:'+i+'">'+(c===' '?'&nbsp;':c)+'</span>'}).join('')+'</div>'+
 '<p class="tag cv" style="--d:.4s">The magazine of people who get things done</p>'+
 '<div class="stage"><div class="arch" aria-hidden="true"><i>'+esc(initials)+'</i></div>'+
 '<div class="cl l">'+left.join('')+'</div>'+
 '<h1 class="star cv" style="--n:'+longest+';--d:.5s">'+words.map(function(w){return '<span>'+esc(w)+'</span>'}).join('')+(title?'<span class="sub">'+esc(title)+'</span>':'')+'</h1>'+
 '<div class="cl r">'+right.join('')+'</div></div>'+
 '<div class="foot-c cv" style="--d:1.4s">'+barcode()+'<a class="scroll" href="#feature">Read the feature<i></i></a><div class="price"><small>Cover price</small>Priceless</div></div>'+
 '</div></header>';
out+='<section id="feature" aria-labelledby="h-feature"><div class="wrap">'+h('The Feature','p. 42')+
 '<h2 class="headline rv" id="h-feature">'+(title?esc(title.split(/\s+[—–-]\s+/)[0]):esc(name))+(title&&title.split(/\s+[—–-]\s+/)[1]?'<br><em>'+esc(title.split(/\s+[—–-]\s+/).slice(1).join(' — '))+'</em>':'')+'</h2>'+
 '<p class="by rv">Words by <b>The Editors</b> · Photography by <b>Your Imagination</b></p>'+
 (sum?'<div class="spread"><aside class="rv"><blockquote class="pull">'+esc(sents[0])+'<cite>— '+esc(name)+'</cite></blockquote></aside>'+
 '<div class="rv" style="--d:.1s"><p class="stand">'+(sents.length>1?esc(sents[sents.length-1]):esc(title))+'</p><div class="body"><p class="dc">'+esc(sum)+'</p></div>'+
 (years>=1||jobs.length||certs.length?'<div class="fig">'+(years>=1?'<div><b>'+years+'+</b><span>Years</span></div>':'')+(jobs.length?'<div><b>'+jobs.length+'</b><span>Roles</span></div>':'')+(certs.length?'<div><b>'+certs.length+'</b><span>Credentials</span></div>':'')+'</div>':'')+'</div></div>':'')+
 '</div></section>';
if(jobs.length)out+='<section id="stories" aria-labelledby="h-stories"><div class="wrap">'+h('Career Stories','p. 58')+'<h2 id="h-stories" class="kick" style="margin-bottom:6px">'+jobs.length+' features, in order of appearance</h2><ol>'+jobs.map(function(j,i){return '<li class="art rv"><div class="num" aria-hidden="true">'+pad(i+1)+'</div><div><p class="meta">'+esc(j.dates||'')+(j.loc?' · '+esc(j.loc):'')+'</p><h3>'+esc(j.role||'')+'</h3>'+(j.co?'<p class="deck">at <b>'+esc(j.co)+'</b></p>':'')+(j.text?'<p class="tx dc">'+esc(j.text)+'</p>':'')+'</div></li>'}).join('')+'</ol></div></section>';
if(skills.length)out+='<section id="power" aria-labelledby="h-power"><div class="wrap">'+h('The Power Ranking','p. 74')+'<h2 class="headline rv" id="h-power" style="font-size:clamp(2.2rem,6vw,4.6rem)">Top '+ranked.length+' <em>strengths</em></h2><ol class="pow" style="margin-top:28px">'+ranked.map(function(s,i){var d='';for(var k=0;k<5;k++)d+='<i style="--n:'+k+'"'+(k<s.l?' class="f"':'')+'></i>';return '<li class="pw rv" style="--d:'+(i%3*.06)+'s"><span class="r">'+(i+1)+'</span><div><h3>'+esc(s.n)+'</h3><small>'+lw[s.l]+'</small></div><div class="dots" role="img" aria-label="'+s.l+' out of 5">'+d+'</div></li>'}).join('')+'</ol></div></section>';
if(certs.length||edu.length||langs.length){out+='<section id="index" aria-labelledby="h-index"><div class="wrap">'+h('The Index','p. 90')+'<h2 class="kick" id="h-index" style="margin-bottom:24px">Contents, credentials &amp; the fine print</h2><div class="cols">';
 if(certs.length)out+='<div class="rv"><h3 class="kick" style="margin-bottom:6px">Certifications</h3><ul class="toc">'+certs.map(function(c,i){return '<li><b>'+pad(i+1)+'</b><span>'+esc(c)+'</span><em>p. '+(90+i*3)+'</em></li>'}).join('')+'</ul></div>';
 out+='<div>';
 if(edu.length)out+='<div class="rv" id="education"><h3 class="kick" style="margin-bottom:10px">Education</h3>'+edu.map(function(e){return '<div class="box"><h3>'+esc(e[0]||'')+'</h3>'+(e[2]?'<p>'+esc(e[2])+'</p>':'')+(e[1]?'<p class="d">'+esc(e[1])+'</p>':'')+'</div>'}).join('')+'</div>';
 if(langs.length)out+='<div class="rv" id="languages" style="margin-top:26px"><h3 class="kick" style="margin-bottom:6px">Also published in</h3>'+langs.map(function(l){return '<div class="lang"><b>'+esc(l[0]||'')+'</b><span>'+esc(l[1]||'')+'</span></div>'}).join('')+'</div>';
 out+='</div></div></div></section>'}
out+='<footer class="back" id="contact"><div class="wrap"><span class="kick">Back cover · Subscribe</span><h2>Next issue: <em>you</em>.</h2>'+
 (email?'<a class="big" href="mailto:'+esc(email)+'">'+esc(email)+'</a>':'')+(phone?'<p class="ph"><a href="tel:'+esc(tel)+'">'+esc(phone)+'</a></p>':'')+
 '<div class="acts">'+(email?'<a class="mail" href="mailto:'+esc(email)+'">Email me</a>':'')+'<button type="button" class="pbtn" id="pdf">Download PDF</button></div>'+
 '<div class="fine"><span>© '+now.getFullYear()+' '+esc(name)+' · All rights reserved</span><a href="#top">Back to cover ↑</a></div></div></footer>';
$('#app').innerHTML=out;
[$('#pdf'),$('#pdf0')].forEach(function(b){if(b)b.addEventListener('click',function(){window.print()})});

/* ---------- reveal ---------- */
var targets=$$('.rv');
if(still||!('IntersectionObserver' in window))targets.forEach(function(t){t.classList.add('in')});
else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -5% 0px'});targets.forEach(function(t){io.observe(t)})}

/* ---------- scroll ---------- */
var prog=$('#prog'),folio=$('#folio'),links=$$('#navlist a'),tick=false;
function upd(){var hh=root.scrollHeight-innerHeight,y=scrollY;prog.style.transform='scaleX('+(hh>0?Math.min(1,y/hh):0)+')';folio.classList.toggle('show',y>innerHeight*.7||still);tick=false}
addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});addEventListener('resize',upd);upd();
if('IntersectionObserver' in window){var spy=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)links.forEach(function(a){var on=a.getAttribute('href')==='#'+e.target.id;a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current')})})},{rootMargin:'-35% 0px -60% 0px'});secs.forEach(function(s){var el=document.getElementById(s[0]);if(el)spy.observe(el)})}
})();
</script>
</body>
</html>
