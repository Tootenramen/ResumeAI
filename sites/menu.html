if(sum)out+=sec('starters','Starters','The chef’s welcome','<p class="welcome rv">'+esc(sum)+'</p><p class="sig rv"><b>'+esc(name)+'</b><br>'+(title?esc(title.split(/\s+[—–-]\s+/)[0]):'Chef de cuisine')+'</p>');

if(jobs.length)out+=sec('mains','Mains','Dishes from the line','<div class="dishes">'+jobs.map(function(j,i){return '<article class="dish rv" style="--d:.03s"><div class="dh"><h3>'+esc(j.role||'Untitled')+'</h3><span class="ld" aria-hidden="true"></span><span class="pr" title="Time on the menu">'+esc(tenure(j.dates))+'</span></div>'+
 '<p class="dm">'+(j.co?'<i>'+esc(j.co)+'</i>':'')+(j.dates?(j.co?' · ':'')+esc(j.dates):'')+(j.loc?' · '+esc(j.loc):'')+'</p>'+(j.text?'<p class="dd">'+esc(j.text)+'</p>':'')+'</article>'}).join('')+'</div>');

if(skills.length)out+=sec('sides','Sides','Served alongside every course','<ul style="max-width:560px;margin:0 auto">'+skills.map(function(s,i){var n=lvl(s[1]);return '<li class="row rv" style="--d:'+(i%2*.06)+'s"><span class="nm">'+esc(s[0])+'</span><span class="ld" aria-hidden="true"></span>'+dots(n)+'</li>'}).join('')+'</ul>');

if(certs.length)out+=sec('wine','Wine pairings','Vintages &amp; accreditations','<ul class="two wine">'+certs.map(function(c,i){c=String(c);var m=c.match(/^(.*?)\s*\(([^)]*)\)\s*$/),nm=c,v='';if(m){nm=m[1];v=/^\d{4}$/.test(m[2])?m[2]:'('+m[2]+')'}return '<li class="row rv" style="--d:'+(i%2*.06)+'s"><span class="nm">'+esc(nm)+'</span>'+(v?'<span class="ld" aria-hidden="true"></span><span class="pr">'+esc(v)+'</span>':'')+'</li>'}).join('')+'</ul>');

if(edu.length||langs.length)out+=sec('dessert','Dessert','To finish','<div>'+edu.map(function(e,i){return '<div class="edu rv" style="--d:.03s"><div class="dh"><h3>'+esc(e[0]||'')+'</h3>'+(e[1]?'<span class="ld" aria-hidden="true"></span><span class="pr">'+esc(e[1])+'</span>':'')+'</div>'+(e[2]?'<p class="dm"><i>'+esc(e[2])+'</i></p>':'')+'</div>'}).join('')+'</div>'+
 (langs.length?'<p class="digestif rv"><b>Digestif · Served in</b>'+langs.map(function(l){return '<span>'+esc(l[0]||'')+(l[1]?' <small style="display:inline;font-size:.9em">('+esc(l[1])+')</small>':'')+'</span>'}).join('')+'</p>':''));

out+=sec('reservations','Reservations','Tables are held for those who reach out','<div class="res rv"><p class="lead">Currently seating new engagements. Write or call to reserve.</p>'+
 (email?'<a class="big" href="mailto:'+esc(email)+'">'+esc(email)+'</a>':'')+(phone?'<a class="big" href="tel:'+esc(tel)+'">'+esc(phone)+'</a>':'')+
 '<div class="acts">'+(email?'<a class="btn p" href="mailto:'+esc(email)+'">Reserve a table</a>':'')+'<button type="button" class="btn" id="pdf">Download PDF</button></div></div>'+
 '<p class="foot rv">Gratuity not included · © '+new Date().getFullYear()+' '+esc(name)+' · <a href="#top">Back to the top</a></p>');
out+='</div></main>';
$('#app').innerHTML=out;
var pdf=$('#pdf');if(pdf)pdf.addEventListener('click',function(){window.print()});

/* reveal */
var targets=$$('.rv');
if(still||!('IntersectionObserver' in window))targets.forEach(function(t){t.classList.add('in')});
else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.1,rootMargin:'0px 0px -4% 0px'});targets.forEach(function(t){io.observe(t)})}
})();
</script>
</body>
</html>
