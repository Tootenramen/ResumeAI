meta('meta[name=description]',desc);meta('meta[property="og:title"]',document.title);meta('meta[property="og:description"]',desc);meta('meta[name="twitter:title"]',document.title);meta('meta[name="twitter:description"]',desc);
$('#av').textContent=initials;$('#wn').textContent=name;$('#blurb').textContent='A hiring conversation with '+first+', answered in advance. Sit back, or ask the questions yourself.';
var now=new Date(),clock=now.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
$('#clock').textContent=clock.replace(/\s?[AP]M/i,'');
var IC={ok:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',phone:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',mail:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',dl:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>'};
function svgEl(html,cls){var s=el('span',cls||'');s.innerHTML=html;return s.firstChild}

/* years */
var yrs=[];jobs.forEach(function(j){(S(j.dates).match(/\b(19|20)\d{2}\b/g)||[]).forEach(function(y){yrs.push(+y)})});
var years=yrs.length?now.getFullYear()-Math.min.apply(null,yrs):0;
var lw=['','Foundational','Working','Proficient','Advanced','Expert'];

/* ---------- conversation script ---------- */
function T(t){return {k:'t',t:t}}
var steps=[];
steps.push({q:'Tell me about yourself',a:function(){var m=[T("Hi, I'm "+name+(title?'. '+title+'.':'.'))];if(sum)m.push(T(sum));return m}});
if(jobs.length)steps.push({q:'Where have you worked?',a:function(){
 var m=[T('Happy to walk you through it'+(years>=1?': '+jobs.length+' role'+(jobs.length>1?'s':'')+' over '+years+'+ years. Newest first.':'. Newest first.'))];
 jobs.forEach(function(j){m.push({k:'job',j:j})});return m}});
if(skills.length)steps.push({q:'What are you good at?',a:function(){return [T('Here is where I spend my time, rated honestly:'),{k:'skills'}]}});
if(certs.length)steps.push({q:'Any certifications?',a:function(){return [T('A few I am proud of:'),{k:'certs'}]}});
if(edu.length)steps.push({q:"What's your education?",a:function(){return [{k:'edu'}]}});
if(langs.length)steps.push({q:'Do you speak other languages?',a:function(){return [{k:'langs'}]}});
steps.push({q:'Can we talk?',a:function(){return [T('Absolutely, I would love to.'+(email||phone?' Here is the quickest way to reach me:':'')),{k:'contact'},T('Talk soon!')]}});

/* ---------- renderers ---------- */
function body(m){
 var b=el('div','b');
 if(m.k==='t'){b.textContent=m.t;return b}
 if(m.k==='job'){var j=m.j;b.className='b rich';if(S(j.dates))b.appendChild(el('span','d',S(j.dates)));b.appendChild(el('strong',null,S(j.role)));var mm=[S(j.co),S(j.loc)].filter(Boolean).join(' · ');if(mm)b.appendChild(el('span','m',mm));if(S(j.text))b.appendChild(el('span','x',S(j.text)));return b}
 if(m.k==='skills'){b.className='b rich';var g=el('div','lvl');skills.forEach(function(s){var lv=Math.max(1,Math.min(5,Math.round(+s[1]||3))),r=el('div'),d=el('span','dots');d.setAttribute('role','img');d.setAttribute('aria-label',lw[lv]+', '+lv+' out of 5');for(var i=0;i<5;i++)d.appendChild(el('i',i<lv?'on':''));r.appendChild(el('span',null,S(s[0])));r.appendChild(d);g.appendChild(r)});b.appendChild(g);return b}
 if(m.k==='certs'){b.className='b rich';var l=el('div','lst');certs.forEach(function(c){var r=el('div');r.appendChild(svgEl(IC.ok));r.appendChild(el('span',null,c));l.appendChild(r)});b.appendChild(l);return b}
 if(m.k==='edu'){b.className='b rich';b.appendChild(el('strong',null,'Education'));var l2=el('div','lst');l2.style.marginTop='6px';l2.style.gridTemplateColumns='1fr';edu.forEach(function(e){var r=el('div');r.style.gridTemplateColumns='1fr';var s=el('span',null,S(e[0]));s.style.fontWeight='600';r.appendChild(s);var sm=el('small',null,[S(e[2]),S(e[1])].filter(Boolean).join(' · '));r.lastChild.appendChild(sm);l2.appendChild(r)});b.appendChild(l2);return b}
 if(m.k==='langs'){b.className='b rich';b.appendChild(el('strong',null,'I speak'));var l3=el('div','lvl');l3.style.marginTop='6px';langs.forEach(function(x){var r=el('div');r.appendChild(el('span',null,S(x[0])));var sm=el('small',null,S(x[1]));sm.style.opacity='.65';sm.style.fontSize='12.5px';r.appendChild(sm);l3.appendChild(r)});b.appendChild(l3);return b}
 if(m.k==='contact'){b.className='b rich';var a=el('div','acts');
  if(phone){var p=el('a','act');p.href='tel:'+tel;p.appendChild(svgEl(IC.phone));p.appendChild(document.createTextNode('Call '+phone));a.appendChild(p)}
  if(email){var e=el('a','act o');e.href='mailto:'+email.replace(/[\s<>"]/g,'');e.appendChild(svgEl(IC.mail));e.appendChild(document.createTextNode('Email '+first));a.appendChild(e)}
  var d=el('button','act o');d.type='button';d.appendChild(svgEl(IC.dl));d.appendChild(document.createTextNode('Download PDF'));d.addEventListener('click',function(){window.print()});a.appendChild(d);b.appendChild(a);return b}
 return b}
function lenOf(m){return m.k==='t'?m.t.length:m.k==='job'?S(m.j.text).length+40:m.k==='skills'?90:m.k==='certs'?110:60}

/* ---------- engine ---------- */
var thread=$('#thread'),chipsEl=$('#chips'),ft=$('#ft'),snd=$('#snd'),ws=$('#ws');
var gen=0,skipAll=false,auto=true,busy=0,asked=[],chain=Promise.resolve(),lastRow=null,lastSide='',rcpt=null,typEl=null;
var subtitle=title;
ws.textContent=subtitle;
function sleep(ms,g){if(INSTANT||skipAll)return Promise.resolve();return new Promise(function(r){setTimeout(r,ms)}).then(function(){if(g!==gen)throw 'abort'})}
function near(){return thread.scrollHeight-thread.scrollTop-thread.clientHeight<170}
function toEnd(force){if(force||near())thread.scrollTo({top:thread.scrollHeight,behavior:INSTANT||skipAll?'auto':'smooth'})}
function add(side,m,force){
 var stick=near();
 var row=el('div','row '+side+(lastSide===side?'':' gap'));var b=body(m);b.classList.add('tail');
 if(lastRow&&lastSide===side){var pb=lastRow.firstChild;pb.classList.remove('tail')}
 row.appendChild(b);thread.appendChild(row);lastRow=row;lastSide=side;
 if(!INSTANT&&!skipAll)row.classList.add('anim');
 if(side==='me'){setReceipt('Delivered')}
 if(force||stick)toEnd(true)}
function setReceipt(t){if(rcpt)rcpt.remove();rcpt=el('div','rcpt');var b=el('b',null,t);rcpt.appendChild(b);thread.appendChild(rcpt)}
function readReceipt(){if(rcpt){rcpt.textContent='';rcpt.appendChild(el('b',null,'Read '));rcpt.appendChild(document.createTextNode(clock))}}
function showTyping(){var stick=near();typEl=el('div','row them'+(lastSide==='them'?'':' gap'));var t=el('div','typ');t.setAttribute('aria-label','typing');t.appendChild(el('i'));t.appendChild(el('i'));t.appendChild(el('i'));typEl.appendChild(t);if(!INSTANT&&!skipAll)typEl.classList.add('anim');thread.appendChild(typEl);ws.textContent='typing…';if(stick)toEnd(true)}
function hideTyping(){if(typEl){typEl.remove();typEl=null}ws.textContent=subtitle}
async function them(m,g){
 if(!INSTANT&&!skipAll){showTyping();await sleep(Math.min(1250,450+lenOf(m)*5),g);hideTyping()}
 add('them',m);await sleep(260,g)}
async function me(text,manual,g){
 if(manual&&!INSTANT&&!skipAll){ft.textContent=text;snd.classList.add('on');await sleep(520,g);ft.textContent='';snd.classList.remove('on')}
 else await sleep(420,g);
 add('me',{k:'t',t:text},manual);await sleep(520,g);readReceipt()}
async function runStep(i,manual,g){var s=steps[i];await me(s.q,manual,g);var a=s.a();for(var k=0;k<a.length;k++)await them(a[k],g)}
function chipsRender(){
 chipsEl.textContent='';
 var rem=steps.map(function(s,i){return i}).filter(function(i){return !asked[i]});
 rem.forEach(function(i){var b=el('button','chip q',steps[i].q);b.type='button';b.addEventListener('click',function(){ask(i)});chipsEl.appendChild(b)});
 if(rem.length>1||(rem.length&&busy)){var sa=el('button','chip g','Show everything');sa.type='button';sa.addEventListener('click',showAll);chipsEl.appendChild(sa)}
 if(!rem.length&&!busy){
  if(phone){var c=el('a','chip','Call');c.href='tel:'+tel;chipsEl.appendChild(c)}
  if(email){var e=el('a','chip','Email');e.href='mailto:'+email.replace(/[\s<>"]/g,'');chipsEl.appendChild(e)}
  var p=el('button','chip','Download PDF');p.type='button';p.addEventListener('click',function(){window.print()});chipsEl.appendChild(p);
  var r=el('button','chip g','Replay');r.type='button';r.addEventListener('click',start);chipsEl.appendChild(r)}
}
function enqueue(fn,g){busy++;chipsRender();chain=chain.then(function(){return fn()}).catch(function(e){if(e!=='abort')console.error(e)}).then(function(){if(g!==gen)return;busy--;if(busy<=0){busy=0;skipAll=false;hideTyping();chipsRender();toEnd(true)}else chipsRender()})}
function ask(i){if(asked[i])return;asked[i]=true;auto=false;var g=gen;enqueue(function(){return runStep(i,true,g)},g)}
function showAll(){auto=false;skipAll=true;var g=gen;steps.forEach(function(s,i){if(asked[i])return;asked[i]=true;enqueue(function(){return runStep(i,false,g)},g)});chipsRender()}
function start(){
 gen++;var g=gen;skipAll=false;auto=true;busy=0;asked=[];chain=Promise.resolve();lastRow=null;lastSide='';rcpt=null;typEl=null;ft.textContent='';snd.classList.remove('on');
 thread.textContent='';ws.textContent=subtitle;
 var st=el('div','stamp');st.appendChild(el('b',null,'iMessage'));st.appendChild(document.createTextNode(' · Today '+clock));thread.appendChild(st);
 var intro=[['me',"Hi "+first+", thanks for sending your resume over."],['them',"Thanks for taking a look! Ask me anything."]];
 enqueue(async function(){
  await sleep(INSTANT?0:700,g);
  await me(intro[0][1],false,g);await them(T(intro[1][1]),g);
  for(var i=0;i<steps.length;i++){if(!auto||g!==gen)break;if(asked[i])continue;asked[i]=true;chipsRender();await runStep(i,false,g);await sleep(500,g)}
 },g);
 if(INSTANT)thread.scrollTop=0}
$('#replay').addEventListener('click',start);
[$('#pdf1'),$('#pdf2')].forEach(function(b){b.addEventListener('click',function(){window.print()})});

/* side captions reveal */
var rv=$$('.rv');
if(INSTANT||!('IntersectionObserver' in window))rv.forEach(function(t){t.classList.add('in')});
else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});rv.forEach(function(t){io.observe(t)})}

/* ---------- print version ---------- */
(function(){
 var P=$('#print');
 function add(tag,txt,cls,parent){var e=el(tag,cls,txt);(parent||P).appendChild(e);return e}
 add('h1',name);if(title)add('div',title,'t');
 var c=[email,phone].filter(Boolean).join('  ·  ');if(c)add('div',c,'c');
 if(sum)add('p',sum);
 if(jobs.length){add('h2','Experience');jobs.forEach(function(j){var d=add('div',null,'it');var p=add('p',null,null,d);p.appendChild(el('b',null,S(j.role)));var m=[S(j.co),S(j.loc),S(j.dates)].filter(Boolean).join(' · ');if(m)add('p',m,'m',d);if(S(j.text))add('p',S(j.text),null,d)})}
 if(skills.length){add('h2','Skills');var u=add('ul');skills.forEach(function(s){add('li',S(s[0])+' — '+Math.max(0,Math.min(5,Math.round(+s[1]||0)))+'/5',null,u)})}
 if(certs.length){add('h2','Certifications');var u2=add('ul');certs.forEach(function(x){add('li',x,null,u2)})}
 if(edu.length){add('h2','Education');edu.forEach(function(e){var d=add('div',null,'it');var p=add('p',null,null,d);p.appendChild(el('b',null,S(e[0])));var m=[S(e[2]),S(e[1])].filter(Boolean).join(' · ');if(m)add('p',m,'m',d)})}
 if(langs.length){add('h2','Languages');var u3=add('ul');langs.forEach(function(l){add('li',S(l[0])+(S(l[1])?' — '+S(l[1]):''),null,u3)})}
})();

start();
})();
</script>
</body>
</html>
