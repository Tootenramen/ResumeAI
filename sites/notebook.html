<style>
:root{--paper:#fbf8ef;--sheet:#fffdf6;--line:#bcd6ea;--margin:#e5575f;--ink:#26334d;--soft:#55607a;--red:#d6333b;--y:rgba(255,226,60,.9);--p:rgba(255,150,196,.8);--g:rgba(130,235,150,.85);--ml:clamp(22px,6vw,76px);--hand:'Caveat','Segoe Print','Bradley Hand','Comic Sans MS',cursive;--body:'Patrick Hand','Kalam','Segoe Print','Bradley Hand','Comic Sans MS',cursive;--lh:32px}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px;-webkit-text-size-adjust:100%}
body{background-color:var(--paper);background-image:radial-gradient(120% 90% at 50% 40%,transparent 60%,rgba(120,90,40,.12)),repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--line) 31px,var(--line) 32px);background-attachment:fixed,scroll;color:var(--ink);font:400 1.3rem/var(--lh) var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased;position:relative}
/* margin line + punched holes */
body::before{content:'';position:fixed;z-index:0;top:0;bottom:0;left:var(--ml);width:2px;background:var(--margin);box-shadow:5px 0 0 -0.5px rgba(229,87,95,.6);pointer-events:none}
body::after{content:'';position:fixed;z-index:0;top:0;bottom:0;left:calc(var(--ml) * .28);width:22px;pointer-events:none;background:radial-gradient(circle at 11px 16%,#a89c84 0 7px,transparent 8px),radial-gradient(circle at 11px 50%,#a89c84 0 7px,transparent 8px),radial-gradient(circle at 11px 84%,#a89c84 0 7px,transparent 8px);opacity:.55}
@media(max-width:560px){body::after{display:none}}
a{color:var(--ink)}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:3px dashed var(--red);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:8px;top:-60px;background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;z-index:300}.skip:focus{top:8px}
.wrap{position:relative;z-index:1;width:min(1040px,calc(100vw - var(--ml) - 40px));margin-left:max(calc(var(--ml) + 22px),calc((100vw - 1040px)/2 + 20px))}
main{position:relative;z-index:1}

/* doodle toolkit */
.doo{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;overflow:visible;flex:none}
.doo.red{stroke:var(--red)}.doo.gold{stroke:#b8860b}
.js .dr{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s ease-in-out var(--dd,.2s),fill .5s ease calc(var(--dd,.2s) + .9s)}
.js .in .dr{stroke-dashoffset:0}
.tape{position:absolute;top:-15px;left:50%;width:112px;height:30px;transform:translateX(-50%) rotate(var(--tr,-3deg));background:rgba(255,232,150,.78);box-shadow:0 1px 2px rgba(60,40,0,.18);clip-path:polygon(0 0,4% 20%,0 40%,4% 60%,0 80%,3% 100%,100% 100%,96% 80%,100% 60%,96% 40%,100% 20%,97% 0);z-index:3;pointer-events:none}
.tape.pk{background:rgba(255,170,205,.7)}.tape.bl{background:rgba(150,210,245,.7)}
.clip{position:absolute;top:-22px;right:36px;width:30px;height:70px;z-index:3;transform:rotate(8deg);pointer-events:none}
.clip path{stroke:#8d96a5;stroke-width:3.2}
.ring{position:absolute;pointer-events:none;mix-blend-mode:multiply;z-index:0;width:190px;height:190px;opacity:.9}
.ring path{fill:none;stroke:#8b5a2b;stroke-linecap:round}
.fd{transition:opacity .7s ease,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.js .fd.rv:not(.in){opacity:0;transform:translateY(14px)}

/* write-itself reveals */
.wr{display:block;width:fit-content;max-width:100%}
.js .wr{clip-path:inset(-20% 100% -25% -3%);transition:clip-path var(--wt,1.3s) steps(var(--st,26),end) var(--d,0s)}
.js .in.wr,.js .in .wr{clip-path:inset(-20% -3% -25% -3%)}
.js .wv{clip-path:inset(0 0 100% 0);transition:clip-path 1.7s steps(var(--st,9),end) var(--d,.25s)}
.js .in .wv,.js .in.wv{clip-path:inset(-6px -6px -10px -6px)}

/* highlighter */
mark.hl{color:inherit;padding:0 .14em;margin:0 -.14em;background-image:linear-gradient(100deg,transparent 0,var(--hc) 2.5%,var(--hc) 97%,transparent 100%);background-repeat:no-repeat;background-position:0 82%;background-size:100% 58%;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.c0{--hc:var(--y)}mark.c1{--hc:var(--p)}mark.c2{--hc:var(--g)}
.js mark.hl{background-size:0% 58%;transition:background-size .8s ease var(--hd,1.2s)}
.js .in mark.hl{background-size:100% 58%}

/* tabs */
.tabs{position:sticky;top:0;z-index:100;background:var(--paper);border-bottom:2px dashed rgba(38,51,77,.35)}
.tabs-in{display:flex;align-items:center;gap:6px 10px;padding:6px 0 6px calc(var(--ml) + 22px);padding-right:12px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tabs a,.tabs button{flex:none;font:700 1.2rem/1 var(--hand);color:var(--ink);text-decoration:none;padding:8px 12px 6px;border:2px solid var(--ink);border-radius:255px 14px 225px 14px/14px 225px 14px 255px;background:var(--tc,#fff);cursor:pointer;min-height:40px;display:inline-flex;align-items:center;transition:transform .2s}
.tabs a:nth-child(5n+1){--tc:#fff2a8;transform:rotate(-1.5deg)}.tabs a:nth-child(5n+2){--tc:#ffd0e3;transform:rotate(1deg)}.tabs a:nth-child(5n+3){--tc:#c9efd1;transform:rotate(-1deg)}.tabs a:nth-child(5n+4){--tc:#cfe6f9;transform:rotate(1.5deg)}.tabs a:nth-child(5n){--tc:#ffe0b8;transform:rotate(-.5deg)}
.tabs a:hover,.tabs button:hover{transform:translateY(-2px) rotate(0)}
.tabs button{margin-left:auto;background:var(--ink);color:#fff}

/* hero */
.hero{position:relative;padding:clamp(34px,6vw,70px) 0 clamp(30px,5vw,60px);display:grid;gap:34px 40px;grid-template-columns:1fr}
@media(min-width:960px){.hero{grid-template-columns:1.05fr 1fr;align-items:center}}
.belongs{font:700 1.7rem/1.2 var(--hand);color:var(--soft);transform:rotate(-2deg);transform-origin:left}
h1{font:700 clamp(3.4rem,11.5vw,7.4rem)/.95 var(--hand);color:var(--ink);letter-spacing:-.01em;overflow-wrap:anywhere;padding:.04em .06em .1em}
.sq{display:block;width:min(420px,78%);height:auto;margin:2px 0 6px -4px;stroke:var(--red);stroke-width:3.4}
.ttl{font:700 clamp(1.5rem,3.4vw,2.1rem)/1.25 var(--hand);margin-top:12px;max-width:26em}
.sticky{position:relative;background:linear-gradient(180deg,#fff58e,#ffee66);padding:32px 28px 30px;box-shadow:0 14px 18px -10px rgba(60,40,0,.35),0 1px 2px rgba(60,40,0,.2);transform:rotate(var(--r,2deg));max-width:36rem;font-size:1.3rem;line-height:1.5}
.sticky::after{content:'';position:absolute;right:0;bottom:0;width:30px;height:30px;background:linear-gradient(135deg,transparent 50%,rgba(120,90,0,.2) 50%)}
.sticky.pk{background:linear-gradient(180deg,#ffc2dc,#ffadd0)}
.sticky .lab{font:700 1.5rem/1 var(--hand);color:var(--red);display:block;margin-bottom:8px}
.hero .art{display:flex;gap:10px;align-items:flex-end;margin-top:24px}
.hero .art .st1{width:54px;height:54px;transform:rotate(-12deg)}.hero .art .st2{width:34px;height:34px;transform:rotate(10deg)}.hero .art .st3{width:44px;height:44px;transform:rotate(-4deg)}
.arrow{width:100px;height:56px;stroke:var(--red)}
.note{font:700 1.5rem/1 var(--hand);color:var(--red);transform:rotate(-4deg)}
.acts{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:6px 24px 4px;font:700 1.55rem/1 var(--hand);color:var(--ink);background:#fff;border:2.5px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;cursor:pointer;text-decoration:none;box-shadow:3px 4px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translate(-1px,-2px) rotate(-1deg);box-shadow:5px 7px 0 var(--ink)}
.btn.f{background:var(--y)}
.btn svg{width:22px;height:22px}
.stamp{display:inline-block;margin-top:22px;font:700 1.45rem/1.1 var(--hand);color:var(--red);border:3px double var(--red);border-radius:12px;padding:6px 14px 4px;transform:rotate(-3deg);opacity:.88}

/* section heads */
section{position:relative;padding:clamp(34px,6vw,64px) 0}
.sh{margin-bottom:28px}
.chap{display:block;font:700 1.5rem/1 var(--hand);color:var(--red);transform:rotate(-1.5deg);margin-bottom:2px}
h2{font:700 clamp(2.4rem,6vw,3.6rem)/1.05 var(--hand);padding:.04em .06em .1em}
.sh .sq{width:min(300px,70%);margin-top:0}

/* pages (jobs) */
.pages{display:grid;gap:44px}
.pg{position:relative;transform:rotate(var(--r,0deg));filter:drop-shadow(0 10px 12px rgba(60,40,0,.22));transition:opacity .8s ease,transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.js .pg.rv:not(.in){opacity:0;transform:translateY(34px) rotate(calc(var(--r,0deg) * 3))}
.pg:hover{transform:rotate(0)}
.sheet{position:relative;background-color:var(--sheet);background-image:linear-gradient(to right,transparent 46px,var(--margin) 46px,var(--margin) 48px,transparent 48px),repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--line) 31px,var(--line) 32px);background-position:0 0,0 14px;padding:34px clamp(16px,3vw,32px) 22px 66px;border-radius:3px}
.pno{position:absolute;top:10px;right:16px;font:700 1.35rem/1 var(--hand);color:var(--soft);transform:rotate(3deg)}
.job h3{font:700 clamp(1.9rem,3.8vw,2.5rem)/1.05 var(--hand);margin-top:6px;padding-right:48px;overflow-wrap:anywhere}
.co{font:700 1.7rem/1.2 var(--hand);margin-top:10px;display:flex;flex-wrap:wrap;gap:0 10px;align-items:baseline}
.co small{font:400 1.2rem var(--body);color:var(--soft)}
.circ{position:relative;display:inline-block;margin:14px 0 10px 8px;padding:8px 30px 5px;font:700 1.45rem/1.2 var(--hand);color:var(--red);white-space:nowrap}
.circ svg{position:absolute;left:-6px;top:-3px;width:calc(100% + 12px);height:calc(100% + 8px);stroke:var(--red)}
.job .t{margin-top:8px;max-width:46em;font-size:1.3rem;line-height:var(--lh)}
.job .t.wv{padding-bottom:4px}
.job .corner{position:absolute;right:20px;bottom:10px;width:46px;height:46px;transform:rotate(12deg)}

/* skills */
.slist{display:grid;gap:0}
.sk{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;min-height:var(--lh);padding:6px 0}
.sk .cb{width:30px;height:30px;stroke-width:2.8}
.sk .cb .tick{stroke:var(--red);stroke-width:3.6}
.sk .nm{flex:1 1 220px;font-size:1.45rem;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.sk .rate{display:flex;align-items:center;gap:2px}
.sk .lv{font:700 1.2rem/1 var(--hand);color:var(--soft);min-width:6.4em}
.st{width:28px;height:28px;stroke-width:3}
.st path{fill:transparent}
.st.on path{fill:#ffd84a}
.js .st.on .dr{fill:transparent}
.js .in .st.on .dr{fill:#ffd84a}
.legend{font:700 1.35rem/1.2 var(--hand);color:var(--soft);margin-top:14px;transform:rotate(-1deg)}

/* certs */
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:30px 22px;padding-top:12px}
.stk{position:relative;background:#fff;padding:22px 16px 16px 60px;min-height:84px;box-shadow:0 8px 12px -6px rgba(60,40,0,.3);transform:rotate(var(--r,0deg));border:1px solid rgba(38,51,77,.15);line-height:1.25;display:flex;align-items:center;font-size:1.25rem;overflow-wrap:anywhere}

.stk .st path{fill:#ffd84a}
.js .stk .st .dr{fill:transparent}.js .in.stk .st .dr{fill:#ffd84a}
.stk .tape{width:70px;height:22px;top:-12px}

/* edu + langs */
.two{display:grid;gap:40px;grid-template-columns:1fr}
@media(min-width:900px){.two{grid-template-columns:1.2fr 1fr;gap:56px}}
.edu{padding:8px 0 10px}
.edu+.edu{border-top:2px dashed rgba(38,51,77,.3)}
.edu b{display:block;font:700 1.9rem/1.1 var(--hand)}
.edu span{display:block;color:var(--soft);font-size:1.2rem;line-height:1.35}
.edu .d{color:var(--red);font:700 1.3rem/1.3 var(--hand)}
.bubbles{display:flex;flex-wrap:wrap;gap:22px 18px;padding-top:10px}
.bub{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:26px 30px 28px 24px/28px 24px 30px 26px;padding:12px 20px 8px;transform:rotate(var(--r,0deg));line-height:1.2}
.bub::after{content:'';position:absolute;left:26px;bottom:-14px;width:18px;height:18px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:skewY(30deg) rotate(35deg) scaleX(.9);clip-path:polygon(100% 0,100% 100%,0 100%)}
.bub b{display:block;font:700 1.8rem/1 var(--hand)}
.bub span{color:var(--soft);font-size:1.1rem}

/* contact */
.contact{display:grid;gap:30px;grid-template-columns:1fr;justify-items:start;padding-bottom:30px}
.contact .sticky{padding-top:38px;font-size:1.45rem;width:min(100%,32rem)}
.contact .sticky a{display:block;font:700 clamp(1.5rem,5.2vw,2.2rem)/1.35 var(--hand);overflow-wrap:anywhere;text-decoration-thickness:2px;text-underline-offset:5px}
.foot{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;padding:18px 0 56px;font:700 1.25rem var(--hand);color:var(--soft)}
.foot a{color:var(--soft)}

html.still *,html.still *::before,html.still *::after{transition:none!important;animation:none!important}
html.still .wr,html.still .wv{clip-path:none!important}
html.still .dr{stroke-dashoffset:0!important}
html.still .st.on .dr,html.still .stk .st .dr{fill:#ffd84a!important}
html.still mark.hl{background-size:100% 58%!important}
html.still .fd,html.still .pg{opacity:1!important}
html.still{scroll-behavior:auto}

@media(max-width:560px){
 body{font-size:1.22rem}

}

 .hero{display:block;padding:0 0 6pt}

 .sheet{background:none;padding:6pt 0 6pt 0;border-bottom:.5pt solid #999}
 .pages{gap:6pt}
 .job h3{font-size:15pt}.co{font-size:12pt}.circ{padding:0;margin:2pt 0;color:#000;font-size:12pt}
 .job .t{font-size:11pt;line-height:1.35;margin-top:2pt}
 mark.hl{background:none;border-bottom:1pt solid #000;padding:0;margin:0}
 .sk{padding:1pt 0;break-inside:avoid}.sk .nm{font-size:11pt}.sk .lv{font-size:10pt;color:#000}.st{width:10pt;height:10pt;stroke-width:5}.sk .cb{width:10pt;height:10pt}
 .certs{grid-template-columns:1fr 1fr;gap:3pt 12pt;padding:0}
 .stk{box-shadow:none;border:0;padding:1pt 0 1pt 14pt;min-height:0;transform:none;font-size:10.5pt;break-inside:avoid}.stk .st{width:9pt;height:9pt;margin-top:-4.5pt;left:0;display:block!important}
 .two{display:block}.edu b{font-size:13pt}.edu span{font-size:10.5pt}.edu .d{font-size:10.5pt}
 .bubbles{gap:3pt 14pt}.bub{border:0;padding:0;transform:none;display:flex;gap:6pt}.bub::after{display:none}.bub b{font-size:11pt}.bub span{font-size:10.5pt}
 .contact{display:block;padding:0}.contact .sticky a{font-size:12pt}.foot{display:none}
}
</style>

'use strict';
var root=document.documentElement,$=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var arr=function(x){return Array.isArray(x)?x:[]};
var D=DATA||{},name=String(D.name||'Your Name').trim(),title=D.title||'',sum=D.summary||'';
var jobs=arr(D.jobs).filter(Boolean),skills=arr(D.skills).filter(Boolean),certs=arr(D.certs).filter(Boolean),edu=arr(D.edu).filter(Boolean),langs=arr(D.langs).filter(Boolean);
var email=D.email?String(D.email).trim():'',phone=D.phone?String(D.phone).trim():'',tel=phone.replace(/[^0-9+]/g,'');
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var still=RM||/[?&]static(\b|=)/.test(location.search);
root.classList.add('js');if(still)root.classList.add('still');

/* head */
document.title=name+' — Resume';
var desc=(title?title+'. ':'')+(sum?sum.slice(0,150):'');
function meta(sel,v){var m=$(sel);if(m)m.setAttribute('content',v)}
meta('meta[name=description]',desc);meta('meta[property="og:title"]',name+' — Resume');meta('meta[property="og:description"]',desc);meta('meta[name="twitter:title"]',name+' — Resume');meta('meta[name="twitter:description"]',desc);

/* ---------- doodle toolkit (all inline SVG) ---------- */
var STAR='M32 5l7.5 19.5 20.5 1.5-16 13 5.5 20L32 47 14.5 59l5.5-20L4 26l20.5-1.5z';
function svg(vb,inner,cls,st){return '<svg class="doo '+(cls||'')+'" viewBox="'+vb+'" aria-hidden="true" focusable="false"'+(st?' style="'+st+'"':'')+'>'+inner+'</svg>'}
function dp(d,dd){return '<path class="dr" pathLength="1" d="'+d+'"'+(dd?' style="--dd:'+dd+'s"':'')+'/>'}
function star(cls,on,dd){return svg('0 0 64 64',dp(STAR,dd),(cls||'')+(on?' on':''))}
function squig(w,cls){return svg('0 0 200 14',dp('M2 8C14 0 22 14 34 6S56 0 68 8 90 14 102 6 124 0 136 8 158 14 170 6 190 2 198 7',.5),'sq '+(cls||''),w?'width:'+w:'')}
function arrow(cls){return svg('0 0 110 56',dp('M4 46C26 10 64 4 98 30')+dp('M80 21l19 10-12 14',.9),'arrow '+(cls||'red'))}
function clip(){return svg('0 0 40 90','<path d="M12 40V72a8 8 0 0 0 16 0V20a12 12 0 0 0-24 0V66"/>','clip')}
function tape(c,r){return '<i class="tape '+(c||'')+'" style="--tr:'+(r||-3)+'deg" aria-hidden="true"></i>'}
function ring(st){return '<svg class="ring" style="'+st+'" viewBox="0 0 200 200" aria-hidden="true"><path stroke-width="7" stroke-opacity=".3" d="M100 14c48-2 86 36 85 84s-38 86-86 86-85-40-84-87S52 16 100 14z"/><path stroke-width="2.5" stroke-opacity=".45" d="M101 22c42-1 76 33 75 76s-33 77-77 77-76-35-75-78S58 23 101 22z"/><path stroke-width="3" stroke-opacity=".35" d="M60 150c18 22 62 28 90 6" /><path stroke-width="9" stroke-opacity=".12" d="M30 100c0-40 30-70 70-70"/></svg>'}
function checkbox(){return svg('0 0 32 32','<path d="M5 6L26 4.5 27.5 26 6 27.5z"/>'+'<path class="dr tick" pathLength="1" d="M8 16l6 8L29 3" style="--dd:.3s"/>','cb')}
var IC={mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>'};

/* ---------- highlighter: acronyms + words that also appear in skills ---------- */
var STOP={'with':1,'team':0,'that':1,'this':1,'from':1,'and':1,'the':1,'for':1};
var skillWords={};
skills.forEach(function(s){String(s[0]||'').split(/[^A-Za-z]+/).forEach(function(w){w=w.toLowerCase();if(w.length>=4&&!STOP[w])skillWords[w]=1})});
function hl(text,max){
 var used=0,seen={},parts=String(text||'').split(/([A-Za-z][A-Za-z0-9\-]*)/);
 var out=parts.map(function(p,i){
  if(i%2===1&&used<max){var k=p.toLowerCase();
   if(!seen[k]&&(/^[A-Z]{2,}[A-Za-z]*$/.test(p)&&p.length<=6||skillWords[k])){seen[k]=1;used++;return '<mark class="hl c'+((used-1)%3)+'" style="--hd:'+(1.1+used*.35)+'s">'+esc(p)+'</mark>'}}
  return esc(p)}).join('');
 return out}

/* years of experience (span of years in job dates) */
var yrs=[];jobs.forEach(function(j){(String(j.dates||'').match(/\b(19|20)\d{2}\b/g)||[]).forEach(function(y){yrs.push(+y)})});
var years=yrs.length?new Date().getFullYear()-Math.min.apply(null,yrs):0;

/* ---------- render ---------- */
var lw=['','Just started','Getting there','Pretty good','Really good','Super strong'];
function lvl(v){return Math.max(1,Math.min(5,Math.round(Number(v)||3)))}
var secs=[];
if(jobs.length)secs.push(['experience','Experience']);if(skills.length)secs.push(['skills','Skills']);if(certs.length)secs.push(['certs','Gold Stars']);if(edu.length)secs.push(['education','School']);if(langs.length)secs.push(['languages','Languages']);secs.push(['contact','Say hi']);
var chapN=0;
function sh(id,t,w){chapN++;return '<div class="sh rv"><span class="chap">chapter '+chapN+'</span><h2 class="wr" id="h-'+id+'" style="--wt:1s">'+esc(t)+'</h2>'+squig(w)+'</div>'}
var rots=[-1.2,.9,-.6,1.1,-.9,.7];

var out='<nav class="tabs" aria-label="Sections"><div class="tabs-in">'+secs.map(function(s){return '<a href="#'+s[0]+'">'+s[1]+'</a>'}).join('')+'<button type="button" id="pdf0">Download PDF</button></div></nav><main id="main">';
/* hero */
out+='<div class="wrap"><header class="hero" id="top">'+ring('right:-20px;top:20px;transform:rotate(18deg)')+
 '<div><p class="belongs fd rv">this notebook belongs to:</p><h1 class="wr rv" id="nm" style="--wt:1.6s;--st:30;--d:.2s">'+esc(name)+'</h1>'+squig('',' ')+
 (title?'<p class="ttl fd rv" style="--d:.5s">'+esc(title)+'</p>':'')+
 '<div class="acts fd rv" style="--d:.7s">'+(email?'<a class="btn f" href="mailto:'+esc(email)+'">'+IC.mail+'Email me</a>':'')+'<button type="button" class="btn" id="pdf">'+IC.dl+'Download PDF</button></div>'+
 (years>=1?'<span class="stamp fd rv" style="--d:.9s">'+years+'+ years of lessons learned</span>':'')+'</div>'+
 (sum?'<div class="fd rv" style="--d:.4s"><div class="sticky" style="--r:2deg">'+tape('',-4)+'<span class="lab">the short version</span><p class="wv" style="--d:.9s;--st:10">'+esc(sum)+'</p></div>'+
 '<div class="art" aria-hidden="true">'+star('st1',false,.6)+star('st2',false,.9)+star('st3',false,1.2)+arrow('red')+'<span class="note">hi!</span></div></div>':'')+
 '</header></div>';
/* experience */
if(jobs.length)out+='<section id="experience" aria-labelledby="h-experience"><div class="wrap">'+sh('experience','Where I’ve worked')+'<div class="pages">'+jobs.map(function(j,i){
 var r=rots[i%rots.length],deco=i%2?clip():tape(['','pk','bl'][i%3],i%2?3:-4);
 return '<article class="job pg rv" style="--r:'+r+'deg"><div class="sheet">'+deco+'<span class="pno">p. '+(jobs.length-i)+'</span><h3>'+esc(j.role||'')+'</h3>'+
  ((j.co||j.loc)?'<p class="co">'+(j.co?'<span>'+esc(j.co)+'</span>':'')+(j.loc?'<small>'+esc(j.loc)+'</small>':'')+'</p>':'')+
  (j.dates?'<span class="circ">'+esc(j.dates)+svg('0 0 200 60',dp('M20 30C18 10 70 3 105 4s88 6 90 26-50 27-92 26S12 48 22 24',.4),'red')+'</span>':'')+
  (j.text?'<p class="t wv" style="--d:.4s;--st:'+Math.max(4,Math.ceil(String(j.text).length/70))+'">'+hl(j.text,4)+'</p>':'')+
  (i===0?svg('0 0 64 64',dp(STAR,.8),'corner gold'):'')+'</div></article>'}).join('')+'</div></div></section>';
/* skills */
if(skills.length)out+='<section id="skills" aria-labelledby="h-skills"><div class="wrap">'+ring('left:46%;top:30px;transform:rotate(-30deg)')+sh('skills','Things I’m good at')+'<div class="pg rv" style="--r:.6deg"><div class="sheet">'+tape('bl',-2)+'<ul class="slist">'+skills.map(function(s,i){var n=lvl(s[1]),st='';for(var k=1;k<=5;k++)st+=star('st',k<=n,.3+k*.1);
 return '<li class="sk rv">'+checkbox()+'<span class="nm">'+esc(s[0])+'</span><span class="rate" role="img" aria-label="'+n+' out of 5 stars">'+st+'</span><span class="lv">'+lw[n]+'</span></li>'}).join('')+'</ul></div></div><p class="legend">★ = how confident I feel. ✓ = checked off.</p></div></section>';
/* certs */
if(certs.length)out+='<section id="certs" aria-labelledby="h-certs"><div class="wrap">'+sh('certs','Gold stars collected')+'<ul class="certs">'+certs.map(function(c,i){return '<li class="stk fd rv" style="--r:'+rots[(i+2)%rots.length]*1.6+'deg;--d:'+(i%3*.1)+'s">'+(i%2?tape('pk',-5):tape('',4))+star('st',true,.3)+'<span>'+esc(c)+'</span></li>'}).join('')+'</ul></div></section>';
/* edu + langs */
if(edu.length||langs.length){out+='<div class="wrap two">';
 if(edu.length)out+='<section id="education" aria-labelledby="h-education">'+sh('education','School days')+'<div class="pg rv" style="--r:-.7deg"><div class="sheet">'+tape('pk',-3)+edu.map(function(e){return '<div class="edu"><b>'+esc(e[0]||'')+'</b>'+(e[2]?'<span>'+esc(e[2])+'</span>':'')+(e[1]?'<span class="d">'+esc(e[1])+'</span>':'')+'</div>'}).join('')+'</div></div></section>';
 if(langs.length)out+='<section id="languages" aria-labelledby="h-languages">'+sh('languages','I can say it in…')+'<div class="bubbles">'+langs.map(function(l,i){return '<div class="bub fd rv" style="--r:'+rots[i%rots.length]*2+'deg;--d:'+(i*.12)+'s"><b>'+esc(l[0]||'')+'</b>'+(l[1]?'<span>'+esc(l[1])+'</span>':'')+'</div>'}).join('')+'</div></section>';
 out+='</div>'}
/* contact */
out+='<section id="contact" aria-labelledby="h-contact"><div class="wrap">'+ring('right:6%;top:40px;transform:rotate(60deg)')+sh('contact','Let’s talk!')+'<div class="contact"><div class="sticky pk fd rv" style="--r:-2deg">'+tape('',3)+clip()+'<span class="lab">call me maybe? (yes, really)</span>'+
 (email?'<a href="mailto:'+esc(email)+'">'+esc(email)+'</a>':'')+(phone?'<a href="tel:'+esc(tel)+'">'+esc(phone)+'</a>':'')+'</div>'+
 '<div class="acts fd rv">'+(email?'<a class="btn f" href="mailto:'+esc(email)+'">'+IC.mail+'Write me a note</a>':'')+(phone?'<a class="btn" href="tel:'+esc(tel)+'">'+IC.phone+'Call</a>':'')+'<button type="button" class="btn" id="pdf2">'+IC.dl+'Download PDF</button></div></div>'+
 '<div class="foot"><span>© '+new Date().getFullYear()+' '+esc(name)+' — written by hand (sort of)</span><a href="#top">back to page one ↑</a></div></div></section></main>';
$('#app').innerHTML=out;
[$('#pdf'),$('#pdf2'),$('#pdf0')].forEach(function(b){if(b)b.addEventListener('click',function(){window.print()})});

/* ---------- scroll reveal ---------- */
var targets=$$('.rv');
if(still||!('IntersectionObserver' in window))targets.forEach(function(t){t.classList.add('in')});
else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -6% 0px'});targets.forEach(function(t){io.observe(t)})}
})();
</script>
</body>
</html>
