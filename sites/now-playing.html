<style>
:root{--bg:#0b0a10;--bg2:#14121c;--card:#171421;--text:#f2f0f7;--muted:#a09bb2;--line:#2a2638;--ac:#c6ff3d;--ac-rgb:198,255,61;--head:'Bricolage Grotesque','Arial Narrow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px;-webkit-text-size-adjust:100%;color-scheme:dark}
body{background:var(--bg);color:var(--text);font:400 1rem/1.65 var(--sans);padding-bottom:104px;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* top bar */
.top{position:sticky;top:0;z-index:150;background:rgba(11,10,16,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{width:min(1080px,100% - 32px);margin:0 auto;display:flex;align-items:center;gap:16px;min-height:52px}
.logo{display:flex;align-items:center;gap:10px;font:700 .78rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--text);text-decoration:none;margin-right:auto}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 0 rgba(var(--ac-rgb),.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(var(--ac-rgb),0)}100%{box-shadow:0 0 0 0 rgba(var(--ac-rgb),0)}}
.top nav ul{display:flex;gap:2px}
.top nav a{display:flex;align-items:center;min-height:44px;padding:0 12px;font:500 .8rem var(--mono);letter-spacing:.06em;color:var(--muted);text-decoration:none;transition:color .2s}
.top nav a:hover,.top nav a.on{color:var(--ac)}
@media(max-width:700px){.top nav{display:none}}

/* hero */
.hero{padding:clamp(28px,5vw,64px) 0 clamp(36px,5vw,64px)}
.hero-g{display:grid;gap:clamp(28px,5vw,64px);grid-template-columns:minmax(0,1fr);align-items:center}
@media(min-width:860px){.hero-g{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}}
.sleeve{position:relative;width:100%;max-width:520px;padding-bottom:min(78%,405px);margin:0 auto;overflow:hidden}
.cover{position:absolute;left:0;top:0;width:78%;aspect-ratio:1;border-radius:6px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);z-index:2;transform:rotate(-1.5deg);transform-origin:30% 70%;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.sleeve:hover .cover{transform:rotate(0)}
.cover svg{display:block;width:100%;height:100%}
.vinyl{position:absolute;right:0;top:0;width:78%;aspect-ratio:1;border-radius:50%;z-index:1;animation:spin 5.5s linear infinite;background:repeating-radial-gradient(circle at 50% 50%,#0d0c12 0 2px,#17151f 2px 3px),#0d0c12;box-shadow:0 20px 50px rgba(0,0,0,.6);transform:translateX(0)}
.vinyl::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 8%,rgba(255,255,255,.1) 12%,transparent 18% 50%,rgba(255,255,255,.08) 62%,transparent 70%)}
.vinyl::after{content:'';position:absolute;inset:34%;border-radius:50%;background:radial-gradient(circle at 50% 50%,#0b0a10 0 4%,var(--ac) 4.5% 100%);box-shadow:0 0 0 6px #0d0c12}
@keyframes spin{to{transform:rotate(360deg)}}
.lbl{position:absolute;inset:0;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:500 .78rem var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ac)}
.eyebrow::before{content:'';width:28px;height:2px;background:var(--ac)}
h1{font:800 clamp(2.5rem,7.5vw,5.2rem)/.98 var(--head);letter-spacing:-.025em;margin-top:14px;overflow-wrap:anywhere}
.alb{font:500 clamp(1.05rem,2.2vw,1.4rem)/1.35 var(--head);color:var(--ac);margin-top:14px;max-width:30em}
.alb small{display:block;font:400 .72rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.sum{margin-top:20px;max-width:40rem;color:#d9d5e6;font-size:1.04rem}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:99px;border:1.5px solid var(--ac);background:var(--ac);color:#0b0a10;font:700 .95rem var(--sans);text-decoration:none;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(var(--ac-rgb),.3)}
.btn.o{background:transparent;color:var(--text);border-color:#4a4460}
.btn.o:hover{border-color:var(--ac);color:var(--ac);box-shadow:none}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.viz{display:flex;align-items:flex-end;gap:3px;height:76px;margin-top:34px}
.viz i{flex:1;min-width:2px;height:100%;border-radius:3px 3px 1px 1px;background:linear-gradient(to top,rgba(var(--ac-rgb),.25),var(--ac));transform-origin:50% 100%;transform:scaleY(var(--s,.5));animation:bar var(--dur,1s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes bar{from{transform:scaleY(calc(var(--s,.5)*.25))}to{transform:scaleY(var(--s,.5))}}
.meta{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:22px;font:400 .8rem var(--mono);color:var(--muted)}
.meta b{color:var(--text);font-weight:500}

/* sections */
section{padding:clamp(36px,6vw,72px) 0}
.sh{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 18px;margin-bottom:clamp(20px,3.5vw,34px);padding-bottom:14px;border-bottom:1px solid var(--line)}
.sh small{font:500 .74rem var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ac)}
h2{font:800 clamp(1.8rem,4.4vw,2.8rem)/1.05 var(--head);letter-spacing:-.02em}
.sh span.r{margin-left:auto;font:400 .78rem var(--mono);color:var(--muted)}

/* tracklist */
.trks{display:grid;gap:2px}
.trk{border-radius:14px;transition:background .3s}
.trk:hover,.trk.open{background:var(--card)}
.trk-h{display:grid;grid-template-columns:44px minmax(0,1fr) auto 24px;align-items:center;gap:6px 14px;width:100%;padding:14px 16px;background:none;border:0;text-align:left;cursor:pointer;border-radius:14px}
.n{font:500 .95rem var(--mono);color:var(--muted);text-align:center;position:relative;height:22px;line-height:22px}
.n .eqb{display:none;position:absolute;inset:0;align-items:flex-end;justify-content:center;gap:2px;padding:2px 0}
.n .eqb i{width:3px;height:100%;background:var(--ac);border-radius:1px;transform-origin:bottom;animation:bar .7s ease-in-out infinite alternate}
.n .eqb i:nth-child(2){animation-duration:.5s;animation-delay:-.2s}.n .eqb i:nth-child(3){animation-duration:.9s;animation-delay:-.45s}
.trk.open .n .num{visibility:hidden}.trk.open .n .eqb{display:flex}
.trk.open .n{color:var(--ac)}
.tt{min-width:0}
.tt b{display:block;font:700 clamp(1rem,2.1vw,1.2rem)/1.3 var(--head);transition:color .25s}
.trk:hover .tt b,.trk.open .tt b{color:var(--ac)}
.tt em{display:block;font-style:normal;color:var(--muted);font-size:.92rem;margin-top:1px}
.du{font:400 .82rem var(--mono);color:var(--muted);white-space:nowrap}
.chev{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s}
.trk.open .chev{transform:rotate(180deg);stroke:var(--ac)}
.lyr{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.3,.7,.2,1)}
.trk.open .lyr{grid-template-rows:1fr}
.lyr-in{overflow:hidden;min-height:0;visibility:hidden;transition:visibility .45s}
.trk.open .lyr-in{visibility:visible}
.lyr-b{padding:4px 16px 22px 74px}
.lyr-b p.lx{font:italic 500 clamp(1.05rem,2vw,1.28rem)/1.5 var(--head);color:#e6e2f2;max-width:34em;border-left:2px solid var(--ac);padding-left:18px}
.lyr-b p.lx span{display:block}
.lyr-b p.lm{margin-top:12px;font:400 .78rem var(--mono);letter-spacing:.06em;color:var(--muted);padding-left:20px}
@media(max-width:560px){
 .trk-h{grid-template-columns:34px minmax(0,1fr) 20px;padding:14px 8px;gap:2px 8px}
 .du{grid-column:2;grid-row:2;font-size:.76rem}.chev{grid-column:3;grid-row:1/3}
 .lyr-b{padding:2px 8px 20px 8px}
}

/* equalizer */
.eqw{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,40px)}
.eqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:clamp(14px,3vw,30px)}
.band{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.col{display:flex;flex-direction:column-reverse;gap:4px;width:44px;padding:6px;border-radius:10px;background:#0e0c14;border:1px solid var(--line)}
.col i{display:block;height:11px;border-radius:2px;background:#221e2e;transition:background .35s,box-shadow .35s;transition-delay:calc(var(--k)*70ms + .15s)}
.col i.on{background:rgba(var(--ac-rgb),.55)}
.col i.on:nth-child(n+7){background:rgba(var(--ac-rgb),.8)}
.band.in .col i.on{background:var(--ac);box-shadow:0 0 10px rgba(var(--ac-rgb),.45)}
.band.in .col i.top{animation:flick 1.3s ease-in-out infinite alternate}
@keyframes flick{to{opacity:.45}}
.js .band:not(.in) .col i.on{background:#221e2e;box-shadow:none}
.band b{font:700 .95rem/1.3 var(--head)}
.band span{font:400 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* liner notes */
.liner{display:grid;gap:clamp(18px,3vw,32px);grid-template-columns:1fr}
@media(min-width:860px){.liner{grid-template-columns:1.1fr .9fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3.5vw,32px)}
.card h3{font:500 .74rem var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ac);margin-bottom:14px}
.credits li{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);color:#ddd9ea}
.credits li:last-child{border:0}
.credits li::before{content:'\266A';color:var(--ac);flex:none}
.rec{padding:12px 0;border-bottom:1px dashed var(--line)}.rec:last-child{border:0}
.rec b{display:block;font:700 1.05rem var(--head)}
.rec span{display:block;color:var(--muted);font-size:.92rem}
.rec small{font:400 .76rem var(--mono);color:var(--ac)}
.lang{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:9px 0;border-bottom:1px dashed var(--line)}.lang:last-child{border:0}
.lang span{color:var(--muted);font-size:.92rem}
.stack{display:grid;gap:clamp(18px,3vw,32px)}

/* contact */
.book{position:relative;overflow:hidden;border-radius:26px;padding:clamp(30px,6vw,72px);background:linear-gradient(135deg,#1b1727,#100e18);border:1px solid var(--line);text-align:center}
.book::before{content:'';position:absolute;left:50%;top:50%;width:min(720px,140%);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 22px,rgba(var(--ac-rgb),.06) 22px 23px);pointer-events:none}
.book>*{position:relative}
.book h2{font-size:clamp(2.2rem,7vw,4.6rem)}
.book h2 em{font-style:normal;color:var(--ac)}
.book p{max-width:34rem;margin:14px auto 0;color:#d1cde0}
.book .acts{justify-content:center}
.foot{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;padding:26px 0 8px;color:var(--muted);font:400 .8rem var(--mono)}
.foot a{color:var(--muted)}

/* player bar */
.player{position:fixed;left:0;right:0;bottom:0;z-index:200;background:rgba(18,15,26,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.pbar{height:4px;background:#2a2638;position:relative;cursor:pointer}
.pbar i{position:absolute;inset:0;background:var(--ac);transform-origin:0 50%;transform:scaleX(var(--p,0))}
.pbar i::after{content:'';position:absolute;right:-6px;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--ac);box-shadow:0 0 12px rgba(var(--ac-rgb),.8)}
.p-in{width:min(1080px,100% - 24px);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;min-height:68px;padding:6px 0}
.p-now{display:flex;align-items:center;gap:12px;min-width:0}
.p-art{flex:none;width:48px;height:48px;border-radius:6px;overflow:hidden}.p-art svg{display:block;width:100%;height:100%}
.p-txt{min-width:0}
.p-txt b{display:block;font:700 .92rem/1.25 var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-txt span{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-ctl{display:flex;align-items:center;gap:4px}
.pb{width:44px;height:44px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--text);transition:color .2s,transform .2s}
.pb:hover{color:var(--ac)}
.pb svg{width:22px;height:22px;fill:currentColor}
.pb.pl{background:var(--ac);color:#0b0a10;width:48px;height:48px}.pb.pl:hover{color:#0b0a10;transform:scale(1.07)}
.pb.pl .ic-play{display:none}html.paused .pb.pl .ic-play{display:block}html.paused .pb.pl .ic-pause{display:none}
.p-time{justify-self:end;font:400 .78rem var(--mono);color:var(--muted);white-space:nowrap}
@media(max-width:620px){.p-in{grid-template-columns:minmax(0,1fr) auto}.p-time{display:none}.p-art{width:40px;height:40px}}

.rv{transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.js .rv:not(.in){opacity:0;transform:translateY(18px)}
html.paused *,html.paused *::before,html.paused *::after{animation-play-state:paused!important}
html.still *,html.still *::before,html.still *::after{transition:none!important;animation:none!important}
html.still .rv{opacity:1!important;transform:none!important}
html.still .band .col i.on{background:var(--ac)!important}
html.still{scroll-behavior:auto}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

@media print{
 @page{margin:12mm}
 html,body{background:#fff!important;color:#000!important}
 body{padding:0;font-size:10pt;line-height:1.4}body::before{display:none}

 .lyr{grid-template-rows:1fr!important}.lyr-in{visibility:visible!important}.lyr-b{padding:0 0 4pt 44px}.lyr-b p.lx{color:#000;font-size:9.5pt;border-left:1pt solid #000;padding-left:8pt}.lyr-b p.lm{color:#000;padding-left:9pt}
 .eqw,.card,.book{background:none!important;border:0;padding:0}.eqs{grid-template-columns:repeat(5,1fr);gap:8pt}
 .col{background:#fff;border:.5pt solid #000;width:30pt;padding:2pt;gap:2pt}.col i{height:5pt;background:#ddd!important}.col i.on{background:#000!important}
 .band b,.band span{color:#000!important}
 .liner{grid-template-columns:1fr 1fr}.card h3{color:#000}.credits li,.lang,.rec{color:#000;border-color:#999}.credits li::before{color:#000}.rec span,.rec small,.lang span{color:#000}
 .book{text-align:left}.book h2,.book h2 em,.book p{color:#000}.book p{margin:4pt 0 0}
 .cl-print{display:block!important}
 .foot{color:#000}
}
