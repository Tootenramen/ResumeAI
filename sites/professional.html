<style>
:root{--bg:#f6f7f9;--surface:#fff;--text:#1b2330;--muted:#556074;--border:#e1e5ec;--accent:#2557a7;--accent-rgb:37,87,167;--accent-t:#2557a7;--shadow:0 1px 2px rgba(20,30,50,.05),0 8px 24px rgba(20,30,50,.06);--serif:'Source Serif 4',Georgia,'Times New Roman',serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--r:14px}

*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{scroll-behavior:smooth;scroll-padding-top:120px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:400 1rem/1.65 var(--sans);overflow-x:hidden;transition:background .35s,color .35s;-webkit-font-smoothing:antialiased}
a{color:var(--accent-t)}
ul,ol{padding:0;list-style:none}

.skip{position:absolute;left:8px;top:-60px;background:var(--accent);color:#fff;padding:10px 16px;border-radius:8px;z-index:300}.skip:focus{top:8px}

.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:200;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}

/* header */
.hdr{position:sticky;top:0;z-index:150;background:color-mix(in srgb,var(--bg) 88%,transparent);background:var(--bg);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border)}
@supports (background:color-mix(in srgb,red,blue)){.hdr{background:color-mix(in srgb,var(--bg) 86%,transparent)}}
.hdr-in{width:min(1120px,100% - 32px);margin:0 auto;display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;min-height:60px;padding:4px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font:600 1rem var(--sans);min-width:0;margin-right:auto}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:600 .85rem var(--sans);letter-spacing:.02em}
.bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{order:3;width:100%;overflow:hidden;max-height:50px;transition:max-height .3s ease,opacity .3s}
.hdr.compact .nav{max-height:0;opacity:0;pointer-events:none}
.nav ul{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav a{position:relative;display:flex;align-items:center;min-height:44px;padding:0 12px;font:500 .9rem var(--sans);color:var(--muted);text-decoration:none;white-space:nowrap;transition:color .25s}
.nav a::after{content:'';position:absolute;left:12px;right:12px;bottom:6px;height:2px;border-radius:2px;background:var(--accent-t);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.3,.7,.2,1)}
.nav a:hover,.nav a.on{color:var(--text)}
.nav a:hover::after,.nav a.on::after{transform:scaleX(1)}
.ctrl{display:flex;align-items:center;gap:6px;position:relative}
.icon{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:border-color .25s,transform .25s}
.icon:hover{border-color:var(--accent-t);transform:translateY(-1px)}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sun{display:none}[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
.sw{display:none;gap:4px;align-items:center}
.sw.open{display:flex;position:absolute;right:0;top:52px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:var(--shadow);z-index:20}
.sw button{width:44px;height:44px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer}
.sw i{width:26px;height:26px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--border);transition:transform .25s,box-shadow .25s}
.sw button:hover i{transform:scale(1.12)}
.sw button[aria-checked=true] i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
@media(min-width:900px){

}

[data-theme=dark] .btn.p{border-color:var(--accent-t)}
.btn.o{background:transparent;color:var(--accent-t);border-color:var(--border)}
.btn.o:hover{border-color:var(--accent-t);transform:translateY(-2px)}
.cl{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:26px;color:var(--muted)}
.cl a{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;overflow-wrap:anywhere;min-height:32px}
.cl a:hover{color:var(--accent-t)}
.cl svg{flex:none;width:18px;height:18px;fill:none;stroke:var(--accent-t);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px;margin-top:clamp(34px,5vw,56px);max-width:720px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.stat b{display:block;font:700 2.2rem/1.1 var(--serif);color:var(--accent-t);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.9rem}

.art{display:none;position:absolute;right:max(4%,calc((100% - 1120px)/2 + 20px));top:50%;width:300px;height:300px;margin-top:-170px;pointer-events:none}
.art i{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(var(--accent-rgb),.28);animation:orbit 14s ease-in-out infinite}
.art i:nth-child(2){inset:-34px;border-style:dashed;border-color:rgba(var(--accent-rgb),.2);animation-duration:19s;animation-direction:reverse}
.art i:nth-child(3){inset:-72px;border-color:rgba(var(--accent-rgb),.1);animation-duration:24s}
.art b{position:absolute;inset:24px;border-radius:50%;background:linear-gradient(145deg,var(--accent),rgba(var(--accent-rgb),.7));color:#fff;display:grid;place-items:center;font:600 5.2rem/1 var(--serif);letter-spacing:-.02em;box-shadow:0 24px 60px rgba(var(--accent-rgb),.35)}

h2::after{content:'';display:block;width:0;height:3px;border-radius:3px;background:var(--accent);margin-top:12px;transition:width .9s cubic-bezier(.3,.7,.2,1) .2s}

.tl{position:relative;display:grid;gap:18px;padding-left:34px}

.tl::after{content:'';position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--accent);border-radius:2px;transform-origin:top;transform:scaleY(var(--tp,0))}
.job{position:relative;padding:clamp(18px,3vw,26px)}
.job::before{content:'';position:absolute;left:-34px;top:28px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:3px solid var(--border);transition:border-color .5s,background .5s,transform .5s}

.jh{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;align-items:baseline}

.dates{font:500 .85rem var(--sans);color:var(--accent-t);background:rgba(var(--accent-rgb),.1);padding:3px 12px;border-radius:99px;white-space:nowrap}
.cmp{color:var(--muted);margin:2px 0 10px;font-weight:500}
.cmp b{color:var(--text);font-weight:600}
.job p.t{max-width:62ch}

.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.sk{padding:18px 22px}
.sk-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:10px}
.sk-top span:first-child{font-weight:600}
.lv{color:var(--muted);font-size:.85rem;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--border);overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-t));transform-origin:left;transition:transform 1.2s cubic-bezier(.3,.7,.2,1) .15s}

$('#navlist').innerHTML=secs.map(function(s){return '<li><a href="#'+s[0]+'">'+s[1]+'</a></li>'}).join('');

/* ---------- stats ---------- */

var stats=[];if(years>=1)stats.push([years,'+','Years of experience']);if(jobs.length)stats.push([jobs.length,'','Positions held']);if(certs.length)stats.push([certs.length,'','Certifications & awards']);

/* ---------- render ---------- */
var lw=['','Foundational','Working','Proficient','Advanced','Expert'];
var h=function(id,label,t,d){return '<div class="sh rv" style="--d:'+(d||0)+'s"><small>'+label+'</small><h2 id="h-'+id+'">'+t+'</h2></div>'};
var out='<div class="hero" id="top"><div class="art" aria-hidden="true"><i></i><i></i><i></i><b>'+esc(initials)+'</b></div><div class="wrap">'+
 '<p class="eyebrow rv">Resume</p><h1 class="rv" style="--d:.08s" id="nm">'+esc(name)+'</h1>'+
 (title?'<p class="ttl rv" style="--d:.16s">'+esc(title)+'</p>':'')+
 (sum?'<p class="sum rv" style="--d:.24s">'+esc(sum)+'</p>':'')+
 '<div class="acts rv" style="--d:.32s">'+(email?'<a class="btn p" href="mailto:'+esc(email)+'">'+IC.mail+'Email me</a>':'')+'<button type="button" class="btn o" id="pdf">'+IC.dl+'Download PDF</button></div>'+
 '<address class="cl rv" style="--d:.38s;font-style:normal">'+(email?'<a href="mailto:'+esc(email)+'">'+IC.mail+esc(email)+'</a>':'')+(phone?'<a href="tel:'+esc(tel)+'">'+IC.phone+esc(phone)+'</a>':'')+'</address>'+
 (stats.length?'<div class="stats">'+stats.map(function(s,i){return '<div class="stat rv" style="--d:'+(.45+i*.1)+'s"><b data-to="'+s[0]+'" data-sfx="'+s[1]+'">'+s[0]+s[1]+'</b><span>'+s[2]+'</span></div>'}).join('')+'</div>':'')+
 '</div></div>';
if(jobs.length)out+='<section id="experience" aria-labelledby="h-experience"><div class="wrap">'+h('experience','Career','Professional experience')+'<ol class="tl" id="tl">'+jobs.map(function(j,i){return '<li class="job card rv" style="--d:.05s"><div class="jh"><h3>'+esc(j.role||'')+'</h3>'+(j.dates?'<span class="dates">'+esc(j.dates)+'</span>':'')+'</div>'+((j.co||j.loc)?'<p class="cmp">'+(j.co?'<b>'+esc(j.co)+'</b>':'')+(j.co&&j.loc?' · ':'')+(j.loc?esc(j.loc):'')+'</p>':'')+(j.text?'<p class="t">'+esc(j.text)+'</p>':'')+'</li>'}).join('')+'</ol></div></section>';
if(skills.length)out+='<section id="skills" aria-labelledby="h-skills"><div class="wrap">'+h('skills','Expertise','Skills')+'<ul class="skills">'+skills.map(function(s,i){var lv=Math.max(1,Math.min(5,Math.round(Number(s[1])||3)));return '<li class="sk card rv" style="--d:'+(i%4*.08)+'s"><div class="sk-top"><span>'+esc(s[0])+'</span><span class="lv">'+lw[lv]+'</span></div><div class="bar" role="img" aria-label="'+lw[lv]+', '+lv+' out of 5"><i style="--w:'+lv*20+'%"></i></div></li>'}).join('')+'</ul></div></section>';
if(certs.length)out+='<section id="certs" aria-labelledby="h-certs"><div class="wrap">'+h('certs','Credentials','Certifications')+'<ul class="certs">'+certs.map(function(c,i){return '<li class="card rv" style="--d:'+(i%3*.08)+'s">'+IC.ok+'<span>'+esc(c)+'</span></li>'}).join('')+'</ul></div></section>';
if(edu.length||langs.length){out+='<div class="wrap two">';
 if(edu.length)out+='<section id="education" aria-labelledby="h-education">'+h('education','Learning','Education')+'<div class="edus">'+edu.map(function(e,i){return '<div class="edu card rv" style="--d:'+(i*.08)+'s"><h3>'+esc(e[0]||'')+'</h3>'+(e[2]?'<span class="s">'+esc(e[2])+'</span>':'')+(e[1]?'<span class="d">'+esc(e[1])+'</span>':'')+'</div>'}).join('')+'</div></section>';
 if(langs.length)out+='<section id="languages" aria-labelledby="h-languages">'+h('languages','Communication','Languages')+'<div class="langs">'+langs.map(function(l,i){return '<div class="lang card rv" style="--d:'+(i*.08)+'s"><b>'+esc(l[0]||'')+'</b>'+(l[1]?'<span>'+esc(l[1])+'</span>':'')+'</div>'}).join('')+'</div></section>';
 out+='</div>'}
out+='<section id="contact" aria-labelledby="h-contact"><div class="wrap"><div class="contact rv"><h2 id="h-contact">Let’s connect</h2><p>I’d welcome the chance to discuss how my experience can support your team.</p>'+
 '<div class="acts">'+(email?'<a class="btn p" href="mailto:'+esc(email)+'">'+IC.mail+'Email me</a>':'')+'<button type="button" class="btn o" id="pdf2">'+IC.dl+'Download PDF</button></div>'+
 '<div class="cl">'+(email?'<a href="mailto:'+esc(email)+'">'+IC.mail+esc(email)+'</a>':'')+(phone?'<a href="tel:'+esc(tel)+'">'+IC.phone+esc(phone)+'</a>':'')+'</div></div>'+

[$('#pdf'),$('#pdf2')].forEach(function(b){if(b)b.addEventListener('click',function(){window.print()})});

/* ---------- reveal + count-up ---------- */
function count(el){var to=+el.dataset.to,sfx=el.dataset.sfx||'';if(still||!to){el.textContent=to+sfx;return}var t0=null,dur=1400;el.textContent='0'+sfx;(function f(t){if(!t0)t0=t;var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e)+sfx;if(p<1)requestAnimationFrame(f)})(performance.now())}
var targets=$$('.rv,.sk');
if(still||!('IntersectionObserver' in window)){targets.forEach(function(t){t.classList.add('in')});$$('.stat b').forEach(count)}
else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');if(e.target.classList.contains('stat'))count($('b',e.target));io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -5% 0px'});targets.forEach(function(t){io.observe(t)});$$('.stat b').forEach(function(b){b.textContent='0'+(b.dataset.sfx||'')})}

/* ---------- scroll: progress, spy, timeline, header hide ---------- */
var prog=$('#prog'),hdr=$('#hdr'),tl=$('#tl'),links=$$('#navlist a'),tick=false,lastY=scrollY;
function upd(){var h=root.scrollHeight-innerHeight,y=scrollY;prog.style.transform='scaleX('+(h>0?Math.min(1,y/h):0)+')';
 if(tl){var r=tl.getBoundingClientRect(),p=(innerHeight*.6-r.top)/r.height;tl.style.setProperty('--tp',still?1:Math.max(0,Math.min(1,p)))}
 var narrow=innerWidth<900;if(narrow&&y>lastY+6&&y>160)hdr.classList.add('compact');else if(y<lastY-6||y<100)hdr.classList.remove('compact');lastY=y;tick=false}
addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});addEventListener('resize',upd);upd();
if('IntersectionObserver' in window){var spy=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)links.forEach(function(a){var on=a.getAttribute('href')==='#'+e.target.id;a.classList.toggle('on',on);if(on)a.removeAttribute('aria-current');if(on)a.setAttribute('aria-current','true')})})},{rootMargin:'-35% 0px -60% 0px'});secs.forEach(function(s){var el=document.getElementById(s[0]);if(el)spy.observe(el)})}
})();
