<style>
:root{--g:#217346;--g2:#2a8a52;--hdr:#f3f3f3;--line:#d4d4d4;--line2:#e2e2e2;--sel:#1a73e8;--selbg:rgba(26,115,232,.1);--text:#1f1f1f;--muted:#5f6368;--sans:'Roboto',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;--mono:'Roboto Mono',ui-monospace,Consolas,'Liberation Mono',Menlo,monospace}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html,body{height:100%}
body{font:400 14px/1.35 var(--sans);color:var(--text);background:#fff;display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:1px}

/* title / toolbar */
.top{flex:none;background:#fff;border-bottom:1px solid var(--line)}
.title{display:flex;align-items:center;gap:10px;padding:6px 12px 2px}
.logo{flex:none;width:24px;height:28px;background:var(--g);border-radius:3px;position:relative}
.logo::after{content:'';position:absolute;left:5px;right:5px;top:8px;bottom:7px;background:repeating-linear-gradient(#fff 0 2px,transparent 2px 5px);opacity:.9}
.doc{font:500 16px var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.menu{display:flex;gap:2px;padding:0 8px 2px 46px;color:var(--muted);font-size:13px;overflow-x:auto;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu span{padding:3px 8px;white-space:nowrap}
.tools{display:flex;align-items:center;gap:6px;padding:4px 12px 6px;background:#f9fbfd;border-top:1px solid var(--line2);flex-wrap:wrap}
.tb{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;text-decoration:none;color:var(--text);font-size:13px;font-weight:500}
.tb:hover{background:#eef3f9}
.tb.p{background:var(--g);border-color:var(--g);color:#fff}.tb.p:hover{background:var(--g2)}
.tb svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}
.fbar{display:flex;align-items:stretch;border-top:1px solid var(--line);background:#fff;min-height:30px}
.nb{flex:none;width:76px;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);font:500 13px var(--sans);color:var(--text)}
.fx{flex:none;width:32px;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);font:italic 500 14px var(--mono);color:var(--muted)}
.fv{flex:1;min-width:0;padding:6px 10px;font:400 13px/1.3 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fv.wrap{white-space:normal;max-height:4.2em;overflow-y:auto}

/* grid */
.grid-wrap{flex:1;min-height:0;overflow:auto;position:relative;background:#fff;-webkit-overflow-scrolling:touch}
.sheet{display:none}.sheet.on{display:block}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px}
th,td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
thead th{position:sticky;top:0;z-index:3;background:var(--hdr);color:var(--muted);font-weight:500;height:24px;border-color:var(--line);text-align:center;user-select:none}
tbody th{position:sticky;left:0;z-index:2;background:var(--hdr);color:var(--muted);font-weight:400;width:46px;min-width:46px;text-align:center;border-color:var(--line);vertical-align:top;padding-top:4px;user-select:none;font-size:12px}
thead th.corner{left:0;z-index:4;width:46px;min-width:46px}
thead th.hl,tbody th.hl{background:#dfe5ee;color:#0b3d91;font-weight:700}
td{padding:4px 8px;vertical-align:top;min-height:24px;height:24px;overflow-wrap:anywhere;cursor:cell;position:relative;background:#fff}
td.e{background:#fff}
td.sel{outline:2px solid var(--sel);outline-offset:-2px;z-index:1;background:var(--selbg)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.ctr{text-align:center}
td.hd{background:var(--g);color:#fff;font-weight:700;border-color:#1b5e38}
td.hd.sel{background:var(--g)}
td.big{font:500 22px/1.2 var(--sans);height:auto;padding:8px}
td.lab{font-weight:700;background:#f3f6f4}
td.tot{font-weight:700;background:#e9f4ee;border-top:2px solid var(--g);color:#124d2c}
td.sec{background:#e6efe9;color:#124d2c;font-weight:700;letter-spacing:.03em}
td.bar{padding:3px 6px}
.db{display:block;height:16px;border-radius:2px;background:linear-gradient(90deg,#34a853,#7bc67e);width:var(--w);transform-origin:left;min-width:2px}
.db.l1{background:linear-gradient(90deg,#e57373,#ef9a9a)}.db.l2{background:linear-gradient(90deg,#f0a640,#f6c77a)}.db.l3{background:linear-gradient(90deg,#e7d34a,#f1e58a)}
.rept{font-family:var(--mono);font-size:12px;letter-spacing:-.5px;color:#1b6b3e;white-space:nowrap;overflow:hidden}
td a{color:#1a56c4}
.dim{color:var(--muted)}

/* fill-in animation */
.fill td:not(.e){animation:fillin .35s ease both;animation-delay:var(--d,0s)}
@keyframes fillin{from{opacity:0;background:#fff7cc}to{opacity:1}}
.fill .db{animation:grow .7s cubic-bezier(.3,.7,.2,1) both;animation-delay:calc(var(--d,0s) + .15s)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
html.still *,html.still *::before,html.still *::after{transition:none!important;animation:none!important}

/* tabs */
.tabs{flex:none;display:flex;align-items:stretch;background:var(--hdr);border-top:1px solid var(--line);min-height:40px;padding-bottom:env(safe-area-inset-bottom)}
.tabs .plus{flex:none;width:40px;display:grid;place-items:center;color:var(--muted);font-size:20px}
.tabs .list{display:flex;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs .list::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:40px;padding:0 20px;border:0;border-right:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted);font-size:14px;white-space:nowrap}
.tab:hover{background:#e8eaed}
.tab[aria-selected=true]{background:#fff;color:var(--g);font-weight:700;box-shadow:inset 0 -3px 0 var(--g)}
.stat{flex:none;align-self:center;padding:0 14px;color:var(--muted);font-size:12px;white-space:nowrap}
@media(max-width:640px){.stat,.menu,.doc small{display:none}.nb{width:56px}.tools .tb span{display:none}}

 .sheet,.sheet.on{display:block;margin-bottom:10pt;break-inside:avoid}
 .sheet::before{content:attr(data-title);display:block;font:700 12pt var(--sans);margin-bottom:3pt}
 table{width:100%!important;font-size:9pt}
 thead th,tbody th{display:none}
 td{border:.5pt solid #999;padding:2pt 4pt;height:auto;background:#fff!important;animation:none!important;opacity:1!important;color:#000!important}
 td.hd{font-weight:700;background:#ddd!important}td.tot,td.lab,td.sec{background:#eee!important;font-weight:700}
 td.sel{outline:0;background:#fff}
 .db{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#555!important}
 col{width:auto!important}
 .printhead{display:block!important}
}
.printhead{display:none}
</style>

/* date math */
function parseDates(s){
 s=String(s||'');var now=new Date(),nm=now.getFullYear()*12+now.getMonth();
 var m=s.match(/(?:(\d{1,2})\s*[\/.-]\s*)?((?:19|20)\d{2})/g)||[];
 function pm(t,end){var x=t.match(/(?:(\d{1,2})\s*[\/.-]\s*)?((?:19|20)\d{2})/);if(!x)return null;var mo=x[1]?Math.min(12,Math.max(1,+x[1]))-1:(end?11:0);return (+x[2])*12+mo}
 var a=m.length?pm(m[0],false):null,b=null;

/* ---------- sheet model ----------

function C(v,c,f){return {v:v==null?'':String(v),c:c||'',f:f}}

(function(){

tabsEl.addEventListener('click',function(e){var t=e.target.closest('.tab');if(t)showSheet(+t.id.slice(1))});
tabsEl.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowLeft'){var n=(cur+(e.key==='ArrowRight'?1:-1)+sheets.length)%sheets.length;showSheet(n);$('#t'+n).focus();e.preventDefault()}});

function select(r,c,noScroll){
 var sh=sheets[cur];r=Math.max(0,Math.min(sh.rows.length-1,r));c=Math.max(0,Math.min(sh.cols.length-1,c));
 var prev=$('.sheet.on td.sel');if(prev)prev.classList.remove('sel');
 $$('.sheet.on .hl').forEach(function(x){x.classList.remove('hl')});
 sel={r:r,c:c};
 var el=cellEl(r,c);if(!el)return;el.classList.add('sel');
 var ch=$('.sheet.on thead th[data-c="'+c+'"]'),rh=$('.sheet.on tbody th[data-r="'+r+'"]');if(ch)ch.classList.add('hl');if(rh)rh.classList.add('hl');
 $('#nb').textContent=col(c)+(r+1);
 var cell=sh.rows[r][c],fv=$('#fv'),txt='';
 if(cell){txt=cell.f||cell.v;if(cell.bar!=null&&!cell.f)txt=''}
 fv.textContent=txt;fv.classList.toggle('wrap',txt.length>90);
 if(!noScroll)keepVisible(el)}
function keepVisible(el){
 var g=gridEl,gr=g.getBoundingClientRect(),er=el.getBoundingClientRect(),hh=24,rw=46;
 if(er.top<gr.top+hh)g.scrollTop-=gr.top+hh-er.top;else if(er.bottom>gr.bottom)g.scrollTop+=er.bottom-gr.bottom;
 if(er.left<gr.left+rw)g.scrollLeft-=gr.left+rw-er.left;else if(er.right>gr.right)g.scrollLeft+=er.right-gr.right}
gridEl.addEventListener('click',function(e){
 var td=e.target.closest('td');if(td){select(+td.dataset.r,+td.dataset.c,true);return}
 var rh=e.target.closest('tbody th');if(rh)select(+rh.dataset.r,0,true);
 var ch=e.target.closest('thead th[data-c]');if(ch)select(0,+ch.dataset.c,true)});
document.addEventListener('keydown',function(e){
 if(e.target.closest&&e.target.closest('.tabs,.tools a,.tools button'))return;
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 var sh=sheets[cur],k=e.key,r=sel.r,c=sel.c,h=true;
 if(k==='ArrowDown'||k==='Enter')r++;else if(k==='ArrowUp')r--;else if(k==='ArrowRight'||(k==='Tab'&&!e.shiftKey))c++;else if(k==='ArrowLeft'||(k==='Tab'&&e.shiftKey))c--;
 else if(k==='Home'){c=0}else if(k==='End'){c=sh.cols.length-1}else if(k==='PageDown'){r+=8}else if(k==='PageUp'){r-=8}else h=false;
 if(k==='Enter'&&e.shiftKey)r-=2;
 if(h){e.preventDefault();select(r,c)}});

/* toolbar */
var IC={mail:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',phone:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',dl:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>'};
$('#tools').innerHTML=(email?'<a class="tb p" href="mailto:'+esc(email.replace(/[\s<>"]/g,''))+'">'+IC.mail+'<span>Email me</span></a>':'')+(phone?'<a class="tb" href="tel:'+esc(tel)+'">'+IC.phone+'<span>'+esc(phone)+'</span></a>':'')+'<span class="sp"></span><button type="button" class="tb" id="pdf">'+IC.dl+'<span>Download PDF</span></button>';
$('#pdf').addEventListener('click',function(){window.print()});

/* load: cells fill in when grid is visible */
var hs=location.hash.match(/^#sheet=(\d)/);
showSheet(hs&&sheets[+hs[1]]?+hs[1]:0);
if(!still&&'IntersectionObserver' in window){
 var sh0=$('.sheet.on');sh0.classList.remove('fill');
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){sh0.classList.add('fill');io.disconnect()}})},{threshold:.05});io.observe(gridEl)}
})();
</script>
