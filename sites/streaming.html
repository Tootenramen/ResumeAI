var yrs=[];jobs.forEach(function(j){(String(j.dates||'').match(/\b(19|20)\d{2}\b/g)||[]).forEach(function(y){yrs.push(+y)})});
var minY=yrs.length?Math.min.apply(null,yrs):0,curY=new Date().getFullYear(),years=minY?curY-minY:0;
var lw=['','Foundational','Working','Proficient','Advanced','Expert'];
function lvl(s){return Math.max(1,Math.min(5,Math.round(Number(s[1])||3)))}
var ranked=skills.map(function(s,i){return {n:s[0],l:lvl(s),i:i}}).sort(function(a,b){return b.l-a.l||a.i-b.i});
var IC={play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>',plus:'<svg viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round"><path d="M12 5v14M5 12h14"/></svg>',ok:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/></svg>',chk:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'};

/* ---------- nav ---------- */
var secs=[];if(jobs.length)secs.push(['experience','Episodes']);if(skills.length)secs.push(['skills','Skills']);if(certs.length)secs.push(['certs','Certifications']);if(edu.length)secs.push(['education','Education']);secs.push(['contact','My List']);
$('#navlist').innerHTML=secs.map(function(s){return '<li><a href="#'+s[0]+'">'+s[1]+'</a></li>'}).join('');

/* ---------- render ---------- */
function row(id,t,sub,tiles){return '<section class="row reveal" id="'+id+'" aria-labelledby="h-'+id+'"><h2 id="h-'+id+'">'+t+(sub?'<small>'+sub+'</small>':'')+'</h2><div class="sw"><button type="button" class="arr pv" aria-label="Scroll left" tabindex="-1">‹</button><ul class="sc" role="list">'+tiles+'</ul><button type="button" class="arr n" aria-label="Scroll right" tabindex="-1">›</button></div></section>'}
var out='<section class="hero" id="top" aria-label="Featured"><div class="bd" aria-hidden="true"><b>'+esc(initials)+'</b></div><div class="shade" aria-hidden="true"></div><div class="hc">'+
 '<p class="orig rv">A résumé original</p><h1 class="rv" style="--d:.1s">'+esc(name)+'</h1>'+
 '<div class="mt rv" style="--d:.2s"><span class="m">100% Match</span>'+(minY?'<span>'+minY+'–Present</span>':'')+'<span class="badge">HIRE-READY</span>'+(jobs.length?'<span>'+jobs.length+' Episodes</span>':'')+'<span class="hd">HD</span></div>'+
 (title?'<p class="tl rv" style="--d:.28s">'+esc(title)+'</p>':'')+(sum?'<p class="syn rv" style="--d:.36s">'+esc(sum)+'</p>':'')+
 (ranked.length?'<p class="gen rv" style="--d:.42s"><b>Genres:</b> '+ranked.slice(0,3).map(function(s){return esc(s.n)}).join(' · ')+'</p>':'')+
 '<div class="acts rv" style="--d:.5s"><button type="button" class="btn p" id="play">'+IC.play+'Play</button><button type="button" class="btn s" id="list">'+IC.plus+'My List</button></div></div></section><div class="rows">';
if(jobs.length)out+=row('experience','Career Episodes',jobs.length+' episodes · newest first',jobs.map(function(j,i){var g=String(j.dates||'').match(/\b(19|20)\d{2}\b/g)||[];
 return '<li class="tile ep e'+(i%5)+'" tabindex="0" role="listitem" style="--i:'+i+'" aria-label="'+esc((j.role||'')+(j.co?' at '+j.co:''))+'"><div class="in"><div class="no"><i>●</i>Ep. '+(jobs.length-i)+(j.loc?' · '+esc(String(j.loc).split('·').pop().trim()):'')+'</div><div><div class="co">'+esc(j.co||j.role||'')+'</div><div class="rl">'+esc(j.role||'')+'</div>'+(j.dates?'<div class="dt">'+esc(j.dates)+'</div>':'')+'</div></div>'+
 '<div class="det"><div class="ic" aria-hidden="true"><i>▶</i><i>+</i><i>✓</i></div><div class="g">98% Match <span>'+esc(j.dates||'')+(j.loc?' · '+esc(j.loc):'')+'</span></div>'+(j.text?'<p>'+esc(j.text)+'</p>':'')+'</div></li>'}).join(''));
if(skills.length)out+=row('skills','Skills Trending Now','ranked by level',ranked.map(function(s,i){var p='';for(var k=0;k<5;k++)p+='<i style="--n:'+k+'"'+(k<s.l?' class="f"':'')+'></i>';
 return '<li class="tile tp" tabindex="0" role="listitem" style="--i:'+i+'"><span class="rk" aria-hidden="true">'+(i+1)+'</span><div class="tx"><h3>'+esc(s.n)+'</h3><div class="lv">'+lw[s.l]+' · '+s.l+'/5</div><div class="pips" role="img" aria-label="'+s.l+' out of 5">'+p+'</div></div></li>'}).join(''));
if(certs.length)out+=row('certs','Certifications','awards &amp; credentials',certs.map(function(c,i){return '<li class="tile ct" tabindex="0" role="listitem" style="--i:'+i+'">'+IC.ok+'<span>'+esc(c)+'</span></li>'}).join(''));
if(edu.length)out+=row('education','Education','the origin story',edu.map(function(e,i){return '<li class="tile ed" tabindex="0" role="listitem" style="--i:'+i+'"><small>Season '+(edu.length-i)+'</small><h3>'+esc(e[0]||'')+'</h3>'+(e[2]?'<p>'+esc(e[2])+'</p>':'')+(e[1]?'<p class="d">'+esc(e[1])+'</p>':'')+'</li>'}).join(''));
if(langs.length)out+=row('languages','Audio &amp; Subtitles','available languages',langs.map(function(l,i){return '<li class="tile lg" tabindex="0" role="listitem" style="--i:'+i+'"><b>'+esc(l[0]||'')+'</b><span>'+esc(l[1]||'')+'</span></li>'}).join(''));
out+='</div><section class="ml reveal" id="contact" aria-labelledby="h-contact"><div class="chk">'+IC.chk+'</div><h2 id="h-contact">Added to My List</h2><p>Ready when you are. Reach out and let’s start the next season together.</p>'+
 '<div class="cd">'+(email?'<a href="mailto:'+esc(email)+'">'+esc(email)+'</a>':'')+(phone?'<a href="tel:'+esc(tel)+'">'+esc(phone)+'</a>':'')+'</div>'+
 '<div class="acts">'+(email?'<a class="btn p" href="mailto:'+esc(email)+'">Email me</a>':'')+'<button type="button" class="btn s" id="pdf">Download PDF</button></div></section>'+
 '<div class="fin"><span>© '+curY+' '+esc(name)+'</span><a href="#top">Back to top ↑</a></div>';
$('#app').innerHTML=out;

/* ---------- actions ---------- */
function go(id){var e=document.getElementById(id);if(e)e.scrollIntoView({behavior:still?'auto':'smooth',block:'start'})}
$('#play').addEventListener('click',function(){go(jobs.length?'experience':'skills')});
$('#list').addEventListener('click',function(){go('contact')});
[$('#pdf'),$('#pdf0')].forEach(function(b){if(b)b.addEventListener('click',function(){window.print()})});

/* ---------- rows: arrows + keyboard ---------- */
$$('.sw').forEach(function(sw){var sc=$('.sc',sw);
 $('.arr.pv',sw).addEventListener('click',function(){sc.scrollBy({left:-sc.clientWidth*.8,behavior:still?'auto':'smooth'})});
 $('.arr.n',sw).addEventListener('click',function(){sc.scrollBy({left:sc.clientWidth*.8,behavior:still?'auto':'smooth'})})});
function focusTile(t){if(!t)return;t.focus({preventScroll:true});var sc=t.parentNode,l=t.offsetLeft-(sc.clientWidth-t.offsetWidth)/2;sc.scrollTo({left:Math.max(0,l),behavior:still?'auto':'smooth'});var r=t.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-10)t.scrollIntoView({block:'center',behavior:still?'auto':'smooth'})}
document.addEventListener('keydown',function(e){var t=e.target&&e.target.closest&&e.target.closest('.tile');if(!t)return;var k=e.key,sib=null;
 if(k==='ArrowRight')sib=t.nextElementSibling;else if(k==='ArrowLeft')sib=t.previousElementSibling;else if(k==='Home')sib=t.parentNode.firstElementChild;else if(k==='End')sib=t.parentNode.lastElementChild;
 else if(k==='ArrowDown'||k==='ArrowUp'){var rows=$$('.sc'),ri=rows.indexOf(t.parentNode),ni=ri+(k==='ArrowDown'?1:-1),idx=Array.prototype.indexOf.call(t.parentNode.children,t);if(rows[ni]){var ch=rows[ni].children;sib=ch[Math.min(idx,ch.length-1)]}}
 else if(k==='Enter'||k===' '){e.preventDefault();t.classList.toggle('open');return}
 else if(k==='Escape'){t.classList.remove('open');return}
 if(sib){e.preventDefault();focusTile(sib)}});
$$('.tile').forEach(function(t){t.addEventListener('click',function(){var was=t.classList.contains('open');$$('.tile.open').forEach(function(o){o.classList.remove('open')});if(!was)t.classList.add('open')})});
document.addEventListener('click',function(e){if(!e.target.closest('.tile'))$$('.tile.open').forEach(function(o){o.classList.remove('open')})});

/* ---------- reveal ---------- */
var targets=$$('.reveal');
if(still||!('IntersectionObserver' in window))targets.forEach(function(t){t.classList.add('in')});
else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.1,rootMargin:'0px 0px -5% 0px'});targets.forEach(function(t){io.observe(t)})}

/* ---------- bar + spy ---------- */
var bar=$('#bar'),links=$$('#navlist a');
function upd(){bar.classList.toggle('solid',scrollY>40)}
addEventListener('scroll',upd,{passive:true});upd();
if('IntersectionObserver' in window){var spy=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)links.forEach(function(a){var on=a.getAttribute('href')==='#'+e.target.id;a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current')})})},{rootMargin:'-35% 0px -60% 0px'});secs.forEach(function(s){var el=document.getElementById(s[0]);if(el)spy.observe(el)})}
})();
</script>
</body>
</html>
