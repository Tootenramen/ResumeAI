*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}

.wrap{max-width:1920px;margin:0 auto;padding:0 var(--m)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g)}

.logo::before{content:"";width:12px;height:12px;background:var(--red);flex:none}
.bar nav{display:flex;gap:clamp(12px,2vw,30px)}
.bar nav a{font:600 .74rem var(--f);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--ink);padding:8px 0;position:relative;white-space:nowrap}
.bar nav a span{color:var(--mute);margin-right:6px;font-weight:500}
.bar nav a::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:2px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.bar nav a:hover::after,.bar nav a[aria-current=true]::after{transform:none}
.tools{display:flex;gap:8px;align-items:center}
.tbtn{font:600 .72rem var(--f);letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid var(--ink);color:var(--ink);min-height:36px;padding:0 12px;cursor:pointer}
.tbtn[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.menu{display:none}
.prog{position:absolute;left:0;bottom:-1px;height:3px;width:100%;background:var(--red);transform:scaleX(0);transform-origin:left}

  .gridbtn{display:none}
  .menu{display:inline-flex;align-items:center;min-height:44px;min-width:76px;justify-content:center}

}

const email=has(D.email)?String(D.email).trim():'';
const phone=has(D.phone)?String(D.phone).trim():'';
const L5=n=>Math.max(1,Math.min(5,Math.round(Number(n))||3));
const yr=new Date().getFullYear();

const secs=[];
if(jobs.length)secs.push(['experience','Experience',jobs.length]);
if(skills.length)secs.push(['skills','Skills',skills.length]);
if(certs.length)secs.push(['certs','Certifications',certs.length]);
if(edu.length)secs.push(['education','Education',edu.length]);
if(langs.length)secs.push(['languages','Languages',langs.length]);
const hasC=!!(email||phone);
const navItems=secs.map(s=>[s[0],s[1]]);
if(hasC)navItems.push(['contact','Contact']);

/* name lines */
let words=name.split(/\s+/).filter(Boolean),lines=words;
if(words.length>3){const h=Math.ceil(words.length/2);lines=[words.slice(0,h).join(' '),words.slice(h).join(' ')]}

function shead(i,id,title,count){
  return '<div class="rule" data-io></div><div class="shead" data-io><div class="lab fade">('+pad(i+1)+') '+esc(title)+'</div><div class="num mk" data-kw data-lo="300" data-hi="900" data-count="'+count+'" aria-hidden="true"><span class="fi">'+pad(count)+'</span></div><h2 class="mk" id="h-'+id+'" data-kw data-lo="300" data-hi="800" data-fit data-max="150"><span class="fi">'+esc(title)+'</span></h2></div>';
}
const btns=(email?'<a class="btn solid" href="mailto:'+esc(email)+'">Email me <b aria-hidden="true">→</b></a>':'')+'<button class="btn" type="button" data-pdf>Download PDF <b aria-hidden="true">↓</b></button>';

let h='<div class="gridlines" aria-hidden="true"><div>'+'<i></i>'.repeat(12)+'</div></div>';
h+='<header class="bar" id="bar"><div class="wrap"><a class="logo" href="#top" aria-label="'+esc(name)+' — back to top">'+esc(name)+'</a><nav id="nav" aria-label="Sections">'+navItems.map((n,i)=>'<a href="#'+n[0]+'"><span>'+pad(i+1)+'</span>'+esc(n[1])+'</a>').join('')+'</nav><div class="tools"><button class="tbtn gridbtn" type="button" id="gridbtn" aria-pressed="false" aria-label="Toggle 12-column grid overlay">Grid</button><button class="tbtn menu" type="button" id="menu" aria-expanded="false" aria-controls="nav" aria-label="Toggle menu">Menu</button></div></div><i class="prog" aria-hidden="true"></i></header>';
h+='<main id="main"><section class="hero" id="top" aria-label="Introduction"><div class="wrap">';
h+='<div class="hmeta"><span>Résumé — '+yr+'</span>'+(email?'<a href="mailto:'+esc(email)+'" class="red">'+esc(email)+'</a>':'<span></span>')+'</div>';
h+='<h1 class="name" id="name" data-fit>'+lines.map((l,i)=>'<span class="ln"><span class="fi" style="--i:'+i+'">'+esc(l)+'</span></span>').join('')+'</h1>';
h+='<div class="hbody grid"><div class="g lab fade" style="--c:1/4;align-self:start;padding-top:.7em">Profile</div><div class="g" style="--c:4/13">';
if(has(D.title))h+='<p class="role fade" style="--d:.5s">'+esc(D.title)+'</p>';
if(has(D.summary))h+='<p class="sum" id="sum">'+String(D.summary).trim().split(/\s+/).map(w=>'<span class="sw">'+esc(w)+'</span>').join(' ')+'</p>';
h+='<div class="cta fade" style="--d:.7s">'+btns+'</div></div></div></div></section>';

/* marquee */
if(skills.length){
  let set='',n=0;
  while(n<90){skills.forEach(s=>{set+='<span>'+esc(s[0])+'</span><b>/</b>';n+=String(s[0]).length+2})}
  h+='<div class="marq" aria-hidden="true" id="marq"><div class="mt"><div class="mi">'+set+'</div><div class="mi">'+set+'</div></div></div>';
}

let si=0;
secs.forEach(s=>{
  const id=s[0];let body='';
  if(id==='experience')body=jobs.map((j,i)=>'<div class="rule thin" data-io></div><article class="row job fade" data-io><div class="g dt" style="--c:1/3"><em>'+pad(i+1)+'</em>'+(has(j.dates)?esc(j.dates):'')+(has(j.loc)?'<small>'+esc(j.loc)+'</small>':'')+'</div><div class="g" style="--c:3/8">'+(has(j.role)?'<h3>'+esc(j.role)+'</h3>':'')+(has(j.co)?'<div class="co">'+esc(j.co)+'</div>':'')+'</div><div class="g" style="--c:8/13">'+(has(j.text)?'<p>'+esc(j.text)+'</p>':'')+'</div></article>').join('')+'<div class="rule thin" data-io></div>';
  if(id==='skills')body=skills.map((k,i)=>{const L=L5(k[1]);let sq='';for(let q=0;q<5;q++)sq+='<i class="'+(q<L?'f':'')+'" style="--k:'+q+'"></i>';return '<div class="rule thin" data-io></div><div class="row skill" data-io role="img" aria-label="'+esc(k[0])+': '+L+' out of 5"><div class="g ix" style="--c:1/2">'+pad(i+1)+'</div><div class="g" style="--c:2/9"><h3 data-kw data-lo="400" data-hi="800">'+esc(k[0])+'</h3></div><div class="g" style="--c:9/13"><div class="sq">'+sq+'<em>'+L+'/5</em></div></div></div>'}).join('')+'<div class="rule thin" data-io></div>';
  if(id==='certs')body='<div class="certs">'+certs.map((c,i)=>{const m=String(c).match(/^(.*?)\s*\(([^()]*)\)\s*$/);const t=m&&m[1]?m[1]:String(c),y=m&&m[1]?m[2]:'';return '<div><div class="rule thin" data-io></div><div class="cert fade" data-io><span class="ix">'+pad(i+1)+'</span><b>'+esc(t)+'</b>'+(y?'<small>'+esc(y)+'</small>':'')+'</div></div>'}).join('')+'</div><div class="rule thin" data-io></div>';
  if(id==='education')body=edu.map(e=>'<div class="rule thin" data-io></div><div class="row edu fade" data-io><div class="g dt" style="--c:1/4">'+(has(e[1])?esc(e[1]):'')+'</div><div class="g" style="--c:4/9">'+(has(e[0])?'<h3>'+esc(e[0])+'</h3>':'')+'</div><div class="g" style="--c:9/13">'+(has(e[2])?'<p>'+esc(e[2])+'</p>':'')+'</div></div>').join('')+'<div class="rule thin" data-io></div>';
  if(id==='languages')body='<div class="langs">'+langs.map(l=>'<div><div class="rule thin" data-io></div><div class="lang fade" data-io><h3>'+esc(l[0])+'</h3>'+(has(l[1])?'<p>'+esc(l[1])+'</p>':'')+'</div></div>').join('')+'</div>';
  h+='<section class="sec" id="'+id+'" aria-labelledby="h-'+id+'"><div class="wrap">'+shead(si,id,s[1],s[2])+body+'</div></section>';
  si++;
});
if(hasC){
  h+='<section class="dark" id="contact" aria-labelledby="h-contact"><div class="wrap"><div class="rule" data-io></div><div class="shead" data-io><div class="lab fade">('+pad(si+1)+') Contact</div><h2 class="mk" id="h-contact" data-kw data-lo="300" data-hi="800" data-fit data-max="150" style="margin-top:20px"><span class="fi">Let’s talk</span></h2></div>';
  if(email)h+='<a class="big mk mail" data-io data-fit data-max="130" data-w="800" href="mailto:'+esc(email)+'"><span class="fi">'+esc(email)+'</span></a>';
  if(phone)h+='<a class="big mk tel" data-io data-fit data-max="90" data-w="300" href="tel:'+esc(phone.replace(/[^\d+]/g,''))+'"><span class="fi">'+esc(phone)+'</span></a>';
  h+='<div class="cta fade" data-io>'+btns+'</div>';
}else h+='<section class="dark"><div class="wrap">';
h+='<div class="foot"><span>© '+yr+' '+esc(name)+'</span><a href="#top">Back to top ↑</a></div></div></section></main>';
$('#app').innerHTML=h;

/* ---------- behaviour ---------- */
$$('[data-pdf]').forEach(b=>b.addEventListener('click',()=>window.print()));
const bar=$('#bar'),menu=$('#menu'),nav=$('#nav');
function closeMenu(){bar.classList.remove('open');document.body.classList.remove('lock');menu.setAttribute('aria-expanded','false');menu.textContent='Menu'}
menu.addEventListener('click',()=>{const o=bar.classList.toggle('open');document.body.classList.toggle('lock',o);menu.setAttribute('aria-expanded',o);menu.textContent=o?'Close':'Menu'});
$$('a',nav).forEach(a=>a.addEventListener('click',closeMenu));
const gb=$('#gridbtn');
function toggleGrid(){const on=document.body.classList.toggle('showgrid');gb.setAttribute('aria-pressed',on)}
gb.addEventListener('click',toggleGrid);
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&bar.classList.contains('open'))closeMenu();
  if((e.key==='g'||e.key==='G')&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||''))toggleGrid();
});
addEventListener('resize',()=>{if(innerWidth>1040&&bar.classList.contains('open'))closeMenu()});

/* fit text to container */
function fitAll(){
  $$('[data-fit]').forEach(el=>{
    const fis=$$('.fi',el);if(!fis.length)return;
    const isName=el.id==='name';
    const prevW=el.style.fontWeight;
    el.style.fontSize='100px';
    el.style.fontWeight=isName?900:(el.dataset.w||el.dataset.hi||800);
    let w=0;fis.forEach(f=>{w=Math.max(w,f.offsetWidth)});
    const avail=el.clientWidth;
    let size=w?avail/w*100*.995:60;
    let mx=+el.dataset.max||150;
    if(isName){mx=Math.max(70,innerHeight*.6/fis.length)}
    el.style.fontSize=Math.max(14,Math.min(mx,size)).toFixed(1)+'px';
    el.style.fontWeight=isName?(el.style.fontWeight):(el.dataset.w||prevW||'');
    if(isName)el.style.fontWeight=900;
  });
}
let fr=0;const refit=()=>{cancelAnimationFrame(fr);fr=requestAnimationFrame(()=>{fitAll();kinetic()})};
fitAll();
addEventListener('resize',refit);
if(document.fonts){document.fonts.ready.then(refit);document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',refit)}
addEventListener('load',refit);

/* reveal */
function countUp(el){
  const to=+el.dataset.count,fi=$('.fi',el);if(!fi||RM)return;
  const t0=performance.now()+300,dur=1500;
  fi.textContent=pad(0);
  (function f(t){if(t<t0){requestAnimationFrame(f);return}const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);fi.textContent=pad(Math.round(to*e));if(p<1)requestAnimationFrame(f)})(performance.now());
}
const nameEl=$('#name');
$$('.hero .fade').forEach(e=>e.classList.add('in'));
const ios=$$('[data-io]');
if('IntersectionObserver' in window&&!RM){
  const io=new IntersectionObserver(es=>es.forEach(en=>{
    if(!en.isIntersecting)return;
    const t=en.target;t.classList.add('in');
    $$('.fade,.mk',t).forEach(x=>x.classList.add('in'));
    $$('[data-count]',t).forEach(countUp);
    io.unobserve(t);
  }),{threshold:.08,rootMargin:'0px 0px -4% 0px'});
  ios.forEach(e=>io.observe(e));
  requestAnimationFrame(()=>requestAnimationFrame(()=>nameEl.classList.add('in')));
  setTimeout(()=>nameEl.classList.add('in'),1200);
}else{
  ios.forEach(e=>{e.classList.add('in');$$('.fade,.mk',e).forEach(x=>x.classList.add('in'))});
  $$('.fade,.mk').forEach(x=>x.classList.add('in'));nameEl.classList.add('in');
}
/* name lines use .in on h1 => children .fi translate */

/* kinetic weight (scroll position) */
const kws=$$('[data-kw]'),vis=new Set();
if(!RM&&'IntersectionObserver' in window){
  const ko=new IntersectionObserver(es=>es.forEach(en=>{en.isIntersecting?vis.add(en.target):vis.delete(en.target)}),{rootMargin:'10% 0px'});
  kws.forEach(k=>ko.observe(k));
}
const sw=$$('.sw'),sum=$('#sum');
function kinetic(){
  if(RM)return;
  const vh=innerHeight;
  vis.forEach(el=>{
    const r=el.getBoundingClientRect(),c=(r.top+r.height/2)/vh;
    const p=Math.max(0,1-Math.abs(c-.5)/.6),e=p*p*(3-2*p);
    const lo=+el.dataset.lo,hi=+el.dataset.hi;
    el.style.fontWeight=Math.round(lo+(hi-lo)*e);
  });
  /* hero name gets lighter as you scroll away */
  if(nameEl){const p=Math.min(1,scrollY/(vh*.9));nameEl.style.fontWeight=Math.round(900-p*680)}
  if(sum&&sw.length){
    const r=sum.getBoundingClientRect();
    const p=Math.max(0,Math.min(1,(vh*1.02-r.top)/(vh*.5+r.height*.3)));
    const on=Math.round(p*sw.length*1.05);
    for(let i=0;i<sw.length;i++){const s=i<on;if(s!==sw[i]._on){sw[i]._on=s;sw[i].classList.toggle('on',s)}}
  }
}
/* scroll bookkeeping + marquee velocity */
const prog=$('.prog');
let lastY=scrollY,vel=0,dir=1,ticking=false,lastT=performance.now(),mx=0,mv=60,mvis=true;
const marq=$('#marq'),mt=marq&&$('.mt',marq),mi=marq&&$('.mi',marq);
function onScroll(){
  ticking=false;
  const max=document.documentElement.scrollHeight-innerHeight;
  prog.style.transform='scaleX('+(max>0?Math.min(1,scrollY/max):0)+')';
  kinetic();
}
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(onScroll)}},{passive:true});
if(marq&&!RM){
  if('IntersectionObserver' in window)new IntersectionObserver(es=>{mvis=es[0].isIntersecting}).observe(marq);
  (function loop(t){
    const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
    const dy=scrollY-lastY;lastY=scrollY;
    if(Math.abs(dy)>1)dir=dy>0?1:-1;
    vel+=(Math.abs(dy)/Math.max(dt,.001)-vel)*.1;
    if(mvis){
      const target=dir*(70+Math.min(vel,3500)*.35);
      mv+=(target-mv)*.07;
      const w=mi.offsetWidth;
      mx-=mv*dt;
      if(w){mx=((mx%w)-w)%w}
      mt.style.transform='translate3d('+mx.toFixed(1)+'px,0,0)';
    }
    requestAnimationFrame(loop);
  })(performance.now());
}
/* active nav */
if('IntersectionObserver' in window){
  const no=new IntersectionObserver(es=>es.forEach(en=>{
    if(en.isIntersecting){$$('a',nav).forEach(a=>a.removeAttribute('aria-current'));const a=$('a[href="#'+en.target.id+'"]',nav);if(a)a.setAttribute('aria-current','true')}
  }),{rootMargin:'-45% 0px -50% 0px'});
  navItems.forEach(n=>{const s=$('#'+n[0]);if(s)no.observe(s)});
}
onScroll();
})();
</script>
</body>
</html>
