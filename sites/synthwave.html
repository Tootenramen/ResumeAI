}

var S=function(v){return v==null?'':String(v).trim()};
var arr=function(v){return Array.isArray(v)?v:[]};
var D={name:S(DATA.name)||'Your Name',title:S(DATA.title),summary:S(DATA.summary),email:S(DATA.email),phone:S(DATA.phone),
  jobs:arr(DATA.jobs).filter(function(j){return j&&typeof j==='object'}),
  skills:arr(DATA.skills).filter(function(s){return Array.isArray(s)&&S(s[0])}),
  certs:arr(DATA.certs).map(S).filter(Boolean),
  edu:arr(DATA.edu).filter(function(e){return Array.isArray(e)&&e.some(S)}),
  langs:arr(DATA.langs).filter(function(l){return Array.isArray(l)&&S(l[0])})};
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var STATIC=/[?&]static\b/.test(location.search);
var CALM=RM||STATIC||!('IntersectionObserver' in window);
var root=document.documentElement;
if(STATIC)root.classList.add('static');
if(!CALM)root.classList.add('js');
function $(s){return document.querySelector(s)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function mail(){return 'mailto:'+D.email.replace(/[\s<>"]/g,'')}
function tel(){return 'tel:'+D.phone.replace(/[^0-9+]/g,'')}
function rv(e,cls,d){e.classList.add('rv');if(cls)e.classList.add(cls);if(d)e.style.setProperty('--d',d+'s');return e}

/* meta */
document.title=D.name+(D.title?' — '+D.title:'');
var desc=(D.summary||D.title).slice(0,180);
[['meta[name=description]',desc],['meta[property="og:title"]',document.title],['meta[property="og:description"]',desc],['meta[name="twitter:title"]',document.title],['meta[name="twitter:description"]',desc]].forEach(function(p){var m=$(p[0]);if(m)m.setAttribute('content',p[1])});
var yr=new Date().getFullYear();
$('#brand').textContent=D.name.split(/\s+/).map(function(w){return w[0]}).join('').slice(0,3).toUpperCase()+' // '+(D.name.split(/\s+/)[0]);
$('#tag').textContent='Résumé · '+yr;

/* hero */
(function(){
  var h=$('#name');h.setAttribute('aria-label',D.name);
  var letters=[];
  D.name.split(/\s+/).forEach(function(w){var s=el('span','w');s.setAttribute('aria-hidden','true');w.split('').forEach(function(ch){var l=el('span',null,ch);s.appendChild(l);letters.push(l)});h.appendChild(s);h.appendChild(document.createTextNode(' '))});
  if(letters.length>3){letters[1].classList.add('f1');letters[Math.min(letters.length-2,Math.floor(letters.length*.65))].classList.add('f2')}
  if(D.title)$('#title').textContent=D.title;else $('#title').remove();
  var c=$('#cta');
  if(D.email){var a=el('a','btn p','Email me');a.href=mail();c.appendChild(a)}
  var p=el('button','btn c','Download PDF');p.type='button';p.addEventListener('click',function(){window.print()});c.appendChild(p);
  /* stars */
  var sky=$('#sky'),n=70;
  var st=el('div');st.style.cssText='position:absolute;inset:0';
  var seed=7;function r(){seed=(seed*16807)%2147483647;return seed/2147483647}
  for(var i=0;i<n;i++){var s=el('span','stars');s.style.left=(r()*100)+'%';s.style.top=(r()*72)+'%';var z=r()<.2?3:2;s.style.width=s.style.height=z+'px';s.style.animationDelay=(-r()*4)+'s';s.style.animationDuration=(2+r()*4)+'s';st.appendChild(s)}
  sky.insertBefore(st,sky.firstChild);window.__stars=st;
})();

/* sections */
var main=$('#main'),navItems=[];
var idx=0;
function mk(id,label,cls,nav){
  idx++;var s=el('section','s'+(cls?' '+cls:''));s.id=id;s.setAttribute('aria-labelledby',id+'-h');
  var w=el('div','wrap');s.appendChild(w);
  var h=el('h2','sh');h.id=id+'-h';h.appendChild(el('span','n',String(idx).padStart(2,'0')+' //'));h.appendChild(el('span','t',label));rv(h);
  w.appendChild(h);main.appendChild(s);navItems.push([id,nav||label]);return w}

if(D.summary){var w=mk('about','About');var p=el('div','panel cy');p.appendChild(el('p','lead',D.summary));rv(p);w.appendChild(p)}

if(D.jobs.length){var w=mk('experience','Experience','bgfx');var ul=el('ol','tl');
  D.jobs.forEach(function(j,i){
    var li=el('li');var cur=/present|current|now/i.test(S(j.dates));if(cur)li.className='cur';
    li.appendChild(el('span','node'));li.lastChild.setAttribute('aria-hidden','true');
    var c=el('article','panel');
    if(S(j.dates))c.appendChild(el('div','dates',S(j.dates)));
    c.appendChild(el('h3',null,S(j.role)||'Role'));
    if(S(j.co)||S(j.loc)){var co=el('p','co',S(j.co));if(S(j.loc)){co.appendChild(el('span',null,(S(j.co)?'  ·  ':'')+S(j.loc)))}c.appendChild(co)}
    if(S(j.text))c.appendChild(el('p','tx',S(j.text)));
    li.appendChild(c);rv(li,null,0);ul.appendChild(li)});
  w.appendChild(ul)}

if(D.skills.length){var w=mk('skills','Skills');var g=el('div','panel');var sg=el('div','skills');
  D.skills.forEach(function(s,i){
    var lv=Math.max(0,Math.min(5,Math.round(+s[1]||0)));
    var d=el('div','sk');d.setAttribute('role','img');d.setAttribute('aria-label',S(s[0])+': '+lv+' of 5');
    var t=el('div','top');t.appendChild(el('span','nm',S(s[0])));t.appendChild(el('span','lv','LVL '+lv+'/5'));d.appendChild(t);
    var sgs=el('div','segs');for(var k=0;k<5;k++){var sg1=el('span','seg'+(k<lv?' on':''));sg1.style.setProperty('--sd',(k*.12+.15)+'s');sgs.appendChild(sg1)}
    d.appendChild(sgs);sg.appendChild(d);d.classList.add('rvs')});
  g.appendChild(sg);rv(g);w.appendChild(g)}

if(D.certs.length){var w=mk('certs','Certifications','bgfx','Certs');var g=el('div','grid g-certs');
  D.certs.forEach(function(c,i){var d=el('div','cert');d.appendChild(el('i'));d.lastChild.setAttribute('aria-hidden','true');d.appendChild(el('span',null,c));rv(d,null,Math.min(i%3,2)*.08);g.appendChild(d)});w.appendChild(g)}

if(D.edu.length){var w=mk('education','Education');var g=el('div','grid g-edu');
  D.edu.forEach(function(e,i){var d=el('article','panel card');d.appendChild(el('h3',null,S(e[0])||'Degree'));if(S(e[2]))d.appendChild(el('div','sc',S(e[2])));if(S(e[1]))d.appendChild(el('div','dt',S(e[1])));rv(d,null,i*.1);g.appendChild(d)});w.appendChild(g)}

if(D.langs.length){var w=mk('languages','Languages','bgfx');var g=el('div','grid g-edu g-lang');
  D.langs.forEach(function(l,i){var d=el('div','panel cy lang');d.appendChild(el('b',null,S(l[0])));if(S(l[1]))d.appendChild(el('span',null,S(l[1])));rv(d,null,i*.1);g.appendChild(d)});w.appendChild(g)}

if(D.email||D.phone){var w=mk('contact','Contact');var p=el('div','panel contact');
  p.appendChild(el('p','sr','Get in touch'));
  var big=el('p','big');big.appendChild(document.createTextNode("Let's build something. "));
  if(D.email){var a=el('a',null,D.email);a.href=mail();var br=el('div');br.appendChild(a);big.appendChild(br)}
  p.appendChild(big);
  if(D.phone){var ph=el('p','ph');var a2=el('a',null,D.phone);a2.href=tel();ph.appendChild(a2);p.appendChild(ph)}
  var cta=el('div','cta');
  if(D.email){var b=el('a','btn p','Email me');b.href=mail();cta.appendChild(b)}
  var pb=el('button','btn c','Download PDF');pb.type='button';pb.addEventListener('click',function(){window.print()});cta.appendChild(pb);
  p.appendChild(cta);rv(p);w.appendChild(p)}

$('#footTxt').textContent='© '+yr+' '+D.name+' · Built on the Neon Grid';
var links=$('#links');
navItems.forEach(function(n){var a=el('a',null,n[1]);a.href='#'+n[0];a.dataset.t=n[0];links.appendChild(a)});

/* reveal */
var rvs=[].slice.call(document.querySelectorAll('.rv,.rvs'));
function showAll(){rvs.forEach(function(e){e.classList.add('in')})}
if(CALM)showAll();
else{
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -6% 0px'});
  rvs.forEach(function(e){io.observe(e)});
  setTimeout(function(){/* safety net */ if(!document.querySelector('.rv.in'))showAll()},4000);
}
/* nav active */
if('IntersectionObserver' in window){
  var cur=null;var io2=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){cur=e.target.id;[].forEach.call(links.children,function(a){if(a.dataset.t===cur)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current')})}})},{rootMargin:'-45% 0px -50% 0px'});
  [].forEach.call(document.querySelectorAll('section.s'),function(s){io2.observe(s)});
}

/* ---------- grid canvas ---------- */
var cv=$('#grid'),ctx=cv.getContext&&cv.getContext('2d'),W=0,H=0,off=0,heroVisible=true,speedBoost=0,raf=0,last=0;
function size(){var dpr=Math.min(window.devicePixelRatio||1,2),r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=Math.max(1,Math.round(W*dpr));cv.height=Math.max(1,Math.round(H*dpr));ctx.setTransform(dpr,0,0,dpr,0,0)}
function drawGrid(){
  if(!ctx||!W)return;ctx.clearRect(0,0,W,H);
  var vx=W/2,K=14,i,y,f;
  var cols=Math.ceil(W/ (W<600?46:70))+10;
  for(var pass=0;pass<2;pass++){
    ctx.lineWidth=pass?1.3:5;ctx.strokeStyle=pass?'rgba(255,120,200,.95)':'rgba(255,46,136,.22)';
    ctx.beginPath();
    for(i=-cols;i<=cols;i++){var xb=vx+i*(W<600?46:70)*(H/150>1?1.6:1.6);ctx.moveTo(vx+i*2,0);ctx.lineTo(xb,H)}
    for(i=0;i<K;i++){f=(i+off)/K;y=H*Math.pow(f,2.6);ctx.moveTo(0,y);ctx.lineTo(W,y)}
    ctx.stroke();
  }
  var g=ctx.createLinearGradient(0,0,0,H*.45);g.addColorStop(0,'rgba(42,10,82,1)');g.addColorStop(1,'rgba(42,10,82,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H*.45);
}
function loop(t){
  raf=0;if(!heroVisible||document.hidden)return;
  var dt=Math.min(.05,(t-last)/1000||.016);last=t;
  speedBoost*=.92;off=(off+dt*(.35+speedBoost))%1;drawGrid();raf=requestAnimationFrame(loop)}
function kick(){if(!raf&&!RM&&!STATIC){last=performance.now();raf=requestAnimationFrame(loop)}}
if(ctx){size();drawGrid();
  var rs;window.addEventListener('resize',function(){clearTimeout(rs);rs=setTimeout(function(){size();drawGrid()},120)});
  if('IntersectionObserver' in window)new IntersectionObserver(function(es){heroVisible=es[0].isIntersecting;if(heroVisible)kick()}).observe($('#top'));
  document.addEventListener('visibilitychange',kick);kick()}

/* ---------- scroll: parallax, progress, warp ---------- */
var sun=$('#sun'),hin=$('#heroIn'),nav=$('#nav'),prog=$('#prog'),ticking=false,lastY=window.scrollY,lastT=performance.now();
function onScroll(){
  var y=window.scrollY,now=performance.now(),vh=window.innerHeight;
  var v=Math.abs(y-lastY)/Math.max(16,now-lastT);lastY=y;lastT=now;speedBoost=Math.min(5,Math.max(speedBoost,v*.9));if(speedBoost>.3)kick();
  nav.classList.toggle('solid',y>40);
  var max=document.documentElement.scrollHeight-vh;prog.style.transform='scaleX('+(max>0?Math.min(1,y/max):0)+')';
  if(!RM&&y<vh*1.1){
    sun.style.transform='translate3d(-50%,calc(28% + '+(y*.42)+'px),0)';
    window.__stars.style.transform='translate3d(0,'+(y*.12)+'px,0)';
    hin.style.transform='translate3d(0,'+(y*.22)+'px,0)';hin.style.opacity=Math.max(0,1-y/(vh*.7));
  }
  ticking=false}
window.addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(onScroll)}},{passive:true});
onScroll();
})();
</script>
</body>
</html>
