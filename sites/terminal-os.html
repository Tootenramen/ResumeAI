  if(c==='all'){for(var i=0;i<all.length;i++){await emit(CMD[all[i]]([]))}return}
  if(c==='pdf'){await emit([L('opening print dialog — choose "Save as PDF".','dim')]);setTimeout(function(){window.print()},60);return}
  if(c==='email'){if(D.email){await emit([L('opening mail client ...','dim')]);location.href=mailHref()}else await emit([L('no email configured.','err')]);return}
  if(CMD[c]){await emit(CMD[c](args));return}
  await emit([L('command not found: '+raw.slice(0,40)+" — type 'help'",'err')])}
function enqueue(raw,anim){pending++;chain=chain.then(function(){return exec(raw,anim)}).catch(function(e){console.error(e)}).then(function(){pending--;if(pending<=0){skip=INSTANT;auto=false;$('#skip').classList.add('gone');stickBottom()}})}
var chain=Promise.resolve();

/* ---------- boot ---------- */
async function boot(){
  if(!INSTANT){
    var lines=[['ROOT-SHELL BIOS v1.337   (c) 1985–'+new Date().getFullYear(),'acc'],['Memory test ........ 65536K OK','dim'],['Detecting storage ... /dev/resume0 found','dim'],
      ['[  OK  ] Started network time sync','ok'],['[  OK  ] Mounted /home/'+user+'/resume.dat','ok'],['[  OK  ] Loaded keyring: trusted','ok'],['[ WARN ] Employer firewall: 1 offer waiting','warn'],['[  OK  ] Reached target: hire-me.target','ok']];
    for(var i=0;i<lines.length&&!skip;i++){put(L(lines[i][0],lines[i][1]));await wait(110)}
    if(!skip){var pb=L('','dim');put(pb);for(var k=0;k<=24&&!skip;k++){pb.textContent='decrypting profile  ['+'█'.repeat(k)+'░'.repeat(24-k)+'] '+Math.round(k/24*100)+'%';await wait(38)}}
    out.textContent='';
  }
  put(L('Root Shell 1.0 — '+D.name+(D.title?' · '+D.title:''),'dim'));
  put(L('login: visitor   (auto-login, no password)','dim'));
}
function startup(){
  pending++;
  chain=chain.then(boot).catch(console.error).then(function(){pending--;
    var cmds=['whoami','experience','skills','certs','education','languages','contact'];
    cmds.forEach(function(c,i){pending++;chain=chain.then(function(){return exec(c,true)}).catch(console.error).then(function(){pending--;if(pending<=0)done()})});
  });
}
function done(){
  skip=INSTANT;auto=false;$('#skip').classList.add('gone');
  put(L("── session ready ──  type 'help' or tap a command below. Hint: try 'sudo hire "+user+"'.",'dim first'));
  stickBottom()}

/* ---------- input ---------- */
var hist=[],hi=0;
$('#pl').addEventListener('submit',function(e){e.preventDefault();var v=inp.value;inp.value='';if(!v.trim())return;hist.push(v);hi=hist.length;
  if(pending>0)skip=true;
  pending++;chain=chain.then(function(){return exec(v,false)}).catch(console.error).then(function(){pending--;if(pending<=0){done2()}});
  stickBottom()});
function done2(){skip=INSTANT;auto=false;stickBottom()}
inp.addEventListener('keydown',function(e){
  if(e.key==='ArrowUp'){e.preventDefault();if(hi>0){hi--;inp.value=hist[hi]}}
  else if(e.key==='ArrowDown'){e.preventDefault();if(hi<hist.length-1){hi++;inp.value=hist[hi]}else{hi=hist.length;inp.value=''}}
  else if(e.key==='Tab'){e.preventDefault();var v=inp.value.toLowerCase();if(!v)return;var m=NAMES.filter(function(n){return n.indexOf(v)===0});if(m.length)inp.value=m[0]+(m.length===1?' ':'')}
  else if(e.key==='l'&&e.ctrlKey){e.preventDefault();out.textContent=''}
});
/* skip intro on any key / tap while auto-playing */
function skipIntro(){if(auto&&pending>0){skip=true;$('#skip').classList.add('gone')}}
document.addEventListener('keydown',skipIntro);document.addEventListener('pointerdown',skipIntro);
var fine=window.matchMedia&&matchMedia('(pointer:fine)').matches;
if(fine){scr.addEventListener('click',function(e){if(!String(getSelection()).length&&!e.target.closest('a,button'))inp.focus()});inp.focus()}

/* chips */
var chipsEl=$('#chips');
['help','about','experience','skills','certs','education','languages','contact','all','theme','clear'].forEach(function(c){
  var b=el('button','chip',c);b.type='button';b.addEventListener('click',function(){if(pending>0)skip=true;enqueue(c,false);if(fine)inp.focus()});chipsEl.appendChild(b)});
var pdfChip=el('button','chip','pdf');pdfChip.type='button';pdfChip.addEventListener('click',function(){window.print()});chipsEl.appendChild(pdfChip);
if(D.email){var ec=el('a','chip','email');ec.href=mailHref();chipsEl.appendChild(ec)}

/* uptime */
var t0=Date.now();setInterval(function(){var s=Math.floor((Date.now()-t0)/1000);$('#up').textContent='up '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);

/* ---------- print version ---------- */
(function(){
  var P=$('#print');
  function add(tag,txt,cls,parent){var e=el(tag,cls,txt);(parent||P).appendChild(e);return e}
  add('h1',D.name);if(D.title)add('div',D.title,'t');
  var c=[D.email,D.phone].filter(Boolean).join('  ·  ');if(c)add('div',c,'c');
  if(D.summary)add('p',D.summary);
  if(D.jobs.length){add('h2','Experience');D.jobs.forEach(function(j){var d=add('div',null,'it');var p=add('p',null,null,d);p.appendChild(el('b',null,S(j.role)));
    var m=[S(j.co),S(j.loc),S(j.dates)].filter(Boolean).join(' · ');if(m)add('p',m,'m',d);if(S(j.text))add('p',S(j.text),null,d)})}
  if(D.skills.length){add('h2','Skills');var u=add('ul');D.skills.forEach(function(s){add('li',S(s[0])+' — '+Math.max(0,Math.min(5,Math.round(+s[1]||0)))+'/5',null,u)})}
  if(D.certs.length){add('h2','Certifications');var u2=add('ul');D.certs.forEach(function(x){add('li',x,null,u2)})}
  if(D.edu.length){add('h2','Education');D.edu.forEach(function(e){var d=add('div',null,'it');var p=add('p',null,null,d);p.appendChild(el('b',null,S(e[0])));var m=[S(e[2]),S(e[1])].filter(Boolean).join(' · ');if(m)add('p',m,'m',d)})}
  if(D.langs.length){add('h2','Languages');var u3=add('ul');D.langs.forEach(function(l){add('li',S(l[0])+(S(l[1])?' — '+S(l[1]):''),null,u3)})}
})();

startup();
})();
</script>
</body>
