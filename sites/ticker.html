<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta property="og:type" content="website">
<meta property="og:title" content="Gustavo Freitas — Resume">
<meta property="og:description" content="Customer Success Engineer — SOAR & Security Automation.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Gustavo Freitas — Resume">
<meta name="twitter:description" content="Customer Success Engineer — SOAR & Security Automation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2304070a'/%3E%3Cpath d='M6 50L20 36l10 8 14-22 14 10' fill='none' stroke='%232ee67f' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M44 12l8 10H36z' fill='%23ffb000'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04070a;--bg2:#091014;--panel:#0a1317;--line:#17272c;--grid:#10201f;--up:#2ee67f;--up2:#178f50;--am:#ffb000;--am2:#c58400;--tx:#c7e6d3;--mut:#6f8f80;--hi:#eafff2;--mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{scroll-behavior:smooth;scroll-padding-top:110px;-webkit-text-size-adjust:100%}
body{background:var(--bg);background-image:radial-gradient(60% 40% at 80% -5%,rgba(46,230,127,.10),transparent 70%),radial-gradient(50% 40% at 0 30%,rgba(255,176,0,.05),transparent 70%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,auto,44px 44px,44px 44px;color:var(--tx);font:400 .95rem/1.6 var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:500;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.16) 3px);opacity:.5}
a{color:var(--up)}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--am);outline-offset:3px}
.skip{position:absolute;left:8px;top:-60px;background:var(--am);color:#000;padding:8px 14px;z-index:600;font-family:var(--mono)}.skip:focus{top:8px}
.mono{font-family:var(--mono)}
.wrap{width:min(1180px,100% - 32px);margin:0 auto}
.up{color:var(--up)}.am{color:var(--am)}.mut{color:var(--mut)}

/* ticker tape */
.tape{position:sticky;top:0;z-index:200;height:34px;overflow:hidden;background:#02050a;border-bottom:1px solid var(--line);font:600 .78rem/34px var(--mono);white-space:nowrap}
.tape-in{display:flex;width:max-content;animation:tape var(--tt,80s) linear infinite}
.tape:hover .tape-in{animation-play-state:paused}
.tseq{display:flex;flex:none}
.ti{display:inline-flex;gap:8px;align-items:center;padding:0 18px;border-right:1px solid #12201f}
.ti b{color:var(--hi);font-weight:800}.ti em{font-style:normal;color:var(--tx)}.ti i{font-style:normal;color:var(--up)}
@keyframes tape{to{transform:translateX(-50%)}}

/* header */
.hdr{position:sticky;top:34px;z-index:150;background:rgba(4,7,10,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;min-height:50px;padding:4px 0}
.brand{display:flex;align-items:center;gap:10px;font:800 .95rem var(--mono);color:var(--hi);text-decoration:none;margin-right:auto;letter-spacing:.04em;min-width:0}
.brand span.lg{display:grid;place-items:center;width:30px;height:30px;background:var(--up);color:#00170a;border-radius:4px}
.brand .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%;order:3;width:100%}
.nav::-webkit-scrollbar{display:none}
@media(min-width:1000px){.nav{order:0;width:auto}}
.nav a{font:600 .74rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-decoration:none;padding:0 12px;display:flex;align-items:center;min-height:44px;white-space:nowrap;border-bottom:2px solid transparent}
.nav a:hover,.nav a.on{color:var(--am);border-bottom-color:var(--am)}
.live{font:600 .74rem var(--mono);color:var(--up);display:flex;align-items:center;gap:8px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 10px var(--up);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;font:800 .82rem var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;border:1px solid var(--up);background:transparent;color:var(--up);transition:background .2s,color .2s,box-shadow .2s}
.btn:hover{background:var(--up);color:#00170a;box-shadow:0 0 22px rgba(46,230,127,.35)}
.btn.am{border-color:var(--am);color:var(--am)}.btn.am:hover{background:var(--am);color:#1a1000;box-shadow:0 0 22px rgba(255,176,0,.35)}
.btn.f{background:var(--up);color:#00170a}.btn.f:hover{background:#6dffae}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* hero */
.hero{padding:clamp(26px,5vw,56px) 0 20px}
.hgrid{display:grid;gap:24px 36px;grid-template-columns:1fr}
@media(min-width:1000px){.hgrid{grid-template-columns:1.5fr 1fr;align-items:end}}
.exch{font:600 .78rem var(--mono);letter-spacing:.14em;color:var(--am);text-transform:uppercase;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.exch b{background:var(--am);color:#1a1000;padding:1px 8px;border-radius:2px}
h1{font:800 clamp(2.1rem,6.2vw,4.4rem)/1.02 var(--mono);color:var(--hi);letter-spacing:-.03em;margin-top:12px;text-shadow:0 0 28px rgba(46,230,127,.28);overflow-wrap:anywhere}
.sector{font:500 clamp(.95rem,1.8vw,1.2rem)/1.4 var(--mono);color:var(--tx);margin-top:10px}
.sector::before{content:'SECTOR  ';color:var(--mut);font-size:.72em;letter-spacing:.1em}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-top:22px}
.price .px{font:800 clamp(2.4rem,7vw,4rem)/1 var(--mono);color:var(--up);text-shadow:0 0 24px rgba(46,230,127,.4);font-variant-numeric:tabular-nums}
.price .chg{font:600 1.05rem var(--mono);color:var(--up)}
.price .sub{font:400 .78rem var(--mono);color:var(--mut);width:100%;letter-spacing:.06em;text-transform:uppercase}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--panel);padding:16px 18px}
.kpi small{display:block;font:600 .68rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.kpi b{display:block;font:800 2rem/1.15 var(--mono);color:var(--hi);font-variant-numeric:tabular-nums}
.kpi b i{font-style:normal;color:var(--up);font-size:.6em;margin-left:4px}

/* panels / sections */
section{padding:clamp(26px,4.5vw,48px) 0 6px}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
h2{font:800 .85rem/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--am)}
h2::before{content:'▌';color:var(--up);margin-right:8px}
.ph .rule{flex:1;height:1px;background:var(--line);min-width:30px}
.ph .tag{font:600 .7rem var(--mono);color:var(--mut);letter-spacing:.1em}
.panel{background:var(--panel);border:1px solid var(--line);position:relative}
.panel::before{content:'';position:absolute;left:-1px;top:-1px;width:14px;height:14px;border-left:2px solid var(--up);border-top:2px solid var(--up);pointer-events:none}

/* chart */
.chartbox{padding:12px 12px 10px}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px;font:600 .72rem var(--mono);color:var(--mut)}
.ctl .sw{display:flex;border:1px solid var(--line)}
.ctl button{font:700 .72rem var(--mono);letter-spacing:.08em;background:none;color:var(--mut);border:0;padding:0 12px;min-height:34px;cursor:pointer}
.ctl button[aria-pressed=true]{background:var(--up);color:#00170a}
.ctl .readout{margin-left:auto;color:var(--hi);min-height:1.2em;font-variant-numeric:tabular-nums}
.chartwrap{position:relative;touch-action:pan-y}
.chartwrap svg{display:block;max-width:100%;overflow:visible}
.gl{stroke:var(--grid);stroke-width:1}
.gl.v{stroke-dasharray:2 4}
.ax{fill:var(--mut);font:500 10.5px var(--mono)}
.ln{fill:none;stroke:var(--up);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(46,230,127,.6))}
.ar{fill:url(#ag)}
.vol{fill:var(--up2);opacity:.25}
.cw{stroke-width:1.2}.cb{stroke-width:1.2}
.cu{stroke:var(--up);fill:var(--up)}.cd{stroke:var(--am);fill:#04070a}
[data-mode=line] .cg{display:none}
[data-mode=candle] .ln,[data-mode=candle] .ar{opacity:.22;filter:none}
.lastl{stroke:var(--am);stroke-dasharray:4 4;stroke-width:1;opacity:.8}
.lastt rect{fill:var(--am)}.lastt text{fill:#1a1000;font:800 11px var(--mono)}
.mk{cursor:pointer;outline:none}
.mk .hit{fill:transparent}
.mk .ring{fill:none;stroke:var(--am);stroke-width:1;opacity:.5;transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
.mk .dot{fill:var(--am);stroke:#04070a;stroke-width:2}
.mk text.n{fill:#1a1000;font:800 10px var(--mono);text-anchor:middle;pointer-events:none}
.mk text.lb{fill:var(--am);font:700 10.5px var(--mono);letter-spacing:.04em;pointer-events:none;paint-order:stroke;stroke:#04070a;stroke-width:3px}
.mk .stem{stroke:var(--am);stroke-width:1;opacity:.6}
.mk:hover .dot,.mk:focus .dot,.mk.sel .dot{fill:#fff}
.mk:focus-visible .hit{stroke:var(--am);stroke-dasharray:3 3}
@keyframes ping{0%{transform:scale(.7);opacity:.7}100%{transform:scale(2.3);opacity:0}}
.xh{stroke:var(--mut);stroke-dasharray:3 3;opacity:0}.xd{fill:var(--hi);opacity:0}
.chartwrap.hov .xh,.chartwrap.hov .xd{opacity:.9}
.card{position:absolute;z-index:30;width:min(330px,calc(100% - 16px));background:#05100c;border:1px solid var(--am);box-shadow:0 0 0 1px #000,0 14px 44px rgba(0,0,0,.7),0 0 26px rgba(255,176,0,.16);padding:14px 16px;font-size:.84rem;line-height:1.5;display:none}
.card.show{display:block}
.card .ch{display:flex;justify-content:space-between;gap:10px;font:700 .68rem var(--mono);letter-spacing:.12em;color:var(--am);text-transform:uppercase}
.card h3{font:800 .98rem/1.3 var(--mono);color:var(--hi);margin:6px 0 2px}
.card .co{color:var(--up);font-weight:600}
.card .meta{color:var(--mut);font:500 .74rem var(--mono);margin-bottom:6px}
.card .fill{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font:600 .75rem var(--mono);color:var(--mut);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card .fill b{color:var(--up)}
.hint{font:500 .72rem var(--mono);color:var(--mut);margin-top:8px}
/* chart draw-on-load */
.js .chartwrap:not(.go) .ln{opacity:0}
.js .chartwrap.go .ln{stroke-dasharray:1;animation:draw 2.8s cubic-bezier(.45,.1,.2,1) backwards}
.js .chartwrap:not(.go) .ar,.js .chartwrap:not(.go) .cg>*,.js .chartwrap:not(.go) .mk,.js .chartwrap:not(.go) .vol,.js .chartwrap:not(.go) .lastt,.js .chartwrap:not(.go) .lastl{opacity:0}
.js .chartwrap.go .ar{animation:fade 1.2s ease 1.6s backwards}
.js .chartwrap.go .vol{animation:fade .6s ease backwards;animation-delay:calc(var(--i)*14ms)}
.js .chartwrap.go .cg>*{animation:fade .35s ease backwards;animation-delay:calc(var(--i)*30ms)}
.js .chartwrap.go .mk{animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:var(--md,1s);transform-box:fill-box;transform-origin:center}
.js .chartwrap.go .lastt,.js .chartwrap.go .lastl{animation:fade .6s ease 2.6s backwards}
@keyframes draw{from{stroke-dashoffset:1;opacity:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}

/* blotter */
.rows{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.tr{background:var(--panel);padding:14px 16px;display:grid;gap:4px 16px;grid-template-columns:34px 112px 1fr auto}
.tr .n{font:800 .8rem var(--mono);background:var(--am);color:#1a1000;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.tr .d{font:600 .8rem var(--mono);color:var(--mut)}
.tr .r{font:600 1rem/1.35 var(--mono);color:var(--hi)}
.tr .r small{display:block;font:400 .8rem var(--sans);color:var(--mut);margin-top:2px}
.tr .sd{font:800 .72rem var(--mono);letter-spacing:.1em;color:var(--up);border:1px solid var(--up);padding:1px 8px;height:fit-content;align-self:start;text-align:center}
.tr .sd.am{color:var(--am);border-color:var(--am)}
.tr .tx{grid-column:3/-1;color:var(--tx);font-size:.9rem;max-width:68ch}
.tr:target,.tr.sel{box-shadow:inset 3px 0 0 var(--am);background:#0d1710}
@media(max-width:700px){.tr{grid-template-columns:30px 1fr auto}.tr .d{grid-column:2/3;grid-row:2}.tr .r{grid-column:2/3}.tr .sd{grid-column:3;grid-row:1}.tr .tx{grid-column:1/-1}}

/* notes */
.nts{display:grid;gap:18px 30px;grid-template-columns:1fr;padding:20px 22px}
@media(min-width:900px){.nts{grid-template-columns:2fr 1fr}}
.nts p.sm{font-size:1.02rem;line-height:1.7;color:var(--hi);max-width:62ch}
.nts p.sm::after{content:'█';color:var(--up);margin-left:3px;animation:blink 1s steps(2) infinite}
.rate{border:1px solid var(--line);padding:14px 16px;display:grid;gap:8px;align-content:start;font:600 .78rem var(--mono)}
.rate div{display:flex;justify-content:space-between;gap:12px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.rate div b{color:var(--hi);text-align:right;text-transform:none;letter-spacing:0}
.rate .rt{color:#00170a;background:var(--up);text-align:center;padding:6px;font-weight:800;letter-spacing:.14em;display:block}
.js .wr{clip-path:inset(0 100% 0 0);transition:clip-path 2.4s steps(40,end) .3s}
.js .in .wr{clip-path:inset(0 0 0 0)}
.wr{clip-path:none}

/* watchlist */
.wl{border:1px solid var(--line);background:var(--panel)}
.wh,.wlr{display:grid;grid-template-columns:78px 1fr 190px 86px 88px 96px;gap:4px 14px;align-items:center;padding:12px 16px}
.wh{font:700 .66rem var(--mono);letter-spacing:.14em;color:var(--mut);text-transform:uppercase;border-bottom:1px solid var(--line);background:#071014}
.wlr{border-bottom:1px solid #0f1d20;transition:background .2s}
.wlr:last-child{border-bottom:0}
.wlr:hover{background:#0d1a1b}
.wlr .s{font:800 .92rem var(--mono);color:var(--hi)}
.wlr .nm{overflow-wrap:anywhere;line-height:1.35}
.wlr .px{font:600 .9rem var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.wlr .cg{font:700 .85rem var(--mono);color:var(--up);text-align:right;font-variant-numeric:tabular-nums}
.lvb{display:flex;gap:3px;align-items:center}
.lvb i{flex:1;height:10px;background:#0f1f21;border:1px solid #162a2c;position:relative;overflow:hidden}
.lvb i.on{border-color:var(--up2)}
.lvb i.on::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--up2),var(--up));transform-origin:left;transition:transform .7s cubic-bezier(.3,.7,.2,1);transition-delay:calc(var(--k)*90ms + .15s)}
.js .wlr:not(.in) .lvb i.on::before{transform:scaleX(0)}
.spk{width:96px;height:26px;display:block;margin-left:auto}
.spk polyline{fill:none;stroke:var(--up);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
@media(max-width:760px){
 .wh{display:none}
 .wlr{grid-template-columns:64px 1fr auto;grid-template-areas:'s nm cg' 'b b px'}
 .wlr .s{grid-area:s}.wlr .nm{grid-area:nm}.wlr .cg{grid-area:cg}.wlr .lvb{grid-area:b}.wlr .px{grid-area:px;text-align:right}.wlr .spk{display:none}
 .wlr .px{font-size:.78rem;color:var(--mut)}
}

/* holdings & two-col */
.hold{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.hold li{background:var(--panel);padding:12px 16px;display:flex;gap:14px;align-items:flex-start;transition:background .2s}
.hold li:hover{background:#0d1a1b}
.hold .s{font:800 .84rem var(--mono);color:#00170a;background:var(--up);padding:2px 8px;border-radius:2px;white-space:nowrap;min-width:52px;text-align:center}
.hold .t{line-height:1.4;overflow-wrap:anywhere}
.hold .t small{display:block;font:600 .7rem var(--mono);color:var(--up);letter-spacing:.06em}
.two{display:grid;gap:0 36px;grid-template-columns:1fr}
@media(min-width:900px){.two{grid-template-columns:1.25fr 1fr}}
.lst{border:1px solid var(--line);background:var(--panel)}
.lst li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 14px;padding:12px 16px;border-bottom:1px solid #0f1d20}
.lst li:last-child{border-bottom:0}
.lst b{font:700 .95rem/1.3 var(--mono);color:var(--hi)}
.lst .sc{width:100%;color:var(--mut);font-size:.88rem}
.lst .dt{font:600 .75rem var(--mono);color:var(--am)}
.lst .pair{font:800 .85rem var(--mono);color:var(--am);margin-right:10px}

/* order ticket */
.order{padding:clamp(18px,4vw,34px);border:1px solid var(--am);background:linear-gradient(135deg,#120d00,var(--panel) 60%);position:relative}
.order::before{border-color:var(--am)}
.order h3{font:800 clamp(1.4rem,3.4vw,2.2rem)/1.15 var(--mono);color:var(--hi)}
.ord-g{display:grid;gap:1px;background:#2a2000;border:1px solid #2a2000;margin:18px 0;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.ord-g div{background:#0b0d08;padding:10px 14px}
.ord-g small{display:block;font:600 .64rem var(--mono);letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.ord-g b{font:700 .95rem/1.4 var(--mono);color:var(--hi);overflow-wrap:anywhere}
.ord-g b.buy{color:#00170a;background:var(--up);padding:0 8px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;padding:26px 0 50px;font:500 .74rem var(--mono);color:var(--mut)}
.foot a{color:var(--mut)}

.rv{transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.js .rv:not(.in){opacity:0;transform:translateY(14px)}
html.still *,html.still *::before,html.still *::after{transition:none!important;animation:none!important}
html.still .rv{opacity:1!important;transform:none!important}
html.still .wr{clip-path:none!important}
html.still .tape-in{transform:none}
html.still{scroll-behavior:auto}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

@media(max-width:480px){
 .kpi b{font-size:1.6rem}.hdr .live{display:none}
 .tr{padding:12px}.nts{padding:16px}
}

@media print{
 @page{margin:12mm}
 :root{--bg:#fff;--panel:#fff;--line:#bbb;--grid:#ddd;--up:#111;--up2:#444;--am:#000;--tx:#111;--mut:#444;--hi:#000}
 html,body{background:#fff!important;color:#000!important}
 body{background-image:none!important;font-size:10pt;line-height:1.4}
 body::after,.tape,.hdr,.acts,.skip,.ctl,.hint,.card,.xh,.xd,.mk .ring,.spk,.live{display:none!important}
 *,*::before,*::after{animation:none!important;transition:none!important;box-shadow:none!important;text-shadow:none!important;filter:none!important}
 .rv{opacity:1!important;transform:none!important}.wr{clip-path:none!important}
 .wrap{width:100%}
 .hero{padding:0 0 6pt}h1{font-size:26pt;color:#000}.price .px{font-size:22pt;color:#000}.price .chg{color:#000}

/* ---------- chart renderer ---------- */
var cv=$('#cv'),cw=$('#cw'),card=$('#card'),readout=$('#readout'),G=null,pinned=-1;
function nice(min,max,n){var span=Math.max(1e-6,max-min),step=Math.pow(10,Math.floor(Math.log10(span/n))),er=span/n/step;step*=er>=5?5:er>=2?2:1;var lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,t=[];for(var v=lo;v<=hi+1e-9;v+=step)t.push(v);return t}
function drawChart(){
 if(!cv)return;
 var W=Math.max(300,Math.floor(cw.clientWidth)),H=W<560?310:(W<900?390:450),L=10,R=W<560?48:60,T=24,B=30,pw=W-L-R,ph=H-T-B;
 var vs=S.map(function(p){return p.v}),ticks=nice(Math.min.apply(null,vs)*.9,Math.max.apply(null,vs)*1.08,5),y0=ticks[0],y1=ticks[ticks.length-1];
 var X=function(m){return L+(m-M0)/(M1-M0)*pw},Y=function(v){return T+ph-(v-y0)/(y1-y0)*ph};
 G={W:W,H:H,L:L,R:R,T:T,B:B,pw:pw,ph:ph,X:X,Y:Y};
 var s='<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--up);stop-opacity:.34"/><stop offset="1" style="stop-color:var(--up);stop-opacity:0"/></linearGradient></defs>';
 ticks.forEach(function(t){var y=Y(t);s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="ax" x="'+(W-R+6)+'" y="'+(y+3.5).toFixed(1)+'">'+Math.round(t)+'</text>'});
 var y1y=Math.floor(M0/12)+1,y2y=Math.floor(M1/12),yst=(W<700&&y2y-y1y>7)?2:1;
 for(var yr=y1y;yr<=y2y;yr+=yst){var x=X(yr*12);s+='<line class="gl v" x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+T+'" y2="'+(T+ph)+'"/><text class="ax" x="'+x.toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+yr+'</text>'}
 var vh=ph*.13;S.forEach(function(p,i){var h=vh*p.vol,bw=Math.max(1,pw/S.length*.7);s+='<rect class="vol" style="--i:'+i+'" x="'+(X(p.m)-bw/2).toFixed(1)+'" y="'+(T+ph-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'"/>'});
 var pts=S.map(function(p){return X(p.m).toFixed(1)+' '+Y(p.v).toFixed(1)});
 s+='<path class="ar" d="M'+pts.join('L')+'L'+X(M1).toFixed(1)+' '+(T+ph)+'L'+X(M0).toFixed(1)+' '+(T+ph)+'Z"/>';
 s+='<path class="ln" pathLength="1" d="M'+pts.join('L')+'"/>';
 var cwid=Math.max(2,pw/cdl.length*.6);s+='<g class="cg">';cdl.forEach(function(c,i){var up=c.c>=c.o,x=X(c.m).toFixed(1),yo=Y(c.o),yc=Y(c.c);s+='<g class="'+(up?'cu':'cd')+'" style="--i:'+i+'"><line class="cw" x1="'+x+'" x2="'+x+'" y1="'+Y(c.h).toFixed(1)+'" y2="'+Y(c.l).toFixed(1)+'"/><rect class="cb" x="'+(X(c.m)-cwid/2).toFixed(1)+'" y="'+Math.min(yo,yc).toFixed(1)+'" width="'+cwid.toFixed(1)+'" height="'+Math.max(1.5,Math.abs(yo-yc)).toFixed(1)+'"/></g>'});s+='</g>';
 var ly=Y(last);s+='<line class="lastl" x1="'+L+'" x2="'+(W-R)+'" y1="'+ly.toFixed(1)+'" y2="'+ly.toFixed(1)+'"/><g class="lastt"><rect x="'+(W-R)+'" y="'+(ly-9).toFixed(1)+'" width="'+(R-1)+'" height="18"/><text x="'+(W-R+4)+'" y="'+(ly+4).toFixed(1)+'">'+last.toFixed(1)+'</text></g>';
 s+='<line class="xh" id="xl" x1="0" x2="0" y1="'+T+'" y2="'+(T+ph)+'"/><circle class="xd" id="xd" r="4" cx="0" cy="0"/>';
 C.forEach(function(c,k){var x=X(c.m),y=Y(c.v),up=y>T+34,ty=up?y-18-(k%2)*15:y+26+(k%2)*13,anc=x<L+48?'start':(x>W-R-60?'end':'middle'),lab=verbs[k]+' '+coSym(c.j.co);
  s+='<g class="mk" tabindex="0" role="button" data-k="'+k+'" style="--md:'+(1.2+(c.m-M0)/(M1-M0)*1.6).toFixed(2)+'s" aria-label="Trade '+(k+1)+': '+esc(c.j.role||'')+(c.j.co?' at '+esc(c.j.co):'')+(c.j.dates?', '+esc(c.j.dates):'')+'"><circle class="hit" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="17"/><circle class="ring" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="9"/>'+(W>=560?'<line class="stem" x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+(y+(up?-10:10)).toFixed(1)+'" y2="'+(ty+(up?3:-9)).toFixed(1)+'"/><text class="lb" x="'+x.toFixed(1)+'" y="'+ty.toFixed(1)+'" text-anchor="'+anc+'">'+esc(lab)+'</text>':'')+'<circle class="dot" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="9.5"/><text class="n" x="'+x.toFixed(1)+'" y="'+(y+3.6).toFixed(1)+'">'+(k+1)+'</text></g>'});
 cv.setAttribute('width',W);cv.setAttribute('height',H);cv.setAttribute('viewBox','0 0 '+W+' '+H);cv.innerHTML=s;
 if(pinned>=0)showCard(pinned,true);
}
function cardHTML(k){var c=C[k],j=c.j,prev=k>0?C[k-1].v:null,chg=prev?((c.v/prev-1)*100):null;
 return '<div class="ch"><span>Order filled · #'+(k+1)+'</span><span>'+verbs[k]+' '+esc(coSym(j.co))+'</span></div><h3>'+esc(j.role||'')+'</h3><p class="co">'+esc(j.co||'')+'</p><p class="meta">'+esc([j.dates,j.loc].filter(Boolean).join(' · '))+'</p>'+(j.text?'<p>'+esc(j.text)+'</p>':'')+'<div class="fill"><span>FILL <b>'+money(c.v)+'</b></span>'+(chg!=null?'<span>vs prior <b>▲ +'+chg.toFixed(1)+'%</b></span>':'<span>OPENING POSITION</span>')+'</div>'}
function showCard(k,keep){var c=C[k];if(!c||!G)return;card.innerHTML=cardHTML(k);card.classList.add('show');
 var cwid=card.offsetWidth,chh=card.offsetHeight,x=G.X(c.m),y=G.Y(c.v);
 var left=Math.max(8,Math.min(G.W-cwid-8,x-cwid/2)),top=(y>G.H*.5)?y-chh-18:y+20;
 if(top<4)top=4;if(top+chh>G.H+10&&y>G.H*.5)top=4;
 card.style.left=left+'px';card.style.top=top+'px';
 $$('.mk',cv).forEach(function(m){m.classList.toggle('sel',+m.getAttribute('data-k')===k)});
 $$('.tr').forEach(function(r){r.classList.toggle('sel',+r.getAttribute('data-k')===k)})}
function hideCard(){card.classList.remove('show');$$('.mk',cv).forEach(function(m){m.classList.remove('sel')});$$('.tr').forEach(function(r){r.classList.remove('sel')})}
if(cv&&C.length){
 drawChart();
 var rt=0;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){drawChart()},80)});
 cv.addEventListener('pointerover',function(e){var m=e.target.closest&&e.target.closest('.mk');if(m&&pinned<0)showCard(+m.getAttribute('data-k'))});
 cv.addEventListener('pointerout',function(e){var m=e.target.closest&&e.target.closest('.mk');if(m&&pinned<0)hideCard()});
 cv.addEventListener('focusin',function(e){var m=e.target.closest&&e.target.closest('.mk');if(m)showCard(+m.getAttribute('data-k'))});
 cv.addEventListener('focusout',function(e){if(pinned<0)hideCard()});
 cv.addEventListener('click',function(e){var m=e.target.closest&&e.target.closest('.mk');if(!m)return;var k=+m.getAttribute('data-k');if(pinned===k){pinned=-1;hideCard()}else{pinned=k;showCard(k)}e.stopPropagation()});
 cv.addEventListener('keydown',function(e){var m=e.target.closest&&e.target.closest('.mk');if(m&&(e.key==='Enter'||e.key===' ')){e.preventDefault();m.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
 document.addEventListener('click',function(e){if(e.target.closest&&(e.target.closest('.mk')||e.target.closest('#card')))return;if(pinned>=0){pinned=-1;hideCard()}});
 document.addEventListener('keydown',function(e){if(e.key==='Escape'&&pinned>=0){pinned=-1;hideCard()}});
 cv.addEventListener('pointermove',function(e){if(!G||e.pointerType==='touch')return;var r=cv.getBoundingClientRect(),px=e.clientX-r.left;if(px<G.L||px>G.W-G.R){cw.classList.remove('hov');readout.textContent='';return}
  var m=M0+(px-G.L)/G.pw*(M1-M0),i=Math.max(0,Math.min(S.length-1,Math.round(m-M0))),p=S[i],x=G.X(p.m),y=G.Y(p.v),xl=$('#xl'),xd=$('#xd');
  xl.setAttribute('x1',x);xl.setAttribute('x2',x);xd.setAttribute('cx',x);xd.setAttribute('cy',y);cw.classList.add('hov');readout.textContent=mStr(p.m)+'  '+money(p.v)});
 cv.addEventListener('pointerleave',function(){cw.classList.remove('hov');readout.textContent=''});
 $$('.ctl button').forEach(function(b){b.addEventListener('click',function(){var md=b.getAttribute('data-mode');cw.setAttribute('data-mode',md);$$('.ctl button').forEach(function(o){o.setAttribute('aria-pressed',o===b?'true':'false')})})});
 $$('.tr').forEach(function(r){r.addEventListener('click',function(){var k=+r.getAttribute('data-k');pinned=k;showCard(k)})});
 if(innerWidth>=900){pinned=C.length-1;showCard(pinned)}
}

/* ---------- reveals, count-ups, clock ---------- */
function count(el){var to=+el.dataset.to,sfx=el.dataset.sfx||'',dec=(String(el.dataset.to).split('.')[1]||'').length;if(still||!to){el.textContent=(dec?to.toFixed(dec):to)+sfx;return}var t0=null,dur=1500;(function f(t){if(!t0)t0=t;var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3),v=to*e;el.textContent=(dec?v.toFixed(dec):Math.round(v))+sfx;if(p<1)requestAnimationFrame(f)})(performance.now())}
var nums=$$('[data-to]');
var targets=$$('.rv');
if(still||!('IntersectionObserver' in window)){targets.forEach(function(t){t.classList.add('in')});if(cw)cw.classList.add('go');nums.forEach(count)}
else{
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');$$('[data-to]',e.target).forEach(count);io.unobserve(e.target)}})},{threshold:.1,rootMargin:'0px 0px -4% 0px'});targets.forEach(function(t){io.observe(t)});
 if(cw){var io2=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){cw.classList.add('go');io2.disconnect()}})},{threshold:.25});io2.observe(cw)}
}
var clk=$('#clk');
function tick(){var d=new Date(),p=function(n){return (n<10?'0':'')+n};clk.textContent='LIVE '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
if(!still){tick();setInterval(tick,1000)}
/* nav spy */
var links=$$('.nav a');
if('IntersectionObserver' in window){var spy=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)links.forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id)})})},{rootMargin:'-35% 0px -60% 0px'});secs.forEach(function(s){var el=document.getElementById(s[0]);if(el)spy.observe(el)})}
})();
</script>
