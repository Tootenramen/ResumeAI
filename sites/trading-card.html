<style>
:root{--bg:#0a0a18;--tx:#ecebff;--mu:#a9a7cc;--line:rgba(255,255,255,.13);--gold:#ffcf4a;--vio:#8b6bff;--surf:#13132b;
 --serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--mono:'Space Mono',ui-monospace,Consolas,'Courier New',monospace}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{scroll-behavior:smooth;scroll-padding-top:76px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:400 1rem/1.6 var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased;
 background-image:radial-gradient(60% 50% at 12% 0,rgba(139,107,255,.28),transparent 70%),radial-gradient(50% 45% at 100% 30%,rgba(255,95,162,.14),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(107,210,255,.14),transparent 70%),radial-gradient(circle,rgba(255,255,255,.07) 1px,transparent 1.5px);background-size:auto,auto,auto,34px 34px;background-attachment:fixed,fixed,fixed,scroll}
a{color:var(--gold)}
[hidden]{display:none!important}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
.wrap{width:min(1160px,100% - 32px);margin:0 auto}

/* top bar */
.top{position:sticky;top:0;z-index:50;background:rgba(10,10,24,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:6px 16px;min-height:60px;flex-wrap:wrap;padding:4px 0}
.brand{display:flex;align-items:center;gap:10px;font:700 .98rem var(--sans);color:var(--tx);text-decoration:none;margin-right:auto;min-width:0}
.brand i{flex:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font:800 .8rem var(--serif);font-style:normal;color:#1a1204;background:linear-gradient(135deg,#ffe9a0,#d9a42f)}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top nav{display:flex;gap:2px}
.top nav a{display:flex;align-items:center;min-height:44px;padding:0 12px;color:var(--mu);text-decoration:none;font-size:.9rem;font-weight:500;transition:color .2s}
.top nav a:hover{color:var(--tx)}
@media(max-width:640px){.top nav{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:12px;font:700 .95rem var(--sans);text-decoration:none;cursor:pointer;border:1.5px solid var(--gold);color:var(--gold);background:transparent;transition:transform .2s,box-shadow .2s,background .2s,color .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(255,207,74,.22)}
.btn.p{background:linear-gradient(135deg,#ffe38a,#e0a62c);color:#1b1304;border-color:transparent}
.btn.s{min-height:40px;padding:0 16px;font-size:.85rem}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* hero */
.hero{display:grid;grid-template-columns:1fr;gap:34px;align-items:center;padding:clamp(28px,5vw,64px) 0 clamp(40px,6vw,84px)}
@media(min-width:920px){.hero{grid-template-columns:1.05fr .95fr;gap:56px}}
.copy{order:2}
.eyebrow{display:inline-flex;gap:10px;align-items:center;font:700 .74rem var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--gold)}
h1{font:800 clamp(2.5rem,7vw,4.6rem)/1.02 var(--serif);letter-spacing:-.02em;overflow-wrap:anywhere;background:linear-gradient(100deg,#fff 20%,#ffd96b 55%,#ff9ad5 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ttl{margin-top:14px;font:500 clamp(1.05rem,2.2vw,1.35rem)/1.4 var(--sans);color:#d9d6ff;max-width:30em}
.sum{margin-top:18px;max-width:40rem;color:var(--mu);font-size:1.04rem}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.cl{display:flex;flex-wrap:wrap;gap:6px 24px;margin-top:22px;font-style:normal}
.cl a{color:var(--mu);text-decoration:none;min-height:32px;display:inline-flex;align-items:center;overflow-wrap:anywhere}
.cl a:hover{color:var(--gold)}
.hint{margin-top:22px;font:400 .78rem var(--mono);color:var(--mu);letter-spacing:.04em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint b{color:var(--gold);font-weight:700}
.stagewrap{order:1;display:grid;justify-items:center}
@media(min-width:920px){.copy{order:1}.stagewrap{order:2}}

/* ===== the holo card ===== */
.stage{--mx:50%;--my:50%;--nx:0;--ny:0;--hy:.4;position:relative;width:min(390px,100%);perspective:1000px;touch-action:pan-y;padding:10px 0 20px}
.glow{position:absolute;inset:6% -8% 2%;border-radius:40%;background:conic-gradient(from 90deg,#ff5fa2,#ffcf4a,#6bffb3,#6bd2ff,#9a7bff,#ff5fa2);filter:blur(54px);opacity:.34;animation:spin 14s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.card{position:relative;aspect-ratio:63/88;border-radius:20px;padding:10px;isolation:isolate;overflow:hidden;container-type:inline-size;
 background:linear-gradient(135deg,#f7dc82,#b4821f 28%,#fff0ad 48%,#a06d17 70%,#f3d06e);
 transform:rotateX(calc(var(--ny)*-14deg)) rotateY(calc(var(--nx)*14deg));will-change:transform;
 box-shadow:calc(var(--nx)*-20px) calc(28px + var(--ny)*-14px) 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.18) inset}
.face{--ft:#f4f1ff;--fm:#b4b0d8;--fa:#ffd96b;position:relative;height:100%;border-radius:12px;padding:3cqw 3.6cqw;display:flex;flex-direction:column;gap:1.8cqw;overflow:hidden;color:var(--ft);
 background:radial-gradient(120% 70% at 50% 0,#2a2160,transparent 70%),linear-gradient(#14122e,#0c0b1f);font-family:var(--sans)}
.c-top{display:flex;align-items:baseline;justify-content:space-between;gap:2cqw}
.c-name{font:800 7.4cqw/1.1 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;color:#fff}
.c-hp{flex:none;font:700 4.2cqw/1 var(--mono);color:#ff8fa8}.c-hp small{font-size:2.5cqw;margin-right:.7cqw;color:var(--fm)}
.c-art{position:relative;aspect-ratio:2/1;border-radius:1.8cqw;overflow:hidden;border:.7cqw solid #d9ac45;box-shadow:0 0 0 .3cqw #6d4b0e,inset 0 0 3cqw rgba(0,0,0,.6)}
.c-art svg{display:block;width:100%;height:100%}
.c-rar{position:absolute;left:1.6cqw;bottom:1.4cqw;font:700 2.3cqw/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:1cqw 1.8cqw;border-radius:99px;color:#1b1304;background:linear-gradient(135deg,#ffe38a,#e0a62c)}
.c-type{font:italic 500 2.9cqw/1.3 var(--sans);color:var(--fa);text-align:center;padding:.8cqw 2cqw;background:rgba(255,255,255,.06);border-radius:99px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-stats h4,.c-atk h4{font:700 2.3cqw/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--fm);margin-bottom:1.1cqw;display:flex;align-items:center;gap:1.4cqw}
.c-stats h4::after,.c-atk h4::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.18)}
.st{display:grid;grid-template-columns:34% 1fr 7cqw;align-items:center;gap:1.8cqw;height:4.5cqw}
.st span:first-child{font:500 2.9cqw/1 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .seg{display:grid;grid-template-columns:repeat(5,1fr);gap:.7cqw}
.st .seg i{height:2cqw;border-radius:.6cqw;background:rgba(255,255,255,.12)}
.st .seg i.on{background:linear-gradient(90deg,#ffcf4a,#ff7aa8);box-shadow:0 0 1.6cqw rgba(255,160,120,.55)}
.st b{font:700 3cqw/1 var(--mono);text-align:right;color:var(--fa)}
.c-atk{flex:1;min-height:0;display:flex;flex-direction:column}
.atk{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2cqw;padding:1.3cqw 0;border-top:1px solid rgba(255,255,255,.1)}
.orbs{display:flex;gap:.6cqw}.orbs i{width:3cqw;height:3cqw;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#ffcf4a 40%,#c97c0b);box-shadow:0 0 1.4cqw rgba(255,200,80,.6)}
.atk .an{font:700 3.5cqw/1.15 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atk .ad{font:400 2.55cqw/1.2 var(--sans);color:var(--fm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atk .am{min-width:0}
.atk .dm{font:800 5.4cqw/1 var(--serif);color:#fff}
.c-foot{display:flex;justify-content:space-between;gap:2cqw;font:400 2.3cqw/1.2 var(--mono);color:var(--fm);letter-spacing:.06em;text-transform:uppercase;border-top:1px solid rgba(255,255,255,.14);padding-top:1.6cqw}
.c-foot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx{position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.holo{background:repeating-linear-gradient(110deg,#ff5fa2 0%,#ffb86b 7%,#f7ff7a 14%,#6bffb3 21%,#6bd2ff 28%,#9a7bff 35%,#ff5fa2 42%);background-size:320% 320%;background-position:var(--mx) var(--my);mix-blend-mode:color-dodge;opacity:.36;filter:saturate(1.3)}
.spark{background-image:radial-gradient(circle at 20% 30%,#fff 0 1.1px,transparent 2.2px),radial-gradient(circle at 70% 60%,#fff 0 1px,transparent 2px),radial-gradient(circle at 45% 80%,#fff 0 1.4px,transparent 2.6px),repeating-linear-gradient(0deg,rgba(255,255,255,.1) 0 1px,transparent 1px 3px);background-size:46px 46px,61px 61px,37px 37px,auto;background-position:calc(var(--nx)*22px) calc(var(--ny)*22px),calc(var(--nx)*-30px) calc(var(--ny)*18px),calc(var(--nx)*14px) calc(var(--ny)*-26px),0 0;mix-blend-mode:color-dodge;opacity:calc(.3 + var(--hy)*.55)}
.sheen{background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.3) 40%,rgba(255,255,255,.06) 48%,transparent 60%);background-size:260% 100%;background-position:var(--mx) 0;mix-blend-mode:soft-light}
.glare{background:radial-gradient(farthest-corner circle at var(--mx) var(--my),rgba(255,255,255,.55) 0%,rgba(255,255,255,.14) 24%,transparent 58%);mix-blend-mode:overlay}

/* deck */
section{padding:clamp(36px,6vw,76px) 0}
.sh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:clamp(18px,3vw,30px)}
.sh small{display:block;font:700 .74rem var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
h2{font:800 clamp(1.8rem,4vw,2.7rem)/1.1 var(--serif);letter-spacing:-.01em}
.ctl{display:flex;align-items:center;gap:10px;font:700 .82rem var(--mono);color:var(--mu)}
.ctl button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--surf);color:var(--tx);display:grid;place-items:center;cursor:pointer;transition:border-color .2s,transform .2s}
.ctl button:hover{border-color:var(--gold);transform:translateY(-1px)}
.ctl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.track{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px max(16px,calc((100vw - 1160px)/2)) 36px;scroll-padding-inline:max(16px,calc((100vw - 1160px)/2));scrollbar-width:thin;scrollbar-color:#4a4580 transparent;cursor:grab;overscroll-behavior-x:contain}
.track.drag{scroll-snap-type:none;cursor:grabbing;scroll-behavior:auto}
.track:focus-visible{outline-offset:-3px}
.jcw{--mx:50%;--my:50%;--nx:0;--ny:0;--hy:.3;flex:none;width:min(304px,80vw);scroll-snap-align:start;perspective:900px}
.jc{--rc:#ffcf4a;--jt:#f4f1ff;--jm:#b4b0d8;position:relative;height:100%;min-height:440px;border-radius:18px;padding:3px;isolation:isolate;overflow:hidden;
 background:linear-gradient(150deg,var(--rc),rgba(255,255,255,.08) 38%,var(--rc) 80%);
 transform:rotateX(calc(var(--ny)*-8deg)) rotateY(calc(var(--nx)*9deg));will-change:transform;transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .3s;
 box-shadow:0 18px 36px rgba(0,0,0,.45)}
.jcw:hover .jc{box-shadow:0 26px 46px rgba(0,0,0,.55),0 0 28px -6px var(--rc);transition:transform .08s linear,box-shadow .3s}
.jc-in{position:relative;height:100%;border-radius:15px;background:radial-gradient(120% 60% at 50% 0,rgba(255,255,255,.08),transparent 70%),linear-gradient(#15142f,#0d0c20);color:var(--jt);display:flex;flex-direction:column;overflow:hidden}
.jc-art{position:relative;height:104px;flex:none;border-bottom:2px solid var(--rc)}
.jc-art svg{display:block;width:100%;height:100%}
.badge{position:absolute;left:12px;top:12px;font:700 .66rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;border-radius:99px;background:var(--rc);color:#14100a;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.no{position:absolute;right:12px;top:12px;font:700 .68rem/1 var(--mono);color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7);letter-spacing:.08em}
.jc-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.jc h3{font:800 1.18rem/1.2 var(--serif);color:#fff}
.jc-co{font-size:.9rem;color:var(--jm)}.jc-co b{color:var(--jt);font-weight:700}
.jt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jt div{background:rgba(255,255,255,.06);border-radius:10px;padding:7px 10px;min-width:0}
.jt small{display:block;font:700 .58rem/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--jm);margin-bottom:4px}
.jt b{font:700 .82rem/1.25 var(--mono);color:var(--rc);display:block}
.jc p.t{font-size:.9rem;color:#d3d0ee;line-height:1.55}
.jc .fx.holo{opacity:.0}
.jc.leg .fx.holo{opacity:.3}
.jcw:hover .jc .fx.holo{opacity:.32}
.jcw:hover .jc.leg .fx.holo{opacity:.46}
.jc .fx{border-radius:18px;transition:opacity .3s}

/* collection */
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.cert{position:relative;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--surf);border:1px solid var(--line);overflow:hidden;transition:transform .3s,border-color .3s}
.cert::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.12) 45%,transparent 60%);background-size:250% 100%;background-position:120% 0;transition:background-position .8s}
.cert:hover{transform:translateY(-3px);border-color:rgba(255,207,74,.6)}
.cert:hover::after{background-position:-20% 0}
.cert svg{flex:none;width:24px;height:24px;margin-top:1px;fill:url(#sg);stroke:none}
.two{display:grid;grid-template-columns:1fr;gap:0 clamp(24px,5vw,64px)}
@media(min-width:900px){.two{grid-template-columns:1.2fr 1fr}}
.list{display:grid;gap:12px}
.panel{padding:16px 20px;border-radius:14px;background:var(--surf);border:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 14px;align-items:baseline}
.panel h3{flex:1 1 100%;font:800 1.08rem/1.3 var(--serif)}
.panel .s{color:var(--mu)}.panel .d{color:var(--gold);font:700 .8rem var(--mono)}
.panel b{font-weight:700}.panel span.l{color:var(--mu);font-size:.92rem}
.contact{position:relative;text-align:center;border-radius:24px;padding:clamp(30px,6vw,64px);background:linear-gradient(#15142f,#0d0c20) padding-box,linear-gradient(135deg,#ff5fa2,#ffcf4a,#6bffb3,#6bd2ff,#9a7bff) border-box;border:2px solid transparent;overflow:hidden}
.contact p{margin:10px auto 0;max-width:34rem;color:var(--mu)}
.contact .acts{justify-content:center}.contact .cl{justify-content:center}
.foot{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between;padding:6px 0 44px;color:var(--mu);font-size:.88rem}
.foot a{color:var(--mu)}

/* reveal */
.rv{transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.js .rv:not(.in){opacity:0;transform:translateY(22px) scale(.97)}
html.still *,html.still *::before,html.still *::after{transition:none!important;animation:none!important}
html.still .rv{opacity:1!important;transform:none!important}
html.still{scroll-behavior:auto}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.glow{animation:none}}

@media print{
 @page{margin:12mm}
 html,body{background:#fff!important;color:#000!important}
 body{font-size:10pt;line-height:1.4;background-image:none!important}
 *,*::before,*::after{animation:none!important;transition:none!important;box-shadow:none!important}
 .top,.fx,.glow,.hint,.ctl,.acts,.c-art,.jc-art,.contact .acts,.foot a{display:none!important}
 .wrap{width:100%}
 .hero{display:block;padding:0 0 8pt}
 h1{font-size:26pt;color:#000!important;background:none!important;-webkit-text-fill-color:#000}
 .ttl,.sum,.cl a,.contact p{color:#000!important}
 .stage{width:76mm;padding:0;margin:8pt 0;perspective:none}
 .card{transform:none!important;border:1pt solid #000;background:#fff!important;padding:2mm;border-radius:6pt}
 .face{--ft:#000;--fm:#333;--fa:#000;background:#fff!important;color:#000}
 .c-name,.atk .dm,.c-hp,.st b{color:#000!important}
 .st .seg i{background:#ddd!important;border:.5pt solid #000}.st .seg i.on{background:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .orbs i{background:#000!important;box-shadow:none}
 .c-rar{display:none}
 section{padding:10pt 0}
 h2{font-size:15pt;border-bottom:1pt solid #000;padding-bottom:2pt}
 .sh{margin-bottom:6pt;display:block}.sh small{display:none}
 .track{display:block;overflow:visible;padding:0;cursor:auto}
 .jcw{width:100%;margin-bottom:6pt;break-inside:avoid;perspective:none}
 .jc{transform:none!important;min-height:0;background:#fff!important;border:.5pt solid #000;border-radius:0;padding:0}
 .jc-in{background:#fff!important;color:#000;border-radius:0}
 .jc h3,.jc-co,.jc-co b,.jc p.t{color:#000!important}
 .jt b{color:#000!important}.jt small{color:#333}.jt div{background:none;padding:0}
 .badge{background:none;color:#000;border:.5pt solid #000;position:static;display:inline-block;margin:4pt 8pt 0}.no{display:none}
 .jc-body{padding:4pt 8pt 6pt}
 .certs{grid-template-columns:1fr 1fr;gap:4pt}.cert,.panel{background:none!important;border:0!important;padding:2pt 0!important;color:#000}.cert svg{display:none}.cert::after{display:none}
 .two{display:block}.panel .s,.panel span.l{color:#333}.panel .d{color:#000}
 .contact{background:none!important;border:0;padding:6pt 0;text-align:left}.contact .cl{justify-content:flex-start}
 .rv{opacity:1!important;transform:none!important}
}
</style>

function Tilt(el,idle,rest){

}
