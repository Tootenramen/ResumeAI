<style>

*,*::before,*::after{box-sizing:border-box}
*{margin:0}

body{background-color:var(--bg);background-image:linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.035) 1px,transparent 1px);background-size:32px 32px;color:var(--ink);font:400 1rem/1.55 var(--f);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}

:focus-visible{outline:3px solid #0039a6;outline-offset:3px;border-radius:4px}
.skipl{position:absolute;left:8px;top:-60px;background:#fff;color:#111;padding:10px 16px;border-radius:8px;z-index:300;font-weight:700}.skipl:focus{top:8px}
.wrap{width:min(1100px,100% - 32px);margin:0 auto}

/* bullets (route-number discs) */
.bul{display:inline-grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:var(--c,#111);color:var(--t,#fff);font:800 .78rem/1 var(--f)}

/* top bar */
.top{position:sticky;top:0;z-index:100;background:#111;color:#fff}
.top .in{width:min(1100px,100% - 32px);margin:0 auto;display:flex;align-items:center;gap:18px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;letter-spacing:.02em;margin-right:auto;min-width:0}
.brand .bul{background:#fff;color:#111;width:30px;height:30px}
#bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top nav{display:none;gap:4px}
.top nav a{text-decoration:none;font-weight:500;font-size:.9rem;padding:8px 12px;border-radius:99px;color:#ddd}
.top nav a:hover{background:#2a2a2a;color:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:99px;background:#111;color:#fff;border:2px solid #111;font:700 .95rem var(--f);text-decoration:none;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s,color .2s}

.top .btn{min-height:38px;padding:0 16px;background:#fff;color:#111;border-color:#fff;font-size:.85rem}

.mini path{fill:none;stroke-width:8;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;animation:dr .7s ease-out both;animation-delay:var(--d)}
.mini circle{fill:#fffdf8;stroke:#111;stroke-width:3;animation:fi .4s ease-out both;animation-delay:var(--d)}

.ttl{margin-top:18px;font:700 clamp(1.05rem,2.4vw,1.4rem)/1.35 var(--f);max-width:30em;padding-left:16px;border-left:8px solid var(--tc,#0039a6)}

.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

.cl svg{width:18px;height:18px;fill:none;stroke:#111;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

.key h2{font:800 .85rem var(--f);letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.key h2::after{content:'';flex:1;height:3px;background:#111}
.key ul{display:grid;gap:9px}
.key li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;font-size:.9rem;line-height:1.3}
.key li svg{width:44px;height:26px;overflow:visible}
.key li b{display:block;font-weight:700}
.key li span{color:var(--mut);font-size:.82rem}
.key h3{font:700 .72rem var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
.key .lines li{grid-template-columns:44px 1fr;gap:12px}

section{padding:clamp(36px,6vw,72px) 0}

.skl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px 26px}

 .bh{padding:8pt 0 2pt;break-after:avoid}.bh .bul{display:none}.bh h3{font:800 13pt var(--f);border-bottom:1pt solid #000;width:100%}.bh small{display:none}

}

/* ---------- mini route (hero ornament) ---------- */
function mini(){
 var n=cj.length;if(n<2)return '';
 var W=520,x0=14,step=(W-2*x0)/(n-1),lv=[10,30],pts=[];
 cj.forEach(function(j,i){pts.push([x0+i*step,lv[Math.max(0,emps.indexOf(String(j.co||'')))%2]])});
 var s='<svg class="mini" viewBox="0 0 '+W+' 40" aria-hidden="true">';
 for(var i=1;i<n;i++){var a=pts[i-1],b=pts[i],c=ec(cj[i].co)[0],d;
  if(a[1]===b[1])d='M'+a[0]+' '+a[1]+'H'+b[0];else{var dy=Math.abs(b[1]-a[1]);d='M'+a[0]+' '+a[1]+'H'+(b[0]-dy)+'L'+b[0]+' '+b[1]}
  s+='<path pathLength="1" d="'+d+'" stroke="'+c+'" style="--d:'+(.15+i*.35)+'s"/>'}
 pts.forEach(function(p,i){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="6.5" style="--d:'+(i*.35)+'s"/>'});
 return s+'</svg>'}

/* ---------- legend ---------- */
function key(){
 var sv=function(inner){return '<svg viewBox="0 0 44 26" aria-hidden="true">'+inner+'</svg>'};
 var line='<path d="M0 13h44" stroke="#d8d2c2" stroke-width="8"/>';
 var rows=[
  [sv(line+'<circle cx="22" cy="13" r="8" fill="#fffdf8" stroke="#111" stroke-width="4"/>'),'Station','A role you held'],
  [sv(line+'<circle cx="22" cy="13" r="11" fill="#fffdf8" stroke="#111" stroke-width="4"/>'),'Interchange','Change of employer'],
  [sv('<path d="M0 13h22" stroke="#d8d2c2" stroke-width="8"/><circle cx="26" cy="13" r="11" fill="#111" stroke="#111" stroke-width="4"/><circle cx="26" cy="13" r="4" fill="#fff"/>'),'Terminus','Where the line begins and ends'],
  [sv('<path d="M0 6h14l12 14h18" fill="none" stroke="#996633" stroke-width="6" stroke-linejoin="round"/>'),'Branch line','Education and certifications'],
  [sv(line+'<circle cx="22" cy="13" r="11" fill="#fff" stroke="#111" stroke-width="2.5"/><circle cx="22" cy="13" r="6.5" fill="#0039a6"/>'),'The train','You are here: follows your scroll']
 ];
 var s='<aside class="key rv" style="--d:.2s" aria-label="Map legend"><h2>Key</h2><ul>'+rows.map(function(r){return '<li>'+r[0]+'<div><b>'+r[1]+'</b><span>'+r[2]+'</span></div></li>'}).join('')+'</ul>';
 if(emps.length){s+='<h3>Lines (employers)</h3><ul class="lines">'+emps.map(function(c){var r=span(c);return '<li><i class="sw" style="--c:'+ec(c)[0]+'"></i><div><b>'+esc(c||'Independent')+'</b>'+(r?'<span>'+esc(r)+'</span>':'')+'</div></li>'}).join('')+'</ul>'}
 return s+'</aside>'}

/* ---------- render ---------- */
var lw=['','Foundational','Working','Proficient','Advanced','Expert'];
var sh=function(id,label,t,c){return '<div class="sh rv">'+(c?bul(c,'',' l'):'')+'<div><small>'+label+'</small><h2 id="h-'+id+'">'+t+'</h2></div></div>'};
var out='<div class="wrap hero" id="hero"><div>'+mini()+
 '<p class="eyebrow rv"><span>Career Line</span><span>·</span><span>Service map</span></p>'+
 '<h1 id="nm" class="rv" style="--d:.06s">'+esc(name).split(/\s+/).map(function(w){return '<span>'+w+'</span>'}).join(' ')+'</h1>'+
 (title?'<p class="ttl rv" style="--d:.14s;--tc:'+lastC[0]+'">'+esc(title)+'</p>':'')+
 (sum?'<p class="sum rv" style="--d:.2s">'+esc(sum)+'</p>':'')+
 '<div class="acts rv" style="--d:.26s">'+(email?'<a class="btn" href="mailto:'+esc(email)+'">'+IC.mail+'Email me</a>':'')+'<button type="button" class="btn o pdfb">'+IC.dl+'Download PDF</button></div>'+
 '<address class="cl rv" style="--d:.3s">'+(email?'<a href="mailto:'+esc(email)+'">'+IC.mail+esc(email)+'</a>':'')+(phone?'<a href="tel:'+esc(tel)+'">'+IC.phone+esc(phone)+'</a>':'')+'</address>'+
 '</div>'+key()+'</div>';

if(skills.length||langs.length){out+='<section id="skills" aria-labelledby="h-skills"><div class="wrap">'+sh('skills','Service lines','Skills',PAL[2]);
 if(skills.length)out+='<ul class="skl">'+skills.map(function(s,i){var lv=Math.max(1,Math.min(5,Math.round(Number(s[1])||3))),c=PAL[(i+1)%PAL.length],dots='';
  for(var k=0;k<5;k++)dots+='<b'+(k<lv?' class="on"':'')+' style="--i:'+k+'"></b>';
  return '<li class="sk rv" style="--d:'+(i%4*.08)+'s;--c:'+c[0]+'">'+bul(c,i+1,' l')+'<div><div class="skn"><span>'+esc(s[0])+'</span><small>'+lw[lv]+'</small></div><div class="trk" role="img" aria-label="'+lw[lv]+', '+lv+' out of 5"><i class="fill" style="--f:'+(lv-1)/4+'"></i>'+dots+'</div></div></li>'}).join('')+'</ul>';
 if(langs.length)out+='<div class="lgs rv"><h3>Announcements made in</h3>'+langs.map(function(l,i){return '<div class="lg">'+bul(PAL[(i+3)%PAL.length],String(l[0]||'').slice(0,2).toUpperCase())+'<b>'+esc(l[0]||'')+'</b>'+(l[1]?'<span>'+esc(l[1])+'</span>':'')+'</div>'}).join('')+'</div>';
 out+='</div></section>'}

var st='';
if(jobs.length)st+='<li class="ph">Experience</li>';
cj.forEach(function(j,i){var c=ec(j.co),prev=i?String(cj[i-1].co||''):null,xf=i>0&&String(j.co||'')!==prev,t=i===0?'origin':xf?'xfer':'stn';
 st+='<li class="st job" data-k="job" data-c="'+c[0]+'" data-e="'+Math.max(0,emps.indexOf(String(j.co||'')))+'" data-t="'+t+'" data-h="'+esc((j.co?j.co+' · ':'')+(j.role||''))+'"><i class="pin"></i><div class="sc rv">'+
  (j.dates?'<span class="stop">'+esc(j.dates)+'</span>':'')+(xf?'<span class="xf">Interchange from '+esc(prev||'previous line')+'</span>':'')+
  '<h3>'+esc(j.role||'')+'</h3>'+((j.co||j.loc)?'<p class="co">'+bul(c,String(j.co||'?').charAt(0).toUpperCase())+(j.co?'<span>'+esc(j.co)+'</span>':'')+(j.loc?'<span class="loc">'+esc(j.loc)+'</span>':'')+'</p>':'')+(j.text?'<p class="t">'+esc(j.text)+'</p>':'')+'</div></li>'});
var hasBr=edu.length||certs.length;
if(hasBr)st+='<li class="st jn" data-k="jn" data-c="'+lastC[0]+'" data-h="Credentials Junction"><i class="pin"></i><div class="sc rv"><span class="stop">Interchange</span><h3>Credentials Junction</h3><p class="t">Change here for the '+[edu.length?'Education':'',certs.length?'Certification':''].filter(Boolean).join(' and ')+' '+(edu.length&&certs.length?'lines':'line')+'.</p></div></li>';
function branch(g,c,label,sub,items){return '<li class="gap" aria-hidden="true"></li><li class="st bh" data-k="bh" data-g="'+g+'" data-c="'+c[0]+'"><i class="pin"></i><div class="sc rv">'+bul(c,g==='edu'?'E':'C','')+'<div><h3>'+label+'</h3><small>'+sub+'</small></div></div></li>'+items+'<li class="gap" aria-hidden="true"></li>'}
if(edu.length)st+=branch('edu',EDUC,'Education Line','Branches off the main line',edu.map(function(e){return '<li class="st bs" data-k="bs" data-g="edu" data-c="'+EDUC[0]+'"><i class="pin"></i><div class="sc rv"><h4>'+esc(e[0]||'')+'</h4><p>'+esc([e[2],e[1]].filter(Boolean).join(' · '))+'</p></div></li>'}).join(''));
if(certs.length)st+=branch('cert',CERTC,'Certification Line','Branches off the main line',certs.map(function(c){return '<li class="st bs" data-k="bs" data-g="cert" data-c="'+CERTC[0]+'"><i class="pin"></i><div class="sc rv"><p class="one" style="color:inherit">'+esc(c)+'</p></div></li>'}).join(''));
st+='<li class="st en" data-k="end" data-c="'+lastC[0]+'" data-h="Terminus: next stop, you"><i class="pin"></i><div class="sc rv" id="contact"><span class="stop">Terminus</span><h2>Next stop: your team</h2><p class="t">This line is open for service. All change here for a conversation.</p><div class="acts">'+(email?'<a class="btn" href="mailto:'+esc(email)+'">'+IC.mail+'Email me</a>':'')+(phone?'<a class="btn o" href="tel:'+esc(tel)+'">'+IC.phone+'Call '+esc(phone)+'</a>':'')+'<button type="button" class="btn o pdfb">'+IC.dl+'Download PDF</button></div></div></li>';
out+='<section id="route" aria-labelledby="h-route"><div class="wrap">'+sh('route','Route map','Career Line',PAL[0])+'<div class="map" id="map"><svg id="svg" aria-hidden="true" focusable="false"></svg><ol class="stops">'+st+'</ol></div>'+
 '<div class="foot"><span>© '+new Date().getFullYear()+' '+esc(name)+'</span><a href="#hero">Back to top ↑</a></div></div></section>';
$('#app').innerHTML=out;
$$('.pdfb,#pdf0').forEach(function(b){b.addEventListener('click',function(){window.print()})});

/* education/certs need a print heading: the branch header doubles as one */

/* ---------- reveal ---------- */
var targets=$$('.rv,.sk');
if(still||!('IntersectionObserver' in window)){targets.forEach(function(t){t.classList.add('in')})}
else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -5% 0px'});targets.forEach(function(t){io.observe(t)})}

/* ---------- the map: geometry, scroll-drawn lines, train ---------- */
var map=$('#map'),svg=$('#svg'),hud=$('#hud'),G=null,tick=false,lastKey='';
function pts(ax,ay,bx,by){if(ax===bx)return [[ax,ay],[bx,by]];var m=(ay+by)/2,d=Math.abs(bx-ax)/2;return [[ax,ay],[ax,m-d],[bx,m+d],[bx,by]]}
function D2(p){return 'M'+p.map(function(q){return q[0].toFixed(1)+' '+q[1].toFixed(1)}).join('L')}
function layout(){
 if(!map)return;
 var narrow=innerWidth<640,base=narrow?18:36,jog=narrow?10:20,dx=narrow?34:56,gut=narrow?76:132,bx=base+dx,lw_=narrow?8:10;
 map.style.setProperty('--gut',gut+'px');map.style.setProperty('--dx',dx+'px');
 var mr=map.getBoundingClientRect(),W=Math.round(mr.width),H=Math.round(mr.height);
 var key=W+'x'+H+'x'+narrow;if(key===lastKey&&G)return;lastKey=key;
 svg.setAttribute('width',W);svg.setAttribute('height',H);svg.setAttribute('viewBox','0 0 '+W+' '+H);
 var nodes=$$('.st',map).map(function(li){var r=$('.pin',li).getBoundingClientRect();return {k:li.dataset.k,g:li.dataset.g||'',c:li.dataset.c||'#111',t:li.dataset.t||'',e:+li.dataset.e||0,h:li.dataset.h||'',y:r.top-mr.top+.5}});
 var main=nodes.filter(function(n){return n.k==='job'||n.k==='jn'||n.k==='end'});
 main.forEach(function(n){n.x=base+(n.k==='job'&&n.e%2?jog:0)});
 var s='',dr=[],stn=[],mp=[],segs=[];
 for(var i=1;i<main.length;i++){var a=main[i-1],b=main[i];segs.push({p:pts(a.x,a.y,b.x,b.y),c:b.c,y0:a.y,y1:b.y})}
 segs.forEach(function(sg,i){sg.p.forEach(function(p,j){if(i&&!j)return;mp.push(p)})});
 if(mp.length)s+='<path class="ghost" stroke-width="'+lw_+'" d="'+D2(mp)+'"/>';
 var br=[];['edu','cert'].forEach(function(g){var h=nodes.filter(function(n){return n.k==='bh'&&n.g===g})[0];if(!h)return;var it=nodes.filter(function(n){return n.k==='bs'&&n.g===g}),ly=it.length?it[it.length-1].y:h.y;h.x=bx;it.forEach(function(n){n.x=bx});
  var p=[[base,h.y-dx],[bx,h.y],[bx,ly],[base,ly+dx]];br.push({p:p,c:h.c,y0:h.y-dx,y1:ly+dx})});
 br.forEach(function(b){s+='<path class="ghost" stroke-width="'+(lw_-2)+'" d="'+D2(b.p)+'"/>'});
 segs.concat(br).forEach(function(sg,i){s+='<path class="ln" data-d="'+i+'" stroke-width="'+(sg.p===br[0]?lw_:lw_)+'" stroke="'+sg.c+'" d="'+D2(sg.p)+'"/>'});
 var all=segs.concat(br);
 function C(n,r,cls,extra){return '<circle class="stn '+cls+'" cx="'+n.x+'" cy="'+n.y.toFixed(1)+'" r="'+r+'" style="--c:'+n.c+'" data-y="'+n.y.toFixed(1)+'"'+(extra||'')+'/>'}
 nodes.forEach(function(n){if(n.x==null)return;
  if(n.k==='job'){var r=n.t==='origin'?13:n.t==='xfer'?12:9;s+=C(n,r,'');if(n.t==='origin')s+='<circle cx="'+n.x+'" cy="'+n.y.toFixed(1)+'" r="4" fill="#111"/>'}
  else if(n.k==='jn'){s+=C(n,14,'')+'<circle class="ring" cx="'+n.x+'" cy="'+n.y.toFixed(1)+'" r="6"/>'}
  else if(n.k==='end'){s+=C(n,15,'endc')+'<circle cx="'+n.x+'" cy="'+n.y.toFixed(1)+'" r="5" fill="#fff"/>'}
  else if(n.k==='bh')s+=C(n,10,'');
  else if(n.k==='bs')s+=C(n,6,'sm')});
 s+='<g id="train" style="--tc:'+lastC[0]+'"><circle class="pulse" r="17"/><circle class="th" r="11"/><circle class="tr" r="6.5"/></g>';
 svg.innerHTML=s;
 $$('.ln',svg).forEach(function(el){var sg=all[+el.dataset.d],len=el.getTotalLength();el.style.strokeDasharray=len;el.style.strokeDashoffset=len;dr.push({el:el,len:len,y0:sg.y0,y1:sg.y1,c:sg.c})});
 $$('.stn',svg).forEach(function(el){stn.push({el:el,y:+el.dataset.y})});
 G={dr:dr,stn:stn,mp:mp,tr:$('#train',svg),hn:main,y0:main.length?main[0].y:0,yE:main.length?main[main.length-1].y:0,segs:segs};
 upd()}
function xAt(y){var mp=G.mp;if(!mp.length)return 0;for(var i=1;i<mp.length;i++){var a=mp[i-1],b=mp[i];if(y<=b[1]){var t=b[1]===a[1]?0:(y-a[1])/(b[1]-a[1]);return a[0]+(b[0]-a[0])*Math.max(0,Math.min(1,t))}}return mp[mp.length-1][0]}
function upd(){tick=false;if(!G||!map)return;
 var mr=map.getBoundingClientRect(),ty=still?G.yE:Math.max(G.y0,Math.min(G.yE,innerHeight*.55-mr.top));
 G.dr.forEach(function(d){var f=d.y1>d.y0?Math.max(0,Math.min(1,(ty-d.y0)/(d.y1-d.y0))):1;d.el.style.strokeDashoffset=(d.len*(1-f)).toFixed(1)});
 G.stn.forEach(function(s){s.el.classList.toggle('lit',s.y<=ty+1)});
 G.tr.setAttribute('transform','translate('+xAt(ty).toFixed(1)+' '+ty.toFixed(1)+')');
 var cur=G.hn[0];G.hn.forEach(function(n){if(n.y<=ty+1)cur=n});
 if(cur){G.tr.style.setProperty('--tc',cur.c);if(!still){var on=mr.top<innerHeight*.6&&mr.bottom>innerHeight*.4;hud.classList.toggle('on',on);$('#hudb').style.cssText='--c:'+cur.c+';--t:#fff';$('#hudt').textContent=(cur.k==='end'?'':'Now at ')+cur.h}}}
function req(){if(!tick){tick=true;requestAnimationFrame(upd)}}
function relayout(){lastKey='';layout()}
addEventListener('scroll',req,{passive:true});
addEventListener('resize',function(){requestAnimationFrame(layout)});
addEventListener('load',relayout);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(relayout);
if('ResizeObserver' in window&&map)new ResizeObserver(function(){requestAnimationFrame(layout)}).observe(map);
layout();
})();
</script>
