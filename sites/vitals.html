if(sum||email||phone)out+='<section><div class="wrap">'+ph('Patient Chart','Patient Chart')+'<div class="chart card rv"><dl><div><dt>Name</dt><dd>'+esc(name)+'</dd></div>'+(title?'<div><dt>Specialty</dt><dd>'+esc(title)+'</dd></div>':'')+(years>=1?'<div><dt>Experience</dt><dd>'+years+'+ years</dd></div>':'')+(phone?'<div><dt>Contact line</dt><dd><a href="tel:'+esc(tel)+'">'+esc(phone)+'</a></dd></div>':'')+(email?'<div><dt>Correspondence</dt><dd><a href="mailto:'+esc(email)+'">'+esc(email)+'</a></dd></div>':'')+'</dl><div class="body"><h3>Clinical summary</h3>'+(sum?'<p>'+esc(sum)+'</p>':'')+'</div></div></div></section>';
if(jobs.length)out+='<section id="experience"><div class="wrap">'+ph('Shift Log','Shift log &mdash; career history')+'<ol class="log" id="log">'+jobs.map(function(j,i){return '<li class="shift card rv"><div class="sh-top"><span class="sh-id">Entry '+pad(jobs.length-i)+' &middot; Assignment</span>'+(j.dates?'<span class="sh-dt">'+esc(j.dates)+'</span>':'')+'</div><h3>'+esc(j.role||'')+'</h3>'+((j.co||j.loc)?'<p class="cmp">'+esc(j.co||'')+(j.co&&j.loc?' <span>&middot;</span> ':'')+(j.loc?'<span>'+esc(j.loc)+'</span>':'')+'</p>':'')+(j.text?'<p class="t">'+esc(j.text)+'</p>':'')+'</li>'}).join('')+'</ol></div></section>';
if(skills.length)out+='<section id="skills"><div class="wrap">'+ph('Monitored Skills','Skill gauges')+'<ul class="gauges">'+skills.map(function(s,i){var n=lvl(s[1]),arc=179.07*n/5;return '<li class="gk card rv" style="--d:'+(i%4*.08)+'s;--k:'+(i%2?'var(--c)':'var(--g)')+'"><svg viewBox="0 0 100 100" role="img" aria-label="'+lw[n]+', '+n+' out of 5"><circle class="tr" cx="50" cy="50" r="38" stroke-dasharray="179.07 238.76" transform="rotate(135 50 50)"/><circle class="val" cx="50" cy="50" r="38" style="stroke-dasharray:'+arc.toFixed(2)+' 238.76" transform="rotate(135 50 50)"/><text x="50" y="56">'+n+'</text><text class="s" x="50" y="70">OF 5</text></svg><h3>'+esc(s[0])+'</h3><span class="lv">'+lw[n]+'</span></li>'}).join('')+'</ul></div></section>';
if(certs.length)out+='<section id="credentials"><div class="wrap">'+ph('Licenses & Credentials','Licenses &amp; credentials')+'<ul class="creds">'+certs.map(function(c,i){return '<li class="card rv" style="--d:'+(i%3*.07)+'s"><i>'+pad(i+1)+'</i><span>'+esc(c)+'</span>'+IC.ok+'</li>'}).join('')+'</ul></div></section>';
if(edu.length||langs.length){out+='<section><div class="wrap two">';
 if(edu.length)out+='<div>'+ph('Training','Education')+'<div class="rows">'+edu.map(function(e,i){return '<div class="row card rv" style="--d:'+(i*.07)+'s"><h3>'+esc(e[0]||'')+'</h3>'+(e[2]?'<span class="s">'+esc(e[2])+'</span>':'')+(e[1]?'<span class="d">'+esc(e[1])+'</span>':'')+'</div>'}).join('')+'</div></div>';
 if(langs.length)out+='<div>'+ph('Communication','Languages')+'<div class="rows">'+langs.map(function(l,i){return '<div class="row card rv" style="--d:'+(i*.07)+'s"><b>'+esc(l[0]||'')+'</b>'+(l[1]?'<span class="lg">'+esc(l[1])+'</span>':'')+'</div>'}).join('')+'</div></div>';
 out+='</div></section>'}

 '<div class="foot"><span>&copy; '+new Date().getFullYear()+' '+esc(name)+'</span><a href="#top">Back to top &uarr;</a></div></div>';

/* reveal + count-up */
function count(el){var to=+el.dataset.to,sfx=el.dataset.sfx||'';if(still||!to){el.textContent=to+sfx;return}var t0=null,dur=1400;el.textContent='0'+sfx;(function f(t){if(!t0)t0=t;var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e)+sfx;if(p<1)requestAnimationFrame(f)})(performance.now())}
var targets=$$('.rv');
if(still||!('IntersectionObserver' in window)){targets.forEach(function(t){t.classList.add('in')});$$('.vt b').forEach(count)}
else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');if(e.target.classList.contains('vt'))count($('b',e.target));io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -5% 0px'});targets.forEach(function(t){io.observe(t)});$$('.vt b').forEach(function(b){b.textContent='0'+(b.dataset.sfx||'')})}

/* shift-log progress line */
var logEl=$('#log'),tick=false;
function upd(){if(logEl){var r=logEl.getBoundingClientRect(),p=(innerHeight*.6-r.top)/r.height;logEl.style.setProperty('--tp',still?1:Math.max(0,Math.min(1,p)))}tick=false}
addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});addEventListener('resize',upd);upd();

/* ECG monitor */
(function(){
 var cv=$('#ecg');if(!cv||!cv.getContext)return;var cx=cv.getContext('2d'),W=0,H=0,dpr=1,head=0,last=0,BEAT=300;
 function size(){var b=cv.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,Math.round(b.width));H=Math.max(1,Math.round(b.height));cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);BEAT=W<600?210:300;draw()}
 function g(x,c,w){return Math.exp(-Math.pow((x-c)/w,2))}
 function wave(x){var p=(x%BEAT)/BEAT,y=0.10*g(p,.18,.035)-0.07*g(p,.38,.012)+1.0*g(p,.41,.010)-0.22*g(p,.44,.012)+0.20*g(p,.64,.05);return y}
 function yAt(x){return H*.62-wave(x)*H*.46}
 function draw(){
  cx.clearRect(0,0,W,H);cx.lineWidth=2;cx.lineJoin='round';cx.lineCap='round';cx.shadowColor='#39ffa6';cx.shadowBlur=8;
  var step=3,gap=34,tail=W*.85;
  for(var x=0;x<W;x+=step){
   var age=still?0:((head-x)%W+W)%W;
   if(!still&&age>W-gap)continue;
   var a=still?.9:Math.max(0,1-age/tail);if(a<.03)continue;
   cx.strokeStyle='rgba(57,255,166,'+a.toFixed(3)+')';cx.beginPath();cx.moveTo(x,yAt(x));cx.lineTo(x+step,yAt(x+step));cx.stroke()}
  if(!still){var hx=head%W;cx.shadowBlur=14;cx.fillStyle='#e8fff4';cx.beginPath();cx.arc(hx,yAt(hx),3,0,6.3);cx.fill()}
 }
 function frame(t){if(!last)last=t;var dt=Math.min(.05,(t-last)/1000);last=t;head=(head+dt*150)%W;draw();requestAnimationFrame(frame)}
 size();addEventListener('resize',size);
 if(!still)requestAnimationFrame(frame);
})();
})();
</script>
