<style>

/* the carbon-copy stack */
.sheet{position:relative;width:min(940px,100% - 20px);margin:0 auto;background:var(--paper);background-image:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 160px),repeating-linear-gradient(0deg,rgba(150,120,0,.035) 0 1px,transparent 1px 3px);box-shadow:0 1px 0 rgba(0,0,0,.2),0 18px 40px rgba(60,45,10,.35);padding:0 clamp(12px,3vw,34px) clamp(18px,3vw,30px);isolation:isolate}
.sheet::before,.sheet::after{content:'';position:absolute;inset:0;z-index:-1;box-shadow:0 8px 20px rgba(60,45,10,.22)}
.sheet::before{background:#fdfdf6;transform:rotate(-.7deg) translate(-6px,6px)}
.sheet::after{background:#ffd9dc;transform:rotate(.6deg) translate(7px,12px);z-index:-2}
.stub{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 calc(-1 * clamp(12px,3vw,34px)) 0;padding:9px clamp(12px,3vw,34px);border-bottom:3px dashed rgba(0,0,0,.35);font:500 .78rem var(--lab);letter-spacing:.14em;text-transform:uppercase;color:#5b4d10}
.stub b{color:var(--red)}

.top{display:grid;gap:12px 24px;grid-template-columns:1fr auto;align-items:end;padding:clamp(16px,3vw,28px) 0 14px}

@media(max-width:560px){.top{grid-template-columns:1fr}.no{text-align:left}}

/* ruled boxes */
.bx{border:3px solid var(--blk);background:var(--field);position:relative;margin-top:clamp(16px,2.6vw,26px)}
.bh{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--blk);color:#ffe45c;font:700 1.05rem var(--lab);letter-spacing:.18em;text-transform:uppercase;padding:6px 14px}

.flds{display:grid;grid-template-columns:1fr 1fr}
.fld{padding:8px 14px 10px;border-bottom:2px solid var(--blk);min-width:0}
.fld:nth-child(odd){border-right:2px solid var(--blk)}
.fld.w{grid-column:1/-1;border-right:0}
.flds .fld:nth-last-child(-n+1){border-bottom:0}
.flds.ev .fld:nth-last-child(-n+2){border-bottom:0}
.lb{display:block;font:500 .74rem var(--lab);letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.v{display:block;font:400 clamp(1.1rem,3vw,1.4rem)/1.3 var(--typ);color:var(--ink);overflow-wrap:anywhere}

@media(max-width:560px){.flds{grid-template-columns:1fr}.fld:nth-child(odd){border-right:0}.flds .fld:nth-last-child(-n+2){border-bottom:2px solid var(--blk)}.flds .fld:last-child{border-bottom:0}}
.lined{padding:6px 16px 14px;background-image:repeating-linear-gradient(180deg,transparent 0 calc(1.75em - 1px),var(--hair) calc(1.75em - 1px) 1.75em);background-position:0 .35em;font:400 1.06rem/1.75 var(--typ);color:var(--ink)}

/* buttons */

.btn{display:flex;align-items:center;justify-content:center;gap:12px;min-height:68px;padding:8px 16px;border:3px solid var(--blk);background:var(--blk);color:#ffe45c;font:700 clamp(1.1rem,3.4vw,1.5rem) var(--lab);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:5px 5px 0 rgba(0,0,0,.3);transition:transform .15s,box-shadow .15s;text-align:center;line-height:1.1;overflow-wrap:anywhere}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 rgba(0,0,0,.3)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 rgba(0,0,0,.3)}
.btn.y{background:#ffe45c;color:var(--blk)}
.btn.w{background:#fffdf0;color:var(--blk)}
.btn svg{width:28px;height:28px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btn small{display:block;font:400 .72rem var(--typ);letter-spacing:.02em;text-transform:none;opacity:.85}

/* line items */
table{width:100%;border-collapse:collapse}
thead th{background:var(--blk);color:#ffe45c;font:700 .95rem var(--lab);letter-spacing:.18em;text-transform:uppercase;text-align:left;padding:7px 12px}
td{padding:14px 12px;vertical-align:top;border-top:2px solid var(--blk)}
th+th,td+td{border-left:2px solid var(--blk)}
.q{width:92px;text-align:center}
.q b{display:block;font:400 2rem/1 var(--typ);color:var(--ink)}

.d h3{font:700 1.18rem/1.25 var(--body);text-transform:uppercase;letter-spacing:.01em}
.d .co{display:block;font:400 1.02rem var(--typ);color:var(--ink);margin:2px 0 6px}
.d p{font-size:.98rem;line-height:1.5}
.r{width:150px;font:400 1rem/1.35 var(--typ);color:var(--ink)}
.am{width:190px}
.tbar{height:22px;border:3px solid var(--blk);background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(0,0,0,.18) 11px 12px);overflow:hidden}
.tbar i{display:block;height:100%;width:var(--w);background:repeating-linear-gradient(135deg,var(--ink) 0 5px,#2f58c4 5px 9px);transform-origin:left;transition:transform 1.3s cubic-bezier(.3,.7,.2,1) .25s}
.js tr.rv:not(.in) .tbar i{transform:scaleX(0)}
.am em,.mt{display:block;font:400 .98rem var(--typ);color:var(--ink);font-style:normal;margin-top:5px}
.dl{display:none}
.tot{display:grid;grid-template-columns:1fr auto;border-top:3px solid var(--blk);font:400 1.05rem var(--typ)}

.tot>div:nth-child(odd){font:500 .85rem var(--lab);letter-spacing:.16em;text-transform:uppercase;color:var(--red);text-align:right;padding-top:11px}
.tot>div:nth-child(even){min-width:220px;text-align:right}
.tot .big{font-size:1.5rem;border-bottom:0;font-weight:400}
@media(max-width:700px){
 thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

 .r,.am{width:auto}.r{padding-top:0}
 .dl{display:inline;font:500 .72rem var(--lab);letter-spacing:.16em;color:var(--red);text-transform:uppercase;margin-right:8px}
 .tot{grid-template-columns:1fr}.tot>div:nth-child(odd){text-align:left;border-bottom:0;padding-bottom:0}.tot>div:nth-child(even){text-align:left;min-width:0}
}

/* checklist */
.chk{display:grid;grid-template-columns:1fr 1fr}
.chk li{display:flex;align-items:center;gap:14px;padding:12px 14px;border-bottom:2px solid var(--hair);min-width:0}
.chk li:nth-child(odd){border-right:2px solid var(--blk)}
.cb{flex:none;width:34px;height:34px;border:3px solid var(--blk);background:#fff;position:relative}
.cb svg{position:absolute;left:-6px;top:-12px;width:46px;height:46px;overflow:visible}
.cb path{fill:none;stroke:var(--ink);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset .5s ease var(--cd,0s)}
.js .chk li:not(.in) .cb path{stroke-dashoffset:1}
.sk{flex:1;min-width:0;font:700 1.06rem/1.25 var(--body)}
.sk small{display:block;font:500 .74rem var(--lab);letter-spacing:.16em;color:var(--red);text-transform:uppercase;margin-top:2px}
.pips{flex:none;display:flex;gap:3px}.pips b{width:9px;height:20px;border:2px solid var(--blk);background:transparent}.pips b.on{background:var(--blk)}
@media(max-width:700px){.chk{grid-template-columns:1fr}.chk li:nth-child(odd){border-right:0}}

/* licences */
.lic{display:grid;grid-template-columns:1fr 1fr;gap:0}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 clamp(16px,3vw,28px)}
@media(max-width:700px){.pair{grid-template-columns:1fr}}
.rowl{padding:11px 14px;border-bottom:2px solid var(--hair);display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px}
.rowl b{font:400 1.12rem var(--typ);color:var(--ink)}.rowl span{font-size:.95rem}
.rowl small{flex:1 1 100%;font-size:.95rem}

/* sign-off */
.auth{padding:16px 14px 20px}
.auth p.fine{font-size:.9rem;margin-bottom:16px;max-width:60ch}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:26px 30px}
@media(max-width:700px){.sigs{grid-template-columns:1fr}}
.sg{position:relative;min-height:112px;border-bottom:3px solid var(--blk);padding-top:4px}
.sg .x{position:absolute;left:0;bottom:6px;font:700 1.5rem var(--lab);color:var(--blk)}
.sg .cap{position:absolute;left:0;top:calc(100% + 6px);font:500 .78rem var(--lab);letter-spacing:.16em;text-transform:uppercase;color:var(--red);white-space:nowrap}
.sign{display:block;margin:0 0 -4px 28px;font:400 clamp(3.2rem,11vw,5.2rem)/1.05 var(--sig);color:var(--ink);white-space:nowrap;overflow:visible;padding-right:10px;clip-path:inset(-20% 0 -30% 0);transition:clip-path 2.4s cubic-bezier(.5,.1,.3,1) .3s;max-width:100%}

.flo path{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset 1s ease 2.2s}

.stamp{position:absolute;z-index:5;font:700 clamp(1.7rem,6.4vw,3.6rem)/1 var(--lab);letter-spacing:.1em;text-transform:uppercase;color:var(--red);border:.12em solid currentColor;padding:.08em .3em .08em .38em;border-radius:.12em;transform:rotate(var(--rot,-11deg));opacity:.86;mix-blend-mode:multiply;filter:url(#rough);pointer-events:none;white-space:nowrap}

.jolt{animation:jolt .35s ease}
@keyframes jolt{20%{transform:translate(1px,4px)}45%{transform:translate(-1px,-1px)}70%{transform:translate(0,2px)}}
.st1{right:5%;bottom:calc(100% - 6px);margin-bottom:-4px}

thead th.r{color:#ffe45c;font:700 .95rem var(--lab)}

.end{margin-top:clamp(20px,3vw,32px);text-align:center;font:500 .85rem var(--lab);letter-spacing:.18em;text-transform:uppercase;color:#5b4d10}
.dock{display:none}
@media(max-width:700px){body{padding-bottom:96px}.dock{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:90;gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--blk);border-top:4px solid #ffe45c}.dock .btn{flex:1;min-height:60px;box-shadow:none;padding:6px 8px}.dock .btn:active{transform:none}}

}
