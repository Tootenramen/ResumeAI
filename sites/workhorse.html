 '<div class="acts">'+callBtn.replace('class="btn"','class="btn"')+(email?'<a class="btn o" href="mailto:'+esc(email)+'">'+IC.mail+esc(email)+'</a>':'')+'</div></div></footer>'+
 '<div class="wrap foot"><span>© '+new Date().getFullYear()+' '+esc(name)+'</span></div>'+
 ((phone||email)?'<nav class="bar" aria-label="Contact"><div class="bar-in">'+callBtn+mailBtn+'<button type="button" class="btn o" id="pdf2" aria-label="Download PDF">'+IC.dl+'<span>PDF</span></button></div></nav>':'');
$('#app').innerHTML=out;
[$('#pdf'),$('#pdf2')].forEach(function(b){if(b)b.addEventListener('click',function(){window.print()})});

/* scroll reveal */
var targets=$$('.rv');
if(still||!('IntersectionObserver' in window))targets.forEach(function(t){t.classList.add('in')});
else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.1,rootMargin:'0px 0px -4% 0px'});targets.forEach(function(t){io.observe(t)})}
})();
</script>
