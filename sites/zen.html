var kan=['一','二','三','四','五','六','七'],kn=0;
var secs=[];
if(jobs.length)secs.push(['experience','Experience']);if(skills.length)secs.push(['skills','Skills']);if(certs.length)secs.push(['credentials','Credentials']);if(edu.length)secs.push(['education','Education']);if(langs.length)secs.push(['languages','Languages']);secs.push(['contact','Contact']);
$('#navlist').innerHTML=secs.map(function(s){return '<li><a href="#'+s[0]+'">'+s[1]+'</a></li>'}).join('');

var UL='<svg viewBox="0 0 120 14" aria-hidden="true"><path class="draw" pathLength="1" d="M2 9 C 28 3, 60 12, 118 5"/></svg>';
function head(id,t){var k=kan[kn++]||'';return '<div class="sh fade" ><span class="kn" lang="ja" aria-hidden="true">'+k+'</span><h2 id="h-'+id+'">'+t+'</h2>'+UL+'</div>'}
var out='';
/* hero */
out+='<section class="hero" id="top" aria-labelledby="nm">'+
 '<div class="txt"><p class="eyebrow fade" style="--d:.9s">Résumé</p>'+
 (title?'<p class="ttl fade" style="--d:1.3s">'+esc(title)+'</p>':'')+
 (sum?'<p class="sum fade" style="--d:1.7s">'+esc(sum)+'</p>':'')+
 '<div class="acts fade" style="--d:2.1s">'+(email?'<a class="btn red" href="mailto:'+esc(email)+'">Email me</a>':'')+'<button type="button" class="lnk" id="pdf">Download PDF</button></div>'+
 '<div class="chips fade" style="--d:2.4s">'+(email?'<a href="mailto:'+esc(email)+'">'+esc(email)+'</a>':'')+(phone?'<a href="tel:'+esc(tel)+'">'+esc(phone)+'</a>':'')+'</div></div>'+
 '<div class="vis"><div class="enso">'+
 '<svg class="ring" viewBox="0 0 200 200" aria-hidden="true"><g filter="url(#brush)"><path class="draw" pathLength="1" d="M151.4 38.7 A80 80 0 1 0 178.8 113.9" stroke-width="7" style="--dur:3.4s;--dl:.2s"/><path class="draw" pathLength="1" d="M147 32 A84 84 0 1 0 172 70" stroke-width="3.2" opacity=".7" style="--dur:3s;--dl:.5s"/><path class="draw" pathLength="1" d="M156 46 A76 76 0 1 0 176 100" stroke-width="2" opacity=".5" style="--dur:3.2s;--dl:.35s"/></g></svg>'+
 '<h1 class="nm" id="nm" aria-label="'+esc(name)+'">'+words.map(function(w){return '<span aria-hidden="true">'+esc(w)+'</span>'}).join('')+'</h1>'+
 '<span class="vt" lang="ja" aria-hidden="true">履歴書</span>'+
 '<div class="hanko" aria-hidden="true">'+(initials.length>1?'<span>'+esc(initials[0])+'</span><span>'+esc(initials[1])+'</span>':'<span>'+esc(initials)+'</span>')+'</div></div></div>'+
 '<span class="scrollhint" aria-hidden="true"></span></section>';
var ji=0;
if(jobs.length)out+='<section class="sec" id="experience" aria-labelledby="h-experience">'+head('experience','Experience')+'<div class="body">'+jobs.map(function(j,i){return '<article class="job fade" style="--d:.1s"><div class="when">'+esc(j.dates||'')+(j.loc?'<small>'+esc(j.loc)+'</small>':'')+'</div><div><h3>'+esc(j.role||'')+'</h3>'+(j.co?'<p class="co">'+esc(j.co)+'</p>':'')+(j.text?'<p>'+esc(j.text)+'</p>':'')+'</div></article>'}).join('')+'</div></section>';
if(skills.length)out+='<section class="sec" id="skills" aria-labelledby="h-skills">'+head('skills','Skills')+'<div class="skills">'+skills.map(function(s,i){var lv=Math.max(1,Math.min(5,Math.round(Number(s[1])||3)));return '<div class="sk fade" style="--d:'+(i*.12)+'s"><h3>'+esc(s[0])+'</h3><div class="trk" role="img" aria-label="Level '+lv+' of 5"><span class="fill" style="--w:'+lv*20+'%"></span><span class="n">'+lv+' / 5</span></div></div>'}).join('')+'</div></section>';
if(certs.length)out+='<section class="sec" id="credentials" aria-labelledby="h-credentials">'+head('credentials','Credentials')+'<ul class="certs">'+certs.map(function(c,i){return '<li class="fade" style="--d:'+((i%6)*.1)+'s">'+esc(c)+'</li>'}).join('')+'</ul></section>';
if(edu.length)out+='<section class="sec" id="education" aria-labelledby="h-education">'+head('education','Education')+'<div class="edus">'+edu.map(function(e,i){return '<div class="edu fade" style="--d:'+(i*.15)+'s"><h3>'+esc(e[0]||'')+'</h3>'+(e[2]?'<p class="s">'+esc(e[2])+'</p>':'')+(e[1]?'<p class="d">'+esc(e[1])+'</p>':'')+'</div>'}).join('')+'</div></section>';
if(langs.length)out+='<section class="sec" id="languages" aria-labelledby="h-languages">'+head('languages','Languages')+'<div class="langs">'+langs.map(function(l,i){return '<div class="lang fade" style="--d:'+(i*.15)+'s"><b>'+esc(l[0]||'')+'</b>'+(l[1]?'<span>'+esc(l[1])+'</span>':'')+'</div>'}).join('')+'</div></section>';
out+='<section class="contact" id="contact" aria-labelledby="h-contact"><h2 id="h-contact" class="fade">Let us begin a conversation.</h2>'+(email?'<a class="mail fade" style="--d:.3s" href="mailto:'+esc(email)+'">'+esc(email)+'</a>':'')+(phone?'<p class="ph fade" style="--d:.5s"><a href="tel:'+esc(tel)+'">'+esc(phone)+'</a></p>':'')+
 '<div class="acts fade" style="--d:.7s">'+(email?'<a class="btn red" href="mailto:'+esc(email)+'">Email me</a>':'')+'<button type="button" class="lnk" id="pdf2">Download PDF</button></div>'+
 '<div class="hanko sm fade" id="hk2" aria-hidden="true">'+(initials.length>1?'<span>'+esc(initials[0])+'</span><span>'+esc(initials[1])+'</span>':'<span>'+esc(initials)+'</span>')+'</div></section>'+
 '<footer><span>© '+new Date().getFullYear()+' '+esc(name)+'</span><a href="#top">Return to top ↑</a></footer>';
$('#app').innerHTML=out;
[$('#pdf'),$('#pdf2')].forEach(function(b){if(b)b.addEventListener('click',function(){window.print()})});

/* fit vertical name inside the ring */
var nm=$('#nm'),enso=$('.enso');
function fit(){nm.style.fontSize='100px';var w=nm.offsetWidth,h=nm.offsetHeight,W=enso.clientWidth;var s=Math.min(W*.46/w,W*.56/h)*100;nm.style.fontSize=Math.max(20,Math.min(s,150))+'px'}
fit();var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(fit,120)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

/* intro */
var hero=$('.hero');
if(still)hero.classList.add('go');else requestAnimationFrame(function(){setTimeout(function(){hero.classList.add('go')},250)});

/* reveal on scroll (hero .fade handled by .go; hero children are marked in so IO skips them) */
var targets=$$('.fade').filter(function(t){return !hero.contains(t)});
if(still||!('IntersectionObserver' in window)){targets.forEach(function(t){t.classList.add('in')})}
else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.15,rootMargin:'0px 0px -6% 0px'});targets.forEach(function(t){io.observe(t)})}
$$('.sk').forEach(function(s){s.classList.toggle('in',still)});
if(!still&&'IntersectionObserver' in window){var io2=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io2.unobserve(e.target)}})},{threshold:.4});$$('.sk').forEach(function(s){io2.observe(s)})}
else $$('.sk').forEach(function(s){s.classList.add('in')});
var hk2=$('#hk2');if(hk2&&!still&&'IntersectionObserver' in window){new IntersectionObserver(function(es,o){if(es[0].isIntersecting){hk2.classList.add('in');o.disconnect()}},{threshold:.8}).observe(hk2)}

/* nav spy + progress */
var links=$$('#navlist a'),hdr=$('#hdr'),tick=false;
if('IntersectionObserver' in window){var spy=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)links.forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id)})})},{rootMargin:'-40% 0px -55% 0px'});secs.forEach(function(s){var el=document.getElementById(s[0]);if(el)spy.observe(el)})}
function upd(){var h=root.scrollHeight-innerHeight;hdr.style.setProperty('--p',h>0?Math.min(1,scrollY/h):0);tick=false}
addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});upd();

/* ink blot on click */
if(!still&&document.body.animate){document.addEventListener('pointerdown',function(e){if(e.target.closest('a,button'))return;var b=document.createElement('div');b.className='blot';b.style.left=e.clientX+'px';b.style.top=e.clientY+'px';document.body.appendChild(b);var a=b.animate([{transform:'scale(.1)',opacity:.9},{transform:'scale(1.5)',opacity:0}],{duration:2600,easing:'cubic-bezier(.2,.6,.3,1)'});a.onfinish=function(){b.remove()}})}
})();
</script>
</body>
</html>
